name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# The token can only read the code: a pull request cannot push, approve or publish anything.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # The check names "Tests (Node 20)" and "Tests (Node 24)" are required by .github/rulesets/main.json.
    # Rename them in both places, or pull requests will wait for a check that never comes.
    name: Tests (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # 20 is the oldest version the library supports (engines in package.json); 24 is the current LTS.
        node: [20, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      # .npmrc sets ignore-scripts=true, so dependencies cannot run install scripts here either.
      - run: npm ci --no-audit --no-fund
      - run: npm run i18n:check
      # A simulated Claude in a temporary copy: no tokens, no secrets needed.
      - run: npm test
      # Each failed test becomes an annotation on the pull request, readable without opening the log.
      - name: Failed tests as annotations
        if: failure()
        run: |
          node --input-type=module -e "
          import fs from 'node:fs';
          const esc = (s) => String(s || '').replace(/%/g, '%25').replace(/\r/g, '%0D').replace(/\n/g, '%0A');
          const r = JSON.parse(fs.readFileSync('outputs/test-results.json', 'utf8'));
          for (const t of r.tests.filter((x) => x.status === 'fail')) console.log('::error title=' + esc(t.group).replace(/:/g, '%3A').replace(/,/g, '%2C') + '::' + esc(t.en + ': ' + t.error));
          "
