<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Library</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='9' fill='%232f6f62'/><path d='M9 9h4v14H9zM14.5 9h4v14h-4zM20.5 10.2l3.6-1 3 13.6-3.6 1z' fill='%23f7f4ee'/></svg>">
  <link rel="stylesheet" href="/fonts/inter/index.css">
  <link rel="stylesheet" href="/fonts/literata/index.css">
  <script src="/theme.js"></script>
  <script src="/vendor/tailwind.js"></script>
  <style type="text/tailwindcss">
    @custom-variant dark (&:where(.dark, .dark *));

    @theme {
      --font-sans: "Inter Variable", ui-sans-serif, system-ui, sans-serif;
      --font-serif: "Literata Variable", ui-serif, Georgia, serif;

      --color-paper: #f6f3ec;
      --color-panel: #fffdf9;
      --color-ink: #26231e;
      --color-muted: #7a7266;
      --color-line: #e7e1d5;

      --color-night: #12110f;
      --color-night-panel: #1b1a17;
      --color-night-line: #2e2b26;
      --color-night-ink: #ece7dd;
      --color-night-muted: #9d958a;

      --color-sage-50: #eef5f2;
      --color-sage-100: #d7e9e2;
      --color-sage-200: #b1d3c6;
      --color-sage-400: #5fa08c;
      --color-sage-500: #3f8571;
      --color-sage-600: #2f6f62;
      --color-sage-700: #255a4f;
      --color-sage-900: #163731;

      --color-clay-100: #f6e4d6;
      --color-clay-400: #d98a55;
      --color-clay-500: #c2703d;

      --shadow-soft: 0 1px 2px rgb(38 35 30 / .04), 0 8px 24px -12px rgb(38 35 30 / .12);
      --shadow-lift: 0 2px 4px rgb(38 35 30 / .05), 0 18px 40px -16px rgb(38 35 30 / .22);
      --animate-rise: rise .35s cubic-bezier(.2,.8,.2,1) both;
    }

    @keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

    @layer base {
      html { -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; }
      body { @apply bg-paper text-ink font-sans dark:bg-night dark:text-night-ink; }
      ::selection { @apply bg-sage-200 text-sage-900; }
      :focus-visible { @apply outline-2 outline-offset-2 outline-sage-500; }
      [v-cloak] { display: none; }
    }

    @utility btn {
      @apply inline-flex items-center justify-center gap-2 rounded-full px-4 py-2 text-sm font-medium transition active:scale-[.98] disabled:opacity-50 disabled:pointer-events-none;
    }

    @layer components {
      .card { @apply rounded-3xl border border-line/80 bg-panel shadow-soft dark:border-night-line dark:bg-night-panel; }
      .card-hover { @apply transition duration-200 hover:-translate-y-0.5 hover:shadow-lift hover:border-sage-200 dark:hover:border-sage-700; }
      .eyebrow { @apply text-[11px] font-semibold uppercase tracking-[.14em] text-muted dark:text-night-muted; }
      .chip { @apply inline-flex items-center gap-1 rounded-full px-2.5 py-0.5 text-xs font-medium; }
      .btn-primary { @apply btn bg-sage-600 text-white shadow-soft hover:bg-sage-700; }
      .btn-ghost { @apply btn text-ink/80 hover:bg-ink/5 dark:text-night-ink/80 dark:hover:bg-white/5; }
      .btn-soft { @apply btn bg-sage-50 text-sage-700 hover:bg-sage-100 dark:bg-sage-900/40 dark:text-sage-200 dark:hover:bg-sage-900/70; }
      .kbd { @apply rounded-md border border-line bg-paper px-1.5 py-0.5 font-sans text-[10px] font-semibold text-muted dark:border-night-line dark:bg-night dark:text-night-muted; }
      .field { @apply w-full min-w-0 rounded-xl border border-line bg-paper px-3 py-1.5 text-sm outline-none transition focus:border-sage-400 dark:border-night-line dark:bg-night; }
      .nav-item { @apply flex w-full items-center gap-3 rounded-xl px-3 py-2 text-sm text-ink/75 transition hover:bg-ink/5 hover:text-ink dark:text-night-ink/70 dark:hover:bg-white/5 dark:hover:text-night-ink; }
      .nav-item.active { @apply bg-panel text-ink shadow-soft dark:bg-night-panel dark:text-night-ink; }
      .nav-group { @apply flex w-full items-center gap-2 rounded-lg px-3 pb-1.5 pt-1 text-left text-[11px] font-semibold uppercase tracking-[.14em] text-muted transition hover:text-ink dark:text-night-muted dark:hover:text-night-ink; }

      /* Четивен текст на wiki страниците */
      .reading { @apply font-serif text-[17.5px] leading-[1.75] text-ink/90 dark:text-night-ink/90; }
      .reading > * + * { @apply mt-5; }
      .reading .blk > :first-child { @apply mt-0; } /* „Писане с wiki“: абзац по абзац, отстъпът е на обвивката */
      .reading .blk > * + * { @apply mt-5; }
      .reading h1 { @apply font-serif text-3xl font-semibold tracking-tight; }
      .reading h2 { @apply mt-12 scroll-mt-24 border-b border-line pb-2 font-sans text-xl font-semibold tracking-tight text-ink dark:border-night-line dark:text-night-ink; }
      .reading h3 { @apply mt-8 scroll-mt-24 font-sans text-base font-semibold text-ink dark:text-night-ink; }
      .reading strong { @apply font-semibold text-ink dark:text-night-ink; }
      .reading ul { @apply list-disc space-y-1.5 pl-6 marker:text-sage-400; }
      .reading ol { @apply list-decimal space-y-1.5 pl-6 marker:text-muted; }
      .reading li > ul, .reading li > ol { @apply mt-1.5; }
      .reading blockquote { @apply rounded-2xl border-l-4 border-clay-400 bg-clay-100/50 px-5 py-3 font-serif italic text-ink/80 dark:bg-clay-500/10 dark:text-night-ink/80; }
      .reading code { @apply rounded-md bg-ink/5 px-1.5 py-0.5 font-mono text-[.85em] dark:bg-white/10; }
      .reading pre { @apply overflow-x-auto rounded-2xl bg-ink/[.04] p-4 text-sm leading-relaxed dark:bg-white/5; }
      .reading pre code { @apply bg-transparent p-0; }
      .reading hr { @apply my-10 border-line dark:border-night-line; }
      .reading table { @apply block w-full overflow-x-auto font-sans text-sm; border-collapse: collapse; }
      .reading th { @apply border-b-2 border-line px-3 py-2 text-left font-semibold dark:border-night-line; }
      .reading td { @apply border-b border-line px-3 py-2 align-top dark:border-night-line; }
      .reading a { @apply text-sage-700 underline decoration-sage-200 underline-offset-4 transition hover:decoration-sage-500 dark:text-sage-200 dark:decoration-sage-700; }
      .reading a.wl { @apply cursor-pointer rounded-md bg-sage-50 px-[3px] no-underline hover:bg-sage-100 dark:bg-sage-900/40 dark:hover:bg-sage-900/80; }
      .reading a.pg { @apply cursor-pointer rounded-md px-[3px] font-sans text-[.85em] font-medium text-clay-500 no-underline ring-1 ring-clay-400/30 transition hover:bg-clay-100 dark:text-clay-400 dark:hover:bg-clay-500/15; }
      .reading a.wl.missing { @apply bg-transparent text-clay-500 underline decoration-dashed decoration-clay-400; }
      .reading img { @apply rounded-2xl; }

      .scrollbar-thin { scrollbar-width: thin; scrollbar-color: rgb(0 0 0 / .15) transparent; }
      .dark .scrollbar-thin { scrollbar-color: rgb(255 255 255 / .12) transparent; }
      .grain { background-image: radial-gradient(1200px 500px at 10% -10%, rgb(95 160 140 / .14), transparent 60%), radial-gradient(900px 400px at 100% 0%, rgb(217 138 85 / .10), transparent 55%); }
      .dark .grain { background-image: radial-gradient(1200px 500px at 10% -10%, rgb(95 160 140 / .10), transparent 60%), radial-gradient(900px 400px at 100% 0%, rgb(217 138 85 / .06), transparent 55%); }
    }
  </style>
</head>
<body>
<div id="app" v-cloak></div>

<!-- ============================ ШАБЛОН НА ПРИЛОЖЕНИЕТО ============================ -->
<script type="text/x-template" id="tpl-app">
<div class="flex min-h-dvh">

  <!-- Странична лента -->
  <div v-if="drawer" class="fixed inset-0 z-30 bg-ink/30 backdrop-blur-sm lg:hidden" @click="drawer=false"></div>
  <aside v-if="!focusOn" :class="['fixed inset-y-0 left-0 z-40 flex w-[288px] flex-col border-r border-line/70 bg-paper/95 backdrop-blur-xl transition-transform duration-300 dark:border-night-line dark:bg-night/95 lg:sticky lg:top-0 lg:h-dvh lg:translate-x-0', navHidden && 'lg:hidden', drawer ? 'translate-x-0' : '-translate-x-full']">
    <div class="flex items-center gap-3 px-5 pt-6 pb-4">
      <a href="#/" class="flex items-center gap-3" @click="drawer=false">
        <span class="grid size-10 place-items-center rounded-2xl bg-sage-600 text-white shadow-soft">
          <ic name="library" class="size-5"></ic>
        </span>
        <span>
          <span class="block font-serif text-lg font-semibold leading-tight">{{ $t('Library') }}</span>
          <span class="block text-xs text-muted dark:text-night-muted">{{ $t('{0} pages · {1} files', [stats.pages || 0, stats.raw || 0]) }}</span>
        </span>
      </a>
      <button class="btn-ghost ml-auto hidden !p-2 lg:block" @click="setNav(false)" :title="$t('Hide the sidebar')" :aria-label="$t('Hide the sidebar')"><ic name="panel" class="size-5"></ic></button>
    </div>

    <div class="px-4">
      <button data-tour="search" @click="openPalette" class="flex w-full items-center gap-2.5 rounded-2xl border border-line bg-panel px-3.5 py-2.5 text-sm text-muted shadow-soft transition hover:border-sage-200 dark:border-night-line dark:bg-night-panel dark:text-night-muted">
        <ic name="search" class="size-4"></ic>
        <span class="flex-1 text-left">{{ $t('Search') }}</span>
        <span class="kbd">{{ isMac ? '⌘' : 'Ctrl' }} K</span>
      </button>
    </div>

    <nav class="scrollbar-thin mt-4 flex-1 space-y-5 overflow-y-auto px-3 pb-6" :aria-label="$t('Menu')">
      <div class="space-y-0.5">
        <a data-tour="home" href="#/" :class="['nav-item', route.name==='home' && 'active']" @click="drawer=false"><ic name="home" class="size-4"></ic>{{ $t('Home') }}</a>
      </div>

      <!-- Учене и писане: всичко, което работи с модела -->
      <div v-if="!ro" data-tour="work">
        <button type="button" class="nav-group" :aria-expanded="navOpen('work')" @click="navToggle('work')"><span class="flex-1">{{ $t('Learn and write') }}</span><ic name="chevron" :class="['size-3 transition', navOpen('work') && 'rotate-90']"></ic></button>
        <div v-show="navOpen('work')" class="space-y-0.5">
          <a href="#/path" :class="['nav-item', route.name==='path' && 'active']" @click="drawer=false"><ic name="route" class="size-4"></ic>{{ $t('Learn by question') }}</a>
          <a href="#/write" :class="['nav-item', route.name==='write' && 'active']" @click="drawer=false"><ic name="pen" class="size-4"></ic>{{ $t('Write with the wiki') }}</a>
          <a href="#/find" :class="['nav-item', route.name==='find' && 'active']" @click="drawer=false"><ic name="link" class="size-4"></ic>{{ $t('Add an article') }}</a>
        </div>
      </div>

      <!-- Библиотеката като цяло -->
      <div data-tour="lib">
        <button type="button" class="nav-group" :aria-expanded="navOpen('lib')" @click="navToggle('lib')"><span class="flex-1">{{ $t('Library') }}</span><ic name="chevron" :class="['size-3 transition', navOpen('lib') && 'rotate-90']"></ic></button>
        <div v-show="navOpen('lib')" class="space-y-0.5">
          <a href="#/p/index" :class="['nav-item', route.slug==='index' && 'active']" @click="drawer=false"><ic name="list" class="size-4"></ic>{{ $t('Index') }}</a>
          <a href="#/log" :class="['nav-item', (route.name==='log' || route.slug==='log') && 'active']" @click="drawer=false"><ic name="clock" class="size-4"></ic>{{ $t('Log') }}</a>
          <a href="#/graph" :class="['nav-item', route.name==='graph' && 'active']" @click="drawer=false"><ic name="graph" class="size-4"></ic>{{ $t('Link map') }}</a>
          <a v-if="!ro" href="#/areas" :class="['nav-item', route.name==='areas' && 'active']" @click="drawer=false"><ic name="grid" class="size-4"></ic>{{ $t('Areas') }}</a>
        </div>
      </div>

      <!-- Колекции: видовете от wiki/ (ред и скриване в #/collections), умните колекции и ръчните списъци -->
      <div data-tour="cols">
        <div class="flex items-center">
          <button type="button" class="nav-group flex-1" :aria-expanded="navOpen('col')" @click="navToggle('col')"><span class="flex-1">{{ $t('Collections') }}</span><ic name="chevron" :class="['size-3 transition', navOpen('col') && 'rotate-90']"></ic></button>
          <template v-if="!ro">
            <button type="button" class="btn-ghost !p-1 text-muted" :title="$t('New collection')" :aria-label="$t('New collection')" @click="openColEditor({ kind: 'smart' })"><ic name="plus" class="size-3.5"></ic></button>
            <a href="#/collections" class="btn-ghost !p-1 text-muted" :title="$t('Arrange the collections')" :aria-label="$t('Arrange the collections')" @click="drawer=false"><ic name="gear" class="size-3.5"></ic></a>
          </template>
        </div>
        <div v-show="navOpen('col')" class="space-y-0.5">
          <a v-for="x in navTypes" :key="x.t" :href="'#/c/'+x.t" @click="drawer=false"
             :class="['nav-item', route.name==='collection' && route.type===x.t && 'active']">
            <span :class="['grid size-6 place-items-center rounded-lg', typeInfo(x.t).soft]"><ic :name="typeInfo(x.t).icon" class="size-3.5"></ic></span>
            <span class="min-w-0 flex-1 truncate">{{ typeInfo(x.t).plural }}</span>
            <span class="text-xs tabular-nums text-muted dark:text-night-muted">{{ x.n }}</span>
          </a>
          <a v-for="c in collections.items" :key="c.id" :href="'#/col/'+c.id" @click="drawer=false"
             :class="['nav-item', route.name==='custom' && route.id===c.id && 'active']">
            <span :class="['grid size-6 place-items-center rounded-lg', COL_STYLE[c.kind].soft]"><ic :name="COL_STYLE[c.kind].icon" class="size-3.5"></ic></span>
            <span class="min-w-0 flex-1 truncate">{{ c.name }}</span>
            <span class="text-xs tabular-nums text-muted dark:text-night-muted">{{ colCount(c) }}</span>
          </a>
        </div>
      </div>

      <div v-if="stats.tags?.length">
        <button type="button" class="nav-group" :aria-expanded="navOpen('tags')" @click="navToggle('tags')"><span class="flex-1">{{ $t('Tags') }}</span><ic name="chevron" :class="['size-3 transition', navOpen('tags') && 'rotate-90']"></ic></button>
        <div v-show="navOpen('tags')" class="flex flex-wrap gap-1.5 px-3">
          <a v-for="[t,n] in stats.tags.slice(0,16)" :key="t" :href="'#/tag/'+encodeURIComponent(t)" @click="drawer=false"
             :class="['chip border transition', route.tag===t ? 'border-sage-500 bg-sage-50 text-sage-700 dark:bg-sage-900/50 dark:text-sage-200' : 'border-line text-ink/70 hover:border-sage-200 dark:border-night-line dark:text-night-ink/70']">
            #{{ t }} <span class="text-muted">{{ n }}</span>
          </a>
        </div>
      </div>

      <!-- Системата: инсталация и настройки -->
      <div v-if="!ro">
        <button type="button" class="nav-group" :aria-expanded="navOpen('sys')" @click="navToggle('sys')"><span class="flex-1">{{ $t('System') }}</span><ic name="chevron" :class="['size-3 transition', navOpen('sys') && 'rotate-90']"></ic></button>
        <div v-show="navOpen('sys')" class="space-y-0.5">
          <a href="#/setup" :class="['nav-item', route.name==='setup' && 'active']" @click="drawer=false"><ic name="check" class="size-4"></ic><span class="flex-1">{{ $t('Setup') }}</span><span v-if="setupLeft" class="size-2 rounded-full bg-amber-500" :title="$t('{0} required steps are left.', [setupLeft])"></span></a>
          <a data-tour="settings" href="#/settings" :class="['nav-item', route.name==='settings' && 'active']" @click="drawer=false"><ic name="gear" class="size-4"></ic>{{ $t('Settings') }}</a>
        </div>
      </div>
      <!-- Помощ: приветствие и документация -->
      <div v-if="!ro">
        <button type="button" class="nav-group" :aria-expanded="navOpen('help')" @click="navToggle('help')"><span class="flex-1">{{ $t('Help') }}</span><ic name="chevron" :class="['size-3 transition', navOpen('help') && 'rotate-90']"></ic></button>
        <div v-show="navOpen('help')" class="space-y-0.5">
          <a href="#/welcome" :class="['nav-item', route.name==='welcome' && 'active']" @click="drawer=false"><ic name="flag" class="size-4"></ic>{{ $t('Welcome and tour') }}</a>
          <a data-tour="docs" href="#/docs" :class="['nav-item', route.name==='docs' && 'active']" @click="drawer=false"><ic name="docs" class="size-4"></ic>{{ $t('Documentation') }}</a>
        </div>
      </div>
    </nav>

    <!-- Режим на работа: обикновен или защитен; отваря обяснението и превключвателя -->
    <a v-if="!ro && appInfo" href="#/settings/mode" @click="drawer=false"
       :class="['mx-3 mb-3 flex items-center gap-3 rounded-2xl border px-3 py-2 text-left text-sm transition', appInfo.mode==='safe' ? 'border-sage-200 bg-sage-50 text-sage-800 dark:border-sage-700 dark:bg-sage-900/40 dark:text-sage-200' : 'border-line text-muted hover:border-sage-200 dark:border-night-line dark:text-night-muted']">
      <ic :name="appInfo.mode==='safe' ? 'lock' : 'monitor'" class="size-4 shrink-0"></ic>
      <span class="min-w-0 flex-1">
        <span class="block truncate font-medium">{{ appInfo.mode==='safe' ? $t('Safe mode') : $t('Normal mode') }}</span>
        <span class="block truncate text-xs opacity-80">{{ appInfo.mode==='safe' ? $t('Protected. What does it cover?') : $t('Not protected. Learn about safe mode') }}</span>
      </span>
    </a>
    <button v-if="!ro && appInfo?.launcher" type="button" class="mx-3 mb-3 flex items-center gap-3 rounded-2xl px-3 py-2 text-left text-sm text-muted transition hover:bg-ink/5 hover:text-ink dark:text-night-muted dark:hover:bg-white/5 dark:hover:text-night-ink" @click="quitApp">
      <ic name="power" class="size-4 shrink-0"></ic>{{ $t('Quit the library') }}
    </button>

    <a v-if="!ro && (agent?.current || agent?.paused?.reason==='limit')" href="#/" @click="drawer=false"
       :class="['mx-3 mb-3 flex items-center gap-3 rounded-2xl px-3 py-2.5 text-sm shadow-soft transition', agent.current ? 'bg-sage-600 text-white hover:bg-sage-700' : 'bg-amber-100 text-amber-800 dark:bg-amber-500/15 dark:text-amber-300']">
      <ic :name="agent.current ? 'spinner' : 'clock'" :class="['size-4 shrink-0', agent.current && 'animate-spin']"></ic>
      <span class="min-w-0 flex-1">
        <span class="block truncate font-medium">{{ agent.current ? $t('{ai} is working') : $t('Limit reached') }}</span>
        <span class="block truncate text-xs opacity-80">{{ agent.current ? (agent.current.label + (agent.current.total > 1 ? ' · ' + agent.current.index + $t(' of ') + agent.current.total : '')) : (agent.queue.length + $t(' in the queue')) }}</span>
      </span>
    </a>

    <button v-if="!ro" type="button" :class="['mx-3 mb-3 flex items-center gap-3 rounded-2xl border px-3 py-2.5 text-left text-sm transition', syncStale ? 'border-amber-300 bg-amber-50 text-amber-900 hover:bg-amber-100 dark:border-amber-500/40 dark:bg-amber-500/10 dark:text-amber-200' : 'border-line hover:bg-ink/5 dark:border-night-line dark:hover:bg-white/5']" @click="syncButton">
      <ic name="cloud" class="size-4 shrink-0"></ic>
      <span class="min-w-0 flex-1">
        <span class="block truncate font-medium">{{ syncInfo.length ? $t('Copy to other folders') : $t('Set up a backup') }}</span>
        <span class="block truncate text-xs opacity-80">{{ syncLine }}</span>
      </span>
    </button>

    <div class="flex items-center justify-between border-t border-line/70 px-4 py-3 dark:border-night-line">
      <span v-if="ro" class="text-xs text-muted dark:text-night-muted">{{ $t('Read-only copy') }}</span>
      <span v-else class="flex items-center gap-2 text-xs text-muted dark:text-night-muted" :title="live ? $t('The page refreshes itself while {ai} writes') : $t('No connection to the server')">
        <span class="relative flex size-2">
          <span v-if="live" class="absolute inline-flex size-full animate-ping rounded-full bg-sage-400 opacity-60"></span>
          <span :class="['relative inline-flex size-2 rounded-full', live ? 'bg-sage-500' : 'bg-clay-400']"></span>
        </span>
        {{ live ? $t('Live') : $t('Offline') }}
      </span>
      <select v-if="!ro && I18N.locales.length > 1" :value="I18N.lang" @change="changeLang" :aria-label="$t('Language')" :title="$t('Language')"
              class="rounded-full border border-line bg-transparent px-2 py-1 text-xs text-muted outline-none dark:border-night-line dark:text-night-muted">
        <option v-for="l in I18N.locales" :key="l.code" :value="l.code" class="text-ink">{{ l.name }}</option>
      </select>
      <div class="flex rounded-full border border-line p-0.5 dark:border-night-line">
        <button v-for="m in ['light','system','dark']" :key="m" @click="setTheme(m)" :title="{light:$t('Light theme'),system:$t('System theme'),dark:$t('Dark theme')}[m]"
                :class="['grid size-7 place-items-center rounded-full transition', theme===m ? 'bg-panel shadow-soft dark:bg-night-panel' : 'text-muted hover:text-ink dark:hover:text-night-ink']">
          <ic :name="{light:'sun',system:'monitor',dark:'moon'}[m]" class="size-3.5"></ic>
        </button>
      </div>
    </div>
  </aside>

  <button v-if="navHidden && !focusOn" class="btn-ghost fixed left-3 top-3 z-30 hidden !p-2 lg:block" @click="setNav(true)" :title="$t('Show the sidebar')" :aria-label="$t('Show the sidebar')"><ic name="panel" class="size-5"></ic></button>

  <!-- Основна част -->
  <div class="grain flex min-w-0 flex-1 flex-col">
    <header v-if="!focusOn" class="sticky top-0 z-20 flex items-center gap-3 border-b border-line/60 bg-paper/80 px-4 py-3 backdrop-blur-xl dark:border-night-line dark:bg-night/80 lg:hidden">
      <button class="btn-ghost !p-2" @click="drawer=true" :aria-label="$t('Menu')"><ic name="menu" class="size-5"></ic></button>

      <graph-view v-else-if="route.name==='graph'" :version="version"></graph-view>
      <find-view v-else-if="route.name==='find'" @toast="toast" @refresh="refresh"></find-view>

      <welcome-view v-else-if="route.name==='welcome' && !ro" :agent="agent" @tour="startTour" @finish="finishWelcome"></welcome-view>
      <docs-view v-else-if="route.name==='docs' && !ro" :id="route.id"></docs-view>

  </div>

  <!-- Оценка на токени и цена преди действие с Claude -->
  <transition enter-from-class="opacity-0" leave-to-class="opacity-0" enter-active-class="transition duration-150" leave-active-class="transition duration-100">
    <div v-if="cost" class="fixed inset-0 z-[60] flex items-center justify-center bg-ink/30 p-4 backdrop-blur-sm" @keydown.esc="costAnswer(false)" @mousedown.self="costAnswer(false)">
      <div class="card w-full max-w-lg animate-rise !shadow-lift" role="dialog" aria-modal="true" aria-labelledby="cost-title">
        <div class="p-6">
          <p class="eyebrow">{{ $t('Before sending to {ai}') }}</p>
          <h2 id="cost-title" class="mt-1 font-serif text-2xl font-semibold">{{ cost.est?.title || $t('Cost estimate') }}</h2>

          <p v-if="cost.loading" class="mt-5 text-sm text-muted dark:text-night-muted">{{ $t('Calculating…') }}</p>
          <p v-else-if="cost.error" class="mt-5 rounded-2xl bg-clay-100/60 p-3 text-sm dark:bg-clay-500/10">{{ cost.error }}</p>

          <template v-else-if="cost.est">
            <div class="mt-5 grid grid-cols-3 gap-3 text-center">
              <div class="rounded-2xl bg-ink/[.04] p-3 dark:bg-white/5"><p class="text-[11px] uppercase tracking-wide text-muted dark:text-night-muted">{{ $t('You are sending') }}</p><p class="mt-1 text-lg font-semibold tabular-nums">≈ {{ fmtTok(cost.est.input - cost.est.cached) }}</p><p class="text-[11px] text-muted dark:text-night-muted">{{ $t('tokens') }}</p></div>
              <div class="rounded-2xl bg-ink/[.04] p-3 dark:bg-white/5"><p class="text-[11px] uppercase tracking-wide text-muted dark:text-night-muted">{{ $t('Reply') }}</p><p class="mt-1 text-lg font-semibold tabular-nums">≈ {{ fmtTok(cost.est.output) }}</p><p class="text-[11px] text-muted dark:text-night-muted">{{ $t('tokens') }}</p></div>
              <div class="rounded-2xl bg-sage-50 p-3 dark:bg-sage-900/40"><p class="text-[11px] uppercase tracking-wide text-sage-700 dark:text-sage-200">{{ $t('Cost') }}</p>
                <template v-if="cost.est.free"><p class="mt-1 text-lg font-semibold">{{ $t('free') }}</p><p class="text-[11px] text-muted dark:text-night-muted">{{ cost.est.local ? $t('on this computer') : cost.est.manual ? $t('copied by hand') : $t('within the limits') }}</p></template>
                <template v-else-if="cost.est.usd"><p class="mt-1 text-lg font-semibold tabular-nums">{{ fmtUsd(cost.est.usd.mid) }}</p><p class="text-[11px] text-muted dark:text-night-muted">{{ $t('{0} to {1}', [fmtUsd(cost.est.usd.low), fmtUsd(cost.est.usd.high)]) }}</p></template>
                <template v-else><p class="mt-1 text-lg font-semibold">–</p><p class="text-[11px] text-muted dark:text-night-muted">{{ $t('no prices set') }}</p></template>
              </div>
            </div>
            <p v-if="cost.est.manual" class="mt-3 rounded-xl bg-sage-50 p-2 text-xs text-sage-800 dark:bg-sage-900/40 dark:text-sage-200">{{ $t('About {0} requests to copy into the chat and answers to paste back. A window opens for each one.', [cost.est.calls || 1]) }}</p>
            <p v-else-if="cost.est.free && !cost.est.local && cost.est.calls > 1" class="mt-3 rounded-xl bg-sage-50 p-2 text-xs text-sage-800 dark:bg-sage-900/40 dark:text-sage-200">{{ $t('About {0} requests. Free tiers limit the requests per day: if the limit runs out, the job waits for the reset and starts again from the beginning of that source.', [cost.est.calls]) }}</p>
            <p class="mt-3 text-xs text-muted dark:text-night-muted">
              {{ $t('Model: {0}.', [cost.est.models.join(' + ')]) }}
              <template v-if="cost.est.engine && cost.est.engine !== 'agent' && cost.est.calls > 1">{{ $t('{0} requests in total.', [cost.est.calls]) }}</template>
              <template v-if="cost.est.cached > 0">{{ $t('Another ≈ {0} tokens are re-read from the cache in the following steps (cheaper, included in the price).', [fmtTok(cost.est.cached)]) }}</template>
            </p>

            <ul v-if="cost.est.items?.length" class="mt-3 max-h-40 space-y-1 overflow-y-auto text-xs scrollbar-thin">
              <li v-for="it in cost.est.items" :key="it.name" class="flex items-center gap-2">
                <span class="min-w-0 flex-1 truncate">{{ it.name }}</span>
                <span class="text-muted dark:text-night-muted tabular-nums">{{ $t('≈ {0} tokens', [fmtTok(it.tokens)]) }}</span>
                <span class="w-14 text-right tabular-nums">{{ cost.est.free ? '' : it.usd == null ? '–' : fmtUsd(it.usd) }}</span>
              </li>
              <li v-if="cost.est.itemsMore" class="text-muted dark:text-night-muted">{{ $t('and {0} more', [cost.est.itemsMore]) }}</li>
            </ul>
            <p v-if="cost.est.delegate" class="mt-2 text-xs text-muted dark:text-night-muted">{{ $t('Chapters are read by {0}, pages are written by {1}.', [cost.est.reader, cost.est.writer]) }}</p>
            <p v-if="cost.est.past" class="mt-2 text-xs text-muted dark:text-night-muted">{{ $t('So far such tasks have cost {0} on average (the last {1}, as reported by {ai}).', [fmtUsd(cost.est.past.avg), cost.est.past.n]) }}</p>
            <p v-for="w in cost.est.warnings" :key="w" class="mt-2 rounded-xl bg-amber-50 p-2 text-xs text-amber-800 dark:bg-amber-500/10 dark:text-amber-200">{{ w }}</p>

            <p v-if="cost.est.engine === 'agent' && cost.est.claude !== false" class="mt-4 text-xs leading-relaxed text-muted dark:text-night-muted">
              {{ $t('Approximate: tokens are counted from characters (error about ±30%), and the cost is a range because Claude Code reads in several steps and adds its own system text (≈ {0} tokens per run). The sum uses API prices from {1} (', [fmtTok(cost.est.overhead), cost.est.priceDate.split('-').reverse().join('.')]) }}<a href="https://platform.claude.com/docs/en/about-claude/pricing" target="_blank" rel="noopener" class="underline">platform.claude.com</a>{{ $t('). If you use a subscription you do not pay per token: the sum shows how heavy the action is for your limit.') }}
            </p>
            <p v-else-if="cost.est.engine === 'agent'" class="mt-4 text-xs leading-relaxed text-muted dark:text-night-muted">{{ $t('Approximate: tokens are counted from characters (error about ±30%), and Claude Code reads in several steps and adds its own system text (≈ {0} tokens per run). The sum uses the prices entered for the model in Settings → Model.', [fmtTok(cost.est.overhead)]) }}</p>
            <p v-else-if="cost.est.local" class="mt-4 text-xs leading-relaxed text-muted dark:text-night-muted">{{ $t('The model runs on this computer: nothing is paid and nothing leaves the computer. The tokens show how long the work will take.') }}</p>
            <p v-else-if="cost.est.manual" class="mt-4 text-xs leading-relaxed text-muted dark:text-night-muted">{{ $t('Nothing is sent by itself. The limits are those of your chat account; if a request is too long for the chat, lower “Context” in Settings → Model.') }}</p>
            <p v-else class="mt-4 text-xs leading-relaxed text-muted dark:text-night-muted">{{ $t('Approximate: tokens are counted from characters (error about ±30%). Without tools the server sends exactly the text of each request, so the range is narrower. The sum uses the prices entered for the model in Settings → Model.') }}</p>
          </template>

          <label class="mt-4 flex cursor-pointer items-center gap-2 text-xs text-muted dark:text-night-muted"><input type="checkbox" class="accent-sage-600" v-model="cost.never"> {{ $t('Do not show this estimate again (it comes back in the settings on the home page)') }}</label>
        </div>
        <div class="flex justify-end gap-2 border-t border-line px-6 py-4 dark:border-night-line">
          <button class="btn-ghost" @click="costAnswer(false)">{{ $t('Cancel') }}</button>
          <button class="btn-primary" :disabled="cost.loading" @click="costAnswer(true)">{{ cost.error ? $t('Continue without estimate') : AI.engine === 'manual' ? $t('Start') : $t('Send to {ai}') }}</button>
        </div>
      </div>
    </div>
  </transition>

  <sync-modal v-if="syncReq" :req="syncReq" @close="closeSync"></sync-modal>

  <tour-overlay v-if="tour" @close="tour=false"></tour-overlay>

  <!-- Сървърът е спрян от бутона „Спри библиотеката“ -->

      <span class="mx-auto grid size-14 place-items-center rounded-2xl bg-sage-600 text-white shadow-soft"><ic name="power" class="size-7"></ic></span>
      <h1 class="mt-5 font-serif text-2xl font-semibold">{{ $t('The library has stopped') }}</h1>
      <p class="mt-2 text-sm text-muted dark:text-night-muted">{{ $t('You can close this window. To open the library again, use its shortcut on the desktop or in the Start menu.') }}</p>
    </div>
  </div>

  <!-- Нова или съществуваща колекция: умна (по филтър) или ръчен списък -->
  <div v-if="colEdit" class="fixed inset-0 z-[58] flex items-center justify-center bg-ink/30 p-4 backdrop-blur-sm" @keydown.esc="colEdit=null" @mousedown.self="colEdit=null">
    <form class="card flex max-h-[92vh] w-full max-w-xl animate-rise flex-col !shadow-lift" role="dialog" aria-modal="true" aria-labelledby="col-title" @submit.prevent="saveColEditor">
      <div class="scrollbar-thin overflow-y-auto p-6">
        <p class="eyebrow">{{ $t('Collection') }}</p>
        <h2 id="col-title" class="mt-1 font-serif text-2xl font-semibold">{{ colEdit.id ? $t('Edit the collection') : $t('New collection') }}</h2>

        <div v-if="!colEdit.id" class="mt-4 grid grid-cols-2 gap-2" role="radiogroup" :aria-label="$t('Kind of collection')">
          <label v-for="k in ['smart','list']" :key="k" :class="['flex cursor-pointer items-start gap-2 rounded-2xl border p-3 text-sm', colEdit.kind===k ? 'border-sage-500 bg-sage-50 dark:bg-sage-900/30' : 'border-line dark:border-night-line']">
            <input type="radio" class="mt-1 accent-sage-600" :value="k" v-model="colEdit.kind">
            <span><span class="block font-medium">{{ k==='smart' ? $t('Smart collection') : $t('List') }}</span>
              <span class="block text-xs text-muted dark:text-night-muted">{{ k==='smart' ? $t('Fills itself with the pages that match the conditions.') : $t('You add pages by hand and choose their order.') }}</span></span>
          </label>
        </div>

        <label class="mt-4 block text-sm font-medium" for="col-name">{{ $t('Name') }}</label>
        <input id="col-name" ref="colName" v-model="colEdit.name" maxlength="80" class="field mt-1 !py-2" :placeholder="colEdit.kind==='list' ? $t('For example: For my thesis') : $t('For example: Books on psychosomatics')">

        <template v-if="colEdit.kind==='smart'">
          <p class="mt-5 text-xs text-muted dark:text-night-muted">{{ $t('A page enters when it meets every filled-in condition; within one condition any of the chosen values is enough. Empty conditions do not limit.') }}</p>

          <p class="mt-4 text-sm font-medium">{{ $t('Kinds of pages') }}</p>
          <div class="mt-1.5 flex flex-wrap gap-1.5">
            <button v-for="x in allTypes" :key="x.t" type="button" @click="colToggle('types', x.t)" :aria-pressed="colEdit.filter.types.includes(x.t)"
                    :class="['chip border px-3 py-1 transition', colEdit.filter.types.includes(x.t) ? 'border-sage-500 bg-sage-50 text-sage-700 dark:bg-sage-900/40 dark:text-sage-200' : 'border-line text-ink/70 dark:border-night-line dark:text-night-ink/70']">{{ typeInfo(x.t).plural }}</button>
          </div>

          <p class="mt-4 text-sm font-medium">{{ $t('Tags') }}</p>
          <div class="mt-1.5 flex flex-wrap items-center gap-1.5">
            <button v-for="t in colEdit.filter.tags" :key="t" type="button" class="chip border border-sage-500 bg-sage-50 px-3 py-1 text-sage-700 dark:bg-sage-900/40 dark:text-sage-200" :title="$t('Remove')" @click="colToggle('tags', t)">#{{ t }} <ic name="x" class="size-3"></ic></button>
            <input v-model="colEdit.tagInput" list="col-tags" class="field !w-44" :placeholder="$t('+ tag')" @keydown.enter.prevent="colAddTag" @change="colAddTag">
            <datalist id="col-tags"><option v-for="t in tagOptions" :key="t" :value="t"></option></datalist>

          <template v-if="areaOptions.length">

                      :class="['chip border px-3 py-1 transition', colEdit.filter.areas.includes(a) ? 'border-sage-500 bg-sage-50 text-sage-700 dark:bg-sage-900/40 dark:text-sage-200' : 'border-line text-ink/70 dark:border-night-line dark:text-night-ink/70']">{{ a }}</button>
            </div>
          </template>

          <div class="mt-4 grid gap-4 sm:grid-cols-2">
            <div v-if="formatOptions.length">
              <p class="text-sm font-medium">{{ $t('Format of the source') }}</p>
              <div class="mt-1.5 flex flex-wrap gap-1.5">
                <button v-for="f in formatOptions" :key="f" type="button" @click="colToggle('formats', f)" :aria-pressed="colEdit.filter.formats.includes(f)"
                        :class="['chip border px-3 py-1 transition', colEdit.filter.formats.includes(f) ? 'border-sage-500 bg-sage-50 text-sage-700 dark:bg-sage-900/40 dark:text-sage-200' : 'border-line text-ink/70 dark:border-night-line dark:text-night-ink/70']">{{ FORMATS[f] || f }}</button>
              </div>
            </div>
            <div>
              <p class="text-sm font-medium">{{ $t('Confidence') }}</p>
              <div class="mt-1.5 flex flex-wrap gap-1.5">
                <button v-for="(c, k) in CONF" :key="k" type="button" @click="colToggle('confidence', k)" :aria-pressed="colEdit.filter.confidence.includes(k)"
                        :class="['chip border px-3 py-1 transition', colEdit.filter.confidence.includes(k) ? 'border-sage-500 bg-sage-50 text-sage-700 dark:bg-sage-900/40 dark:text-sage-200' : 'border-line text-ink/70 dark:border-night-line dark:text-night-ink/70']">{{ c.label }}</button>
              </div>
            </div>
            <div>
              <p class="text-sm font-medium">{{ $t('Reading status') }}</p>
              <div class="mt-1.5 flex flex-wrap gap-1.5">
                <button v-for="(label, k) in STATUS" :key="k" type="button" @click="colToggle('status', k)" :aria-pressed="colEdit.filter.status.includes(k)"
                        :class="['chip border px-3 py-1 transition', colEdit.filter.status.includes(k) ? 'border-sage-500 bg-sage-50 text-sage-700 dark:bg-sage-900/40 dark:text-sage-200' : 'border-line text-ink/70 dark:border-night-line dark:text-night-ink/70']">{{ label }}</button>
              </div>
            </div>
            <div>
              <label class="text-sm font-medium" for="col-author">{{ $t('Author') }}</label>
              <input id="col-author" v-model="colEdit.filter.author" maxlength="80" class="field mt-1.5" :placeholder="$t('part of the name')">
            </div>
            <div>
              <p class="text-sm font-medium">{{ $t('Year') }}</p>
              <div class="mt-1.5 flex items-center gap-2">

            <div>
              <label class="text-sm font-medium" for="col-q">{{ $t('Word in the title') }}</label>
              <input id="col-q" v-model="colEdit.filter.q" maxlength="80" class="field mt-1.5">
            </div>
          </div>
          <p class="mt-5 rounded-xl bg-sage-50 px-3 py-2 text-sm text-sage-800 dark:bg-sage-900/40 dark:text-sage-200">{{ $t('Right now {0} {1} match.', [colEditCount, plural(colEditCount, $t('page'), $t('pages'))]) }}</p>
        </template>
        <p v-else class="mt-4 text-sm text-muted dark:text-night-muted">
          {{ colEdit.slugs.length ? $t('The list starts with the page you are on. You add more with the “List” button at the top of every page.') : $t('You add pages with the “List” button at the top of every page, and arrange them in the list itself.') }}
        </p>
      </div>
      <div class="flex justify-end gap-2 border-t border-line px-6 py-4 dark:border-night-line">
        <button type="button" class="btn-ghost" @click="colEdit=null">{{ $t('Cancel') }}</button>
        <button type="submit" class="btn-primary" :disabled="colEdit.busy || !colEdit.name.trim()">{{ colEdit.id ? $t('Save') : $t('Create') }}</button>
      </div>
    </form>
  </div>

  <!-- Ръчен режим: заявка, която чака отговор от чата в браузъра -->
  <div v-if="!ro && manual.length && !manualHidden" class="fixed inset-0 z-[55] flex items-center justify-center bg-ink/30 p-4 backdrop-blur-sm">
    <div class="card flex max-h-[92vh] w-full max-w-2xl animate-rise flex-col !shadow-lift" role="dialog" aria-modal="true" aria-labelledby="manual-title">
      <div class="scrollbar-thin overflow-y-auto p-6">
        <p class="eyebrow">{{ $t('Copy and paste') }}<template v-if="manual.length > 1"> · {{ $t('{0} requests are waiting', [manual.length]) }}</template></p>
        <h2 id="manual-title" class="mt-1 font-serif text-2xl font-semibold">{{ manual[0].label || $t('A request is waiting for {ai}') }}</h2>
        <ol class="mt-4 space-y-4 text-sm">
          <li>
            <p class="font-medium">1. {{ $t('Copy the request') }} <span class="text-xs font-normal text-muted dark:text-night-muted">({{ $t('≈ {0} tokens', [fmtTok(Math.ceil(manual[0].text.length / 3.2))]) }})</span></p>
            <div class="mt-2 flex flex-wrap gap-2">
              <button class="btn-primary !py-1.5 text-sm" @click="copy(manual[0].text)"><ic name="copy" class="size-4"></ic>{{ $t('Copy') }}</button>
              <button class="btn-ghost !py-1.5 text-sm" @click="manualShow = !manualShow">{{ manualShow ? $t('Hide the text') : $t('Show the text') }}</button>
            </div>
            <pre v-if="manualShow" class="scrollbar-thin mt-2 max-h-48 overflow-auto whitespace-pre-wrap rounded-xl bg-ink/[.04] p-3 font-mono text-[11px] leading-relaxed dark:bg-white/5">{{ manual[0].text }}</pre>
          </li>
          <li>
            <p class="font-medium">2. {{ $t('Paste it into a new chat with {ai} and wait for the whole answer.') }}</p>
            <p class="mt-1 text-xs text-muted dark:text-night-muted">{{ $t('A new chat for every request is best, so that earlier messages do not mix in.') }}</p>
          </li>
          <li>
            <p class="font-medium">3. {{ $t('Paste the answer here') }}</p>
