        <button class="btn-ghost !py-1.5 text-sm text-clay-500" @click="removeCustom"><ic name="trash" class="size-4"></ic>{{ $t('Delete the collection') }}</button>
      </div>
      <p v-else-if="cid && !custom" class="mt-2 text-muted dark:text-night-muted">{{ $t('There is no such collection. It may have been deleted.') }} <a href="#/collections" class="underline">{{ $t('All collections') }}</a></p>
    </div>
    <div class="flex w-full items-center gap-2 sm:w-auto">
      <div class="relative min-w-0 flex-1 sm:flex-none">
        <ic name="search" class="pointer-events-none absolute left-3 top-1/2 size-4 -translate-y-1/2 text-muted"></ic>
        <input v-model="filter" :placeholder="$t('Filter…')" class="w-full rounded-full sm:w-56 border border-line bg-panel py-2 pl-9 pr-4 text-sm outline-none transition focus:border-sage-400 dark:border-night-line dark:bg-night-panel">
      </div>
      <select v-model="sort" class="rounded-full border border-line bg-panel px-4 py-2 text-sm outline-none dark:border-night-line dark:bg-night-panel">
        <option v-if="isList" value="manual">{{ $t('Order in the list') }}</option>
        <option value="title">{{ surnameSort ? $t('Alphabetical (surname)') : $t('Alphabetical') }}</option>
        <option value="updated">{{ $t('Newest') }}</option>
        <option value="links">{{ $t('Most connected') }}</option>
      </select>
      <view-toggle v-model="view"></view-toggle>
    </div>
  </div>

  <!-- списък: страници, които вече ги няма (обединени или премахнати) -->
  <div v-if="missing.length" class="card mt-6 p-4 text-sm">
    <p class="font-medium">{{ $t('Missing from this list: {0} {1} (merged or removed).', [missing.length, plural(missing.length, $t('page'), $t('pages'))]) }}</p>
    <ul class="mt-2 flex flex-wrap gap-1.5">
      <li v-for="s in missing" :key="s" class="chip border border-line dark:border-night-line"><span class="font-mono">{{ s }}</span>
        <button v-if="!ro" class="ml-1 text-muted hover:text-clay-500" :title="$t('Remove from the list')" :aria-label="$t('Remove from the list')" @click="dropFromList(s)"><ic name="x" class="size-3"></ic></button></li>
    </ul>
  </div>
  <p v-if="isList && editable && view==='cards' && list.length > 1" class="mt-4 text-xs text-muted dark:text-night-muted">{{ $t('To change the order or remove pages, switch to the list view.') }}</p>

  <div v-if="type==='source' && !cid && formats.length > 1" class="mt-6 flex flex-wrap gap-2">
    <button v-for="f in ['all', ...formats]" :key="f" @click="fmt=f"
            :class="['chip border px-3 py-1 transition', fmt===f ? 'border-sage-500 bg-sage-50 text-sage-700 dark:bg-sage-900/40 dark:text-sage-200' : 'border-line text-ink/70 hover:border-sage-200 dark:border-night-line dark:text-night-ink/70']">
      {{ f==='all' ? $t('All') : (FORMATS[f] || f) }}
    </button>
  </div>

  <!-- възможни дубликати по изписване -->
  <div v-if="!ro && (myPairs.length || myAuthors.length)" class="card mt-6 overflow-hidden !border-amber-300/60 dark:!border-amber-500/30">
    <button type="button" class="flex w-full items-center gap-3 px-4 py-3 text-left" :aria-expanded="dupOpen" @click="dupOpen=!dupOpen">
      <ic name="alert" class="size-4 shrink-0 text-amber-600 dark:text-amber-400"></ic>
      <span class="min-w-0 flex-1 text-sm font-medium">{{ dupTitle }}</span>
      <ic name="chevron" :class="['size-4 shrink-0 text-muted transition', dupOpen && 'rotate-90']"></ic>
    </button>
    <div v-if="dupOpen" class="border-t border-line dark:border-night-line">
      <p class="px-4 pt-3 text-xs text-muted dark:text-night-muted">{{ $t('Names that sound the same but are written differently (for example Tchaikovsky and Chaikovsky) split citations between two pages. Choose which one stays: links are redirected, the content is merged, the old name becomes an alias, and the removed page is archived in outputs/merged/.') }}</p>
      <ul class="divide-y divide-line dark:divide-night-line">
        <li v-for="p in myPairs" :key="pk(p)" class="px-4 py-3">
          <p class="text-xs text-muted dark:text-night-muted">{{ p.why }}</p>
          <div class="mt-2 grid gap-2 sm:grid-cols-2">
            <label v-for="x in [p.a, p.b]" :key="x.slug" :class="['flex cursor-pointer items-start gap-2 rounded-2xl border p-3 text-sm', keepOf(p)===x.slug ? 'border-sage-500 bg-sage-50 dark:bg-sage-900/30' : 'border-line dark:border-night-line']">
              <input type="radio" class="mt-1" :name="pk(p)" :checked="keepOf(p)===x.slug" @change="dupKeep[pk(p)]=x.slug">
              <span class="min-w-0">
                <span class="block text-[11px] font-medium uppercase tracking-wide text-sage-700 dark:text-sage-200">{{ keepOf(p)===x.slug ? $t('Stays') : $t('Merged in') }}</span>
                <a :href="'#/p/'+x.slug" class="font-medium hover:underline" @click.stop>{{ x.title }}</a>
                <span class="block text-xs text-muted dark:text-night-muted">{{ x.backlinks }} {{ plural(x.backlinks, $t('link'), $t('links')) }} · {{ x.sources }} {{ plural(x.sources, $t('source'), $t('sources')) }}<template v-if="x.aliases.length"> {{ $t('· also: {0}', [x.aliases.join(', ')]) }}</template></span>
              </span>
            </label>
          </div>
          <div class="mt-3 flex flex-wrap items-center gap-2">
            <template v-if="dupPlan && dupPlan.key===pk(p)">
              <p v-if="!dupPlan.plan.ok" class="text-xs text-clay-500">{{ dupPlan.plan.error }}</p>
              <p v-else class="text-xs">{{ $t('“{0}” is merged into “{1}”. Links in {2} {3} are redirected.', [dupPlan.plan.drop.title, dupPlan.plan.keep.title, dupPlan.plan.touched.length, plural(dupPlan.plan.touched.length, $t('page'), $t('pages'))]) }}</p>
              <button v-if="dupPlan.plan.ok" class="btn-primary !py-1.5" :disabled="dupBusy" @click="doMerge">{{ $t('Confirm') }}</button>
              <button class="btn-ghost !py-1.5" @click="dupPlan=null">{{ $t('Cancel editing') }}</button>
            </template>
            <template v-else>
              <button class="btn-soft !py-1.5" @click="askMerge(p)">{{ $t('Merge') }}</button>
              <button class="btn-ghost !py-1.5" @click="notSame(p)">{{ $t('Not the same') }}</button>
            </template>
          </div>
        </li>
        <li v-for="(g,gi) in myAuthors" :key="'a'+gi" class="px-4 py-3">
          <p class="text-xs text-muted dark:text-night-muted">{{ $t('The author is written differently across sources. Choose the single spelling:') }}</p>
          <div class="mt-2 flex flex-wrap gap-2">
            <label v-for="v in g.variants" :key="v.name" :class="['flex cursor-pointer items-center gap-2 rounded-2xl border px-3 py-2 text-sm', canonOf(g,gi)===v.name ? 'border-sage-500 bg-sage-50 dark:bg-sage-900/30' : 'border-line dark:border-night-line']">
              <input type="radio" :name="'au'+gi" :checked="canonOf(g,gi)===v.name" @change="authCanon[gi]=v.name">
              <span>{{ v.name }}</span><span class="text-xs text-muted">({{ v.sources.length }})</span>
            </label>
          </div>
          <button class="btn-soft mt-3 !py-1.5" :disabled="dupBusy" @click="normAuthors(g,gi)">{{ $t('Unify the spelling') }}</button>
        </li>
      </ul>
    </div>
  </div>

  <!-- обединяване на отделно качени източници в книга с глави -->
  <div v-if="!ro && type==='source' && !tag" class="card mt-6 overflow-hidden">
    <button type="button" class="flex w-full items-center gap-3 px-4 py-3 text-left" :aria-expanded="mergeOpen" @click="mergeOpen=!mergeOpen">
      <ic name="book" class="size-4 shrink-0 text-sage-600 dark:text-sage-300"></ic>
      <span class="min-w-0 flex-1 text-sm font-medium">{{ $t('Merge separate sources into a book with chapters') }}</span>
      <ic name="chevron" :class="['size-4 shrink-0 text-muted transition', mergeOpen && 'rotate-90']"></ic>
    </button>
    <div v-if="mergeOpen" class="space-y-3 border-t border-line p-4 dark:border-night-line">
      <p class="text-xs text-muted dark:text-night-muted">{{ $t('For a book uploaded as separate files (for example per chapter): choose the sources in order, enter the book title and merge. Each chosen source becomes a separate chapter; the original pages are archived and links to them are redirected automatically.') }}</p>
      <input v-model="mergeTitle" @input="mergePlan=null" :placeholder="$t('Book title')" class="w-full rounded-xl border border-line bg-panel px-3 py-2 text-sm outline-none dark:border-night-line dark:bg-night-panel">
      <div>
        <p class="mb-1 text-xs font-medium">{{ $t('Chapters in order:') }}</p>
        <ul v-if="mergePick.length" class="space-y-1">
          <li v-for="(s,i) in mergePick" :key="s" class="flex items-center gap-2 rounded-xl border border-line px-2 py-1 text-sm dark:border-night-line">
            <span class="w-5 shrink-0 text-right text-xs text-muted">{{ i+1 }}.</span>
            <span class="min-w-0 flex-1 truncate">{{ titleOf(s) }}</span>
            <button class="btn-ghost !p-1" :disabled="i===0" @click="moveMerge(i,-1)" :title="$t('Move up')"><ic name="chevron" class="size-3.5 -rotate-90"></ic></button>

          </li>
        </ul>
        <p v-else class="text-xs text-muted dark:text-night-muted">{{ $t('Nothing chosen yet.') }}</p>
      </div>
      <select @change="$event.target.value && togglePick($event.target.value); $event.target.value=''" class="w-full rounded-xl border border-line bg-panel px-3 py-2 text-sm outline-none dark:border-night-line dark:bg-night-panel">
        <option value="">{{ $t('+ add a source…') }}</option>
        <option v-for="p in base.filter(p=>!mergePick.includes(p.slug))" :key="p.slug" :value="p.slug">{{ p.title }}</option>
      </select>
      <template v-if="mergePlan">
        <p v-if="!mergePlan.ok" class="text-xs text-clay-500">{{ mergePlan.error }}</p>
        <p v-else class="text-xs">{{ $t('“{0}” will be created with {1} {2}.', [mergePlan.title, mergePlan.chapters.length, plural(mergePlan.chapters.length, $t('chapter'), $t('chapters'))]) }}</p>
      </template>
      <div class="flex flex-wrap gap-2">
        <button class="btn-soft !py-1.5" :disabled="mergeBusy || mergePick.length<2 || !mergeTitle.trim()" @click="previewMergeBook">{{ $t('Preview') }}</button>
        <button v-if="mergePlan && mergePlan.ok" class="btn-primary !py-1.5" :disabled="mergeBusy" @click="doMergeBook">{{ $t('Confirm') }}</button>
      </div>
    </div>
  </div>

  <!-- буква -->
  <div v-if="letters.length > 1 && baseCount >= 8" class="mt-6 flex flex-wrap items-center gap-1" role="group" :aria-label="$t('Choose a letter')">

            :class="['chip border px-3 py-1 transition', !letter ? 'border-sage-500 bg-sage-50 text-sage-700 dark:bg-sage-900/40 dark:text-sage-200' : 'border-line text-ink/70 hover:border-sage-200 dark:border-night-line dark:text-night-ink/70']">{{ $t('All') }}</button>
    <template v-for="(l, li) in letters" :key="l.k">

      <button type="button" :aria-pressed="letter===l.k" :title="l.n + ' ' + plural(l.n, $t('page'), $t('pages'))"
              @click="letter = letter===l.k ? '' : l.k"
              :class="['grid h-8 min-w-8 place-items-center rounded-full border px-2 text-sm font-medium transition', letter===l.k ? 'border-sage-500 bg-sage-600 text-white shadow-soft' : 'border-line text-ink/80 hover:border-sage-300 hover:text-sage-700 dark:border-night-line dark:text-night-ink/80 dark:hover:text-sage-200']">{{ l.k }}</button>
    </template>
  </div>

  <p v-if="list.length" class="mt-4 text-xs text-muted dark:text-night-muted">{{ list.length }} {{ plural(list.length, $t('page'), $t('pages')) }}<template v-if="letter"> {{ $t('of “{0}”', [letter]) }}</template></p>
  <template v-if="list.length">
    <section v-for="g in groups" :key="g.k" class="mt-6">
      <p v-if="g.first" class="mb-2 mt-8 text-xs font-semibold uppercase tracking-wider text-muted first:mt-0 dark:text-night-muted">{{ SCRIPT_LABEL[g.s] }}</p>
      <h2 v-if="g.k" class="mb-3 flex items-center gap-3 font-serif text-2xl font-semibold text-sage-700 dark:text-sage-200">{{ g.k }}<span class="h-px flex-1 bg-line dark:bg-night-line"></span><span class="text-xs font-normal text-muted">{{ g.items.length }}</span></h2>
      <div v-if="view==='cards'" class="grid grid-cols-1 gap-4 sm:grid-cols-2 lg:grid-cols-3">
        <page-card v-for="p in g.items" :key="p.slug" :p="p" big></page-card>
      </div>
      <div v-else class="card overflow-hidden">
        <ul class="divide-y divide-line dark:divide-night-line">
          <li v-for="(p, pi) in g.items" :key="p.slug" class="flex items-center">
            <a :href="'#/p/'+p.slug" class="group flex min-w-0 flex-1 items-center gap-3 px-4 py-2.5 transition hover:bg-ink/[.03] dark:hover:bg-white/5">
              <span :class="['grid size-7 shrink-0 place-items-center rounded-lg', (TYPES[p.type]||TYPES.other).soft]"><ic :name="p.type==='source' && FORMAT_ICON[p.format] ? FORMAT_ICON[p.format] : (TYPES[p.type]||TYPES.other).icon" class="size-3.5"></ic></span>
              <span class="min-w-0 flex-1">
                <span class="block truncate font-medium transition group-hover:text-sage-700 dark:group-hover:text-sage-200">{{ p.title }}</span>
                <span v-if="p.excerpt" class="hidden truncate text-xs text-muted dark:text-night-muted sm:block">{{ p.excerpt }}</span>
              </span>
              <span class="hidden shrink-0 truncate text-xs text-muted dark:text-night-muted md:block md:max-w-[11rem]">
                <template v-if="p.type==='source'">{{ [Array.isArray(p.authors) ? p.authors.join(', ') : p.authors, p.year].filter(Boolean).join(' · ') || (FORMATS[p.format]||'') }}</template>
                <template v-else-if="p.kind">{{ KINDS[p.kind] || p.kind }}</template>
              </span>
              <span v-if="p.confidence==='low'" class="size-1.5 shrink-0 rounded-full bg-clay-400" :title="$t('Low confidence')"></span>
              <span v-if="p.backlinks" class="flex w-10 shrink-0 items-center justify-end gap-1 text-xs tabular-nums text-muted dark:text-night-muted"><ic name="link" class="size-3"></ic>{{ p.backlinks }}</span>
              <span v-if="p.updated" class="hidden w-24 shrink-0 text-right text-xs text-muted dark:text-night-muted lg:block">{{ relDate(p.updated) }}</span>
            </a>
            <span v-if="editable" class="flex shrink-0 items-center pr-2">
              <button class="btn-ghost !p-1.5" :disabled="pi===0" :title="$t('Move up')" :aria-label="$t('Move up')" @click="moveInList(p.slug,-1)"><ic name="arrowUp" class="size-3.5"></ic></button>
              <button class="btn-ghost !p-1.5" :disabled="pi===g.items.length-1" :title="$t('Move down')" :aria-label="$t('Move down')" @click="moveInList(p.slug,1)"><ic name="arrowDown" class="size-3.5"></ic></button>
              <button class="btn-ghost !p-1.5 text-muted hover:text-clay-500" :title="$t('Remove from the list')" :aria-label="$t('Remove from the list')" @click="dropFromList(p.slug)"><ic name="x" class="size-3.5"></ic></button>
            </span>
          </li>
        </ul>
      </div>
    </section>
  </template>
  <div v-else class="card mt-8 flex flex-col items-center px-6 py-16 text-center">
    <span :class="['grid size-14 place-items-center rounded-3xl', T.soft]"><ic :name="T.icon" class="size-6"></ic></span>
    <p class="mt-5 font-serif text-xl font-semibold">{{ filter ? $t('Nothing matches the filter') : $t('Nothing here yet') }}</p>
    <p class="mt-2 max-w-md text-sm text-muted dark:text-night-muted">{{ filter ? $t('Try another word.') : isList ? $t('Add pages with the “List” button at the top of every page.') : custom ? $t('No page matches the conditions of this collection right now. It fills itself when such pages appear.') : $t('Pages of this kind appear when {ai} processes sources. Upload files from the home page.') }}</p>
    <a v-if="!filter && !cid" href="#/" class="btn-soft mt-6"><ic name="upload" class="size-4"></ic>{{ $t('Go to uploading') }}</a>
    <button v-else-if="!filter && custom && !isList && !ro" class="btn-soft mt-6" @click="editCustom"><ic name="filter" class="size-4"></ic>{{ $t('Change the conditions') }}</button>
  </div>
</div>
</script>

<!-- ============================ ПРЕВКЛЮЧВАТЕЛ СПИСЪК / КУТИЙКИ ============================ -->
<script type="text/x-template" id="tpl-viewtoggle">
<div class="flex shrink-0 rounded-full border border-line p-0.5 dark:border-night-line" role="group" :aria-label="$t('View')">
  <button v-for="v in [{id:'cards',icon:'grid',label:$t('Cards')},{id:'list',icon:'list',label:$t('List')}]" :key="v.id" @click="$emit('update:modelValue', v.id)"
          :title="v.label" :aria-pressed="modelValue===v.id"
          :class="['grid size-8 place-items-center rounded-full transition', modelValue===v.id ? 'bg-sage-600 text-white shadow-soft' : 'text-muted hover:text-ink dark:hover:text-night-ink']">
    <ic :name="v.icon" class="size-4"></ic>
  </button>
</div>
</script>

<!-- ============================ УЧЕНЕ ПО ВЪПРОС (ПЪТЕКА) ============================ -->
<script type="text/x-template" id="tpl-path">
<div class="mx-auto max-w-[96rem] px-5 py-8 sm:px-8 lg:py-10">
  <div :class="[mobilePanel && 'hidden lg:block']">
    <p class="eyebrow mx-auto max-w-3xl">{{ $t('Learn by question') }}</p>
    <h1 class="mx-auto mt-2 max-w-3xl font-serif text-3xl font-semibold tracking-tight sm:text-4xl">{{ $t('What do you want to understand?') }}</h1>
    <form class="mx-auto mt-5 flex max-w-3xl items-center gap-2" @submit.prevent="submit">
      <div class="relative min-w-0 flex-1">
        <ic name="route" class="pointer-events-none absolute left-4 top-1/2 size-4 -translate-y-1/2 text-muted"></ic>
        <input v-model="input" :placeholder="$t('E.g. how the double message forms in a family')" class="w-full rounded-full border border-line bg-panel py-3 pl-11 pr-4 text-base outline-none transition focus:border-sage-400 dark:border-night-line dark:bg-night-panel">
      </div>
      <button class="btn-primary !py-3" :disabled="!input.trim() || loading"><ic :name="loading ? 'spinner' : (level==='local' ? 'arrowRight' : 'sparkle')" :class="['size-4', loading && 'animate-spin']"></ic>{{ level==='local' ? $t('Arrange the path') : $t('Compose with {ai}') }}</button>
    </form>
    <div class="mx-auto mt-3 flex max-w-3xl flex-wrap items-center gap-2" role="radiogroup" :aria-label="$t('Who arranges the path')">
      <button v-for="l in LEVELS" :key="l.id" type="button" role="radio" :aria-checked="level===l.id" :title="l.hint" @click="setLevel(l.id)"
              :class="['chip border px-3 py-1 transition', level===l.id ? 'border-sage-500 bg-sage-50 text-sage-700 dark:bg-sage-900/40 dark:text-sage-200' : 'border-line text-ink/70 hover:border-sage-200 dark:border-night-line dark:text-night-ink/70']">
        <ic :name="l.id==='local' ? 'search' : 'sparkle'" class="size-3"></ic>{{ l.label }}
      </button>
    </div>
    <p class="mx-auto mt-2 max-w-3xl text-xs text-muted dark:text-night-muted">{{ levelInfo.hint }}</p>
    <scope-bar class="mx-auto mt-4 block" :q="input" :pages="pages"></scope-bar>
  </div>

  <!-- празно състояние -->
  <div v-if="!q" :class="['mt-8', mobilePanel && 'hidden lg:block']">
    <div v-if="recent.length" class="mx-auto max-w-3xl">
      <p class="eyebrow">{{ $t('Recent paths') }}</p>
      <ul class="mt-3 space-y-1.5">
        <li v-for="r in recent" :key="r" class="group flex items-center gap-2">
          <a :href="'#/path/'+encodeURIComponent(r)" class="card card-hover flex min-w-0 flex-1 items-center gap-3 !rounded-2xl px-4 py-3"><ic name="route" class="size-4 shrink-0 text-sage-600"></ic><span class="truncate">{{ r }}</span></a>
          <button class="btn-ghost !p-2 opacity-0 group-hover:opacity-100" :title="$t('Remove from the list')" @click="forget(r)"><ic name="x" class="size-4"></ic></button>
        </li>
      </ul>
    </div>
    <div v-if="saved.length" :class="['mx-auto max-w-3xl', recent.length && 'mt-8']">
      <p class="eyebrow">{{ $t('Composed with {ai}') }}</p>
      <ul class="mt-3 space-y-1.5">
        <li v-for="r in saved" :key="r.level+r.q+scopeLabel(r)" class="group flex items-center gap-2">
          <a :href="'#/path/'+encodeURIComponent(r.q)+'?m='+r.level" @click="applyScope(r)" class="card card-hover flex min-w-0 flex-1 items-center gap-3 !rounded-2xl px-4 py-3"><ic name="sparkle" class="size-4 shrink-0 text-sage-600"></ic><span class="min-w-0 flex-1 truncate">{{ r.q }}<span v-if="scopeLabel(r)" class="ml-2 text-xs text-muted">{{ scopeLabel(r) }}</span></span><span class="chip shrink-0 bg-sage-50 text-sage-700 dark:bg-sage-900/40 dark:text-sage-200">{{ levelLabel(r.level) }}</span><span class="hidden shrink-0 text-xs text-muted sm:block">{{ relDate(r.at) }}</span></a>
          <button class="btn-ghost !p-2 text-muted hover:text-clay-500" :title="$t('Delete the path “{0}”', [r.q])" :aria-label="$t('Delete the path {0}', [r.q])" @click="deleteSaved(r)"><ic name="trash" class="size-4"></ic></button>
        </li>
      </ul>
    </div>
    <div v-if="!recent.length && !saved.length" class="card mx-auto max-w-3xl p-8 text-center">
      <span class="mx-auto grid size-14 place-items-center rounded-3xl bg-sage-50 text-sage-600 dark:bg-sage-900/40 dark:text-sage-200"><ic name="route" class="size-6"></ic></span>
      <p class="mt-4 font-serif text-xl font-semibold">{{ $t('Learn by topic, not from link to link') }}</p>
      <p class="mt-2 text-sm text-muted dark:text-night-muted">{{ $t('Write a question in your own words. You get ordered steps, read marks and reading in a panel that does not pull you out of the path.') }}</p>
    </div>
  </div>

  <div v-else-if="loading" class="card mx-auto mt-8 max-w-3xl p-8 text-center">
    <span class="mx-auto grid size-14 place-items-center rounded-3xl bg-sage-50 text-sage-600 dark:bg-sage-900/40 dark:text-sage-200"><ic name="spinner" class="size-6 animate-spin"></ic></span>
    <template v-if="level==='local'"><p class="mt-4 text-sm text-muted">{{ $t('Sorting…') }}</p></template>
    <template v-else>
      <p class="mt-4 font-serif text-xl font-semibold">{{ $t('{ai} ({0} model) is composing the path', [levelLabel(level).toLowerCase()]) }}</p>
      <p class="mt-2 text-sm text-muted dark:text-night-muted">{{ $t('Reads the index and the pages of the library to arrange them for learning. {0} s{1}', [waited, level==='strong' ? $t('. The powerful model can take several minutes.') : '.']) }}</p>
      <button class="btn-soft mt-5" @click="cancel"><ic name="x" class="size-4"></ic>{{ $t('Cancel') }}</button>
    </template>
  </div>

  <div v-else-if="error" class="card mt-8 max-w-3xl p-8 text-center">
    <span class="mx-auto grid size-14 place-items-center rounded-3xl bg-clay-100 text-clay-500 dark:bg-clay-500/15"><ic name="alert" class="size-6"></ic></span>
    <p class="mt-4 font-serif text-xl font-semibold">{{ $t('{ai} could not compose the path') }}</p>
    <p class="mt-2 text-sm text-muted dark:text-night-muted">{{ error }}</p>
    <div class="mt-5 flex flex-wrap justify-center gap-2">
      <button class="btn-primary" @click="generate()"><ic name="sparkle" class="size-4"></ic>{{ $t('Try again') }}</button>
      <button v-if="level!=='light'" class="btn-soft" @click="setLevel('light', true)">{{ $t('With a light model') }}</button>
      <button class="btn-ghost" @click="setLevel('local', true)">{{ $t('Quick, without {ai}') }}</button>
    </div>
  </div>

  <div v-else-if="pending" class="card mt-8 max-w-3xl p-8 text-center">
    <span class="mx-auto grid size-14 place-items-center rounded-3xl bg-sage-50 text-sage-600 dark:bg-sage-900/40 dark:text-sage-200"><ic name="sparkle" class="size-6"></ic></span>
    <p class="mt-4 font-serif text-xl font-semibold">{{ others.length ? $t('This question already has a saved path with another scope') : $t('There is no path at the “{0}” level yet', [levelLabel(level)]) }}</p>
    <template v-if="others.length">
      <p class="mt-2 text-sm text-muted dark:text-night-muted">{{ $t('The selected areas and topics differ from the ones the path was composed with. Opening the saved path is free.') }}</p>
      <ul class="mx-auto mt-4 max-w-md space-y-1.5 text-left">
        <li v-for="o in others" :key="o.at">
          <button type="button" class="card card-hover flex w-full items-center gap-3 !rounded-2xl px-4 py-3" @click="applyScope(o)">
            <ic name="sparkle" class="size-4 shrink-0 text-sage-600"></ic>
            <span class="min-w-0 flex-1 truncate text-left text-sm">{{ scopeLabel(o) || $t('All areas') }}</span>
            <span class="shrink-0 text-xs text-muted">{{ relDate(o.at) }}</span>
            <span class="shrink-0 text-sm font-medium text-sage-700 dark:text-sage-200">{{ $t('Open') }}</span>
          </button>
        </li>
      </ul>
      <p class="mt-5 text-sm text-muted dark:text-night-muted">{{ $t('Or compose a new path for the current choice. Composing uses part of {ai}’s limit.') }}</p>
      <button class="btn-soft mt-3" @click="generate()"><ic name="sparkle" class="size-4"></ic>{{ $t('Compose with {ai}') }}</button>
    </template>
    <template v-else>
      <p class="mt-2 text-sm text-muted dark:text-night-muted">{{ $t('Composing uses part of {ai}’s limit. The result is saved, so opening it next time is free.') }}</p>
      <button class="btn-primary mt-5" @click="generate()"><ic name="sparkle" class="size-4"></ic>{{ $t('Compose with {ai}') }}</button>
    </template>
  </div>

  <div v-else-if="res && !steps.length" class="card mt-8 max-w-3xl p-8 text-center">
    <span class="mx-auto grid size-14 place-items-center rounded-3xl bg-clay-100 text-clay-500 dark:bg-clay-500/15"><ic name="ghost" class="size-6"></ic></span>
    <p class="mt-4 font-serif text-xl font-semibold">{{ $t('Nothing to arrange') }}</p>
    <p class="mt-2 text-sm text-muted dark:text-night-muted">{{ res.note }}</p>
  </div>

  <!-- пътеката + панелът -->
  <div v-else-if="res" class="mt-6 grid gap-6 lg:grid-cols-[22rem_minmax(0,1fr)] xl:grid-cols-[24rem_minmax(0,1fr)]">
    <!-- ляво: стъпките -->
    <aside :class="['min-w-0', mobilePanel && 'hidden lg:block']">
      <div class="lg:sticky lg:top-6 lg:max-h-[calc(100dvh-3rem)] lg:overflow-y-auto lg:pr-1 scrollbar-thin">
        <div class="card p-4">
          <p class="truncate font-serif font-semibold" :title="q">{{ q }}</p>
          <p v-if="res.goal" class="mt-2 text-sm text-ink/80 dark:text-night-ink/80">{{ res.goal }}</p>
          <p v-if="level!=='local'" class="mt-2 flex flex-wrap items-center gap-x-2 text-xs text-muted dark:text-night-muted">
            <span class="chip bg-sage-50 text-sage-700 dark:bg-sage-900/40 dark:text-sage-200"><ic name="sparkle" class="size-3"></ic>Claude · {{ levelLabel(level) }}</span>
            <span v-if="res.savedAt">{{ res.cached ? $t('saved') : $t('composed') }} {{ relDate(res.savedAt) }}</span>
            <button class="font-medium text-sage-700 hover:underline dark:text-sage-200" @click="generate(true)">{{ $t('Redo') }}</button>
          </p>
          <div class="mt-3 flex items-center gap-3">
            <div class="h-2 flex-1 overflow-hidden rounded-full bg-ink/5 dark:bg-white/10"><div class="h-full rounded-full bg-sage-500 transition-all" :style="{width: (doneN/Math.max(1,total)*100)+'%'}"></div></div>
            <span class="shrink-0 text-xs tabular-nums text-muted">{{ $t('{0} of {1}', [doneN, total]) }}</span>
          </div>
          <p v-if="res.note" class="mt-3 flex gap-2 rounded-2xl bg-amber-50 px-3 py-2 text-xs text-amber-800 dark:bg-amber-500/10 dark:text-amber-300"><ic name="alert" class="mt-0.5 size-3.5 shrink-0"></ic>{{ res.note }}</p>
          <button v-if="doneN" class="mt-3 text-xs font-medium text-sage-700 hover:underline dark:text-sage-200" @click="reset">{{ $t('Start over') }}</button>
        </div>

        <div v-for="g in groups" :key="g.id" class="mt-5">
          <p class="eyebrow px-1">{{ g.label }}</p>
          <p class="px-1 text-xs text-muted dark:text-night-muted">{{ g.hint }}</p>
          <ol class="mt-2 space-y-1.5">
            <li v-for="s in g.items" :key="s.slug">
              <div :class="['group flex items-start gap-2 rounded-2xl border p-2.5 transition', s.slug===current ? 'border-sage-500 bg-sage-50 shadow-soft dark:bg-sage-900/30' : 'border-line/80 bg-panel hover:border-sage-200 dark:border-night-line dark:bg-night-panel']">
                <button class="mt-0.5 shrink-0" :title="done.has(s.slug) ? $t('Mark as unread') : $t('Mark as read')" @click="toggleDone(s.slug)">
                  <span :class="['grid size-5 place-items-center rounded-full border transition', done.has(s.slug) ? 'border-sage-500 bg-sage-500 text-white' : 'border-line text-transparent hover:border-sage-400 dark:border-night-line']"><ic name="check" class="size-3"></ic></span>
                </button>
                <button class="min-w-0 flex-1 text-left" @click="go(s.slug)">
                  <span :class="['block text-sm font-medium leading-snug', done.has(s.slug) && 'text-muted line-through decoration-1 dark:text-night-muted']">{{ s.title }}</span>
                  <span class="mt-0.5 flex flex-wrap items-center gap-x-2 text-[11px] text-muted dark:text-night-muted">
                    <span :class="['chip !px-1.5 !py-0', stepIcon(s).soft]">{{ stepIcon(s).label }}</span>
                    <span v-if="s.book" class="truncate">{{ s.book.title }}</span>
                    <span v-if="s.pages">{{ $t('p. {0}', [s.pages]) }}</span>
                  </span>
                  <span v-if="s.why" class="mt-1 block text-xs leading-snug text-ink/70 dark:text-night-ink/70">{{ s.why }}</span>
                </button>
              </div>
            </li>
          </ol>
        </div>
      </div>
    </aside>

    <!-- дясно: панелът за четене -->
    <section :class="['min-w-0', !mobilePanel && 'hidden lg:block']">
      <div class="card lg:sticky lg:top-6 flex max-h-none flex-col overflow-hidden lg:max-h-[calc(100dvh-3rem)]">
        <header class="flex flex-wrap items-center gap-2 border-b border-line px-4 py-3 dark:border-night-line">
          <button class="btn-ghost !px-3 !py-1.5 lg:hidden" @click="mobilePanel=false"><ic name="arrowLeft" class="size-4"></ic>{{ $t('Path') }}</button>
          <nav class="flex min-w-0 flex-1 flex-wrap items-center gap-1 text-xs text-muted dark:text-night-muted" :aria-label="$t('Where I am')">
            <span class="font-medium text-sage-700 dark:text-sage-200">{{ $t('Step {0} of {1}', [idx+1, total]) }}</span>
            <template v-for="(t,i) in trail.slice(1)" :key="i"><ic name="chevron" class="size-3"></ic><span :class="i===trail.length-2 && 'text-ink dark:text-night-ink'">{{ t.title }}</span></template>
          </nav>
          <button v-if="stack.length > 1" class="btn-soft !px-3 !py-1.5" @click="back"><ic name="arrowLeft" class="size-4"></ic>{{ $t('Back') }}</button>
          <button v-if="stack.length > 1" class="btn-ghost !px-3 !py-1.5" @click="backToStep"><ic name="route" class="size-4"></ic>{{ $t('To the step') }}</button>
        </header>

        <div class="scrollbar-thin flex-1 overflow-y-auto px-5 py-6 sm:px-8" ref="panelBody">
          <p v-if="panelLoading && !panel" class="text-sm text-muted">{{ $t('Loading…') }}</p>
          <article v-else-if="panel" :key="panel.slug">
            <h2 class="font-serif text-3xl font-semibold leading-tight tracking-tight">{{ panel.title }}</h2>
            <div class="mt-3 flex flex-wrap items-center gap-2">
              <span :class="['chip', (TYPES[panel.type]||TYPES.other).soft]">{{ panel.kind ? (KINDS[panel.kind]||panel.kind) : (TYPES[panel.type]||TYPES.other).label }}</span>
              <span v-if="panel.confidence" :class="['chip', CONF[panel.confidence]?.cls]"><span :class="['size-1.5 rounded-full', CONF[panel.confidence]?.dot]"></span>{{ $t('confidence: {0}', [CONF[panel.confidence]?.label || panel.confidence]) }}</span>
              <button v-if="panel.readerSrc" class="btn-soft !py-1" @click="$root.openReader(panel.readerSrc, panel.type==='chapter' ? (Number(String(panel.pages||'').split(/[-–]/)[0]) || undefined) : undefined)"><ic name="book" class="size-4"></ic>{{ $t('Read in the book') }}</button>
              <a :href="'#/p/'+panel.slug" class="btn-ghost !py-1 text-xs">{{ $t('Open as a page') }}<ic name="external" class="size-3.5"></ic></a>
            </div>
            <div v-if="steps[idx]?.look && stack.length===1" class="mt-5 rounded-2xl bg-sage-50 p-3 dark:bg-sage-900/30">
              <p class="text-xs font-semibold text-sage-700 dark:text-sage-200">{{ $t('While you read') }}</p>
              <p class="mt-1 text-sm">{{ steps[idx].look }}</p>
              <p v-if="steps[idx].why" class="mt-2 text-xs text-muted dark:text-night-muted">{{ $t('Why here: {0}', [steps[idx].why]) }}</p>
            </div>
            <div v-if="steps[idx]?.cites?.length && stack.length===1" class="mt-5 rounded-2xl bg-clay-100/50 p-3 dark:bg-clay-500/10">
              <p class="text-xs font-semibold text-clay-500 dark:text-clay-400">{{ $t('Exact pages it relies on') }}</p>
              <div class="mt-2 flex flex-wrap gap-1.5">

        <li v-if="!hits.length" class="text-sm text-muted dark:text-night-muted">{{ $t('Nothing found.') }}</li>
        <li v-for="h in hits" :key="h.id"><button type="button" class="block w-full rounded-xl p-2 text-left text-sm hover:bg-ink/5 dark:hover:bg-white/5" @click="open(h.id)"><span class="block font-medium">{{ h.title }}</span><span class="block text-xs text-muted dark:text-night-muted">{{ h.group }}</span><span v-if="h.snippet" class="mt-0.5 block text-xs text-muted dark:text-night-muted">{{ h.snippet }}</span></button></li>
      </ul>
      <nav v-else class="mt-4 space-y-4" :aria-label="$t('Documentation')">
        <div v-for="g in groups" :key="g.id">
          <p class="eyebrow px-3">{{ t(g.title) }}</p>
          <a v-for="p in g.pages" :key="p.id" :href="'#/docs/' + p.id" :aria-current="p.id===curId ? 'page' : null" :class="['nav-item mt-0.5', p.id===curId && 'active']">
            <span class="min-w-0 flex-1 truncate">{{ t(p.title) }}</span>
            <span v-if="p.track==='terminal'" class="chip bg-ink/[.06] !px-1.5 !py-0 text-[10px] dark:bg-white/10">&gt;_</span>
          </a>
        </div>
      </nav>
    </aside>

    <!-- Страницата -->
    <article class="mt-8 min-w-0 lg:mt-0">
      <p v-if="cur" class="text-xs text-muted dark:text-night-muted">{{ t(index.groups.find((g) => g.pages.some((p) => p.id===curId))?.title) }}</p>
      <div v-if="loading && !html" class="text-sm text-muted">{{ $t('Loading…') }}</div>
      <div class="reading docs-body max-w-3xl" v-html="html"></div>
      <div class="mt-12 grid max-w-3xl gap-3 border-t border-line pt-6 sm:grid-cols-2 dark:border-night-line">
        <a v-if="prev" :href="'#/docs/' + prev.id" class="card card-hover block p-4"><span class="eyebrow">{{ $t('Previous') }}</span><span class="mt-1 block font-medium">{{ t(prev.title) }}</span></a><span v-else></span>
        <a v-if="next" :href="'#/docs/' + next.id" class="card card-hover block p-4 sm:text-right"><span class="eyebrow">{{ $t('Next') }}</span><span class="mt-1 block font-medium">{{ t(next.title) }}</span></a>
      </div>
    </article>

    <!-- На тази страница -->
    <aside v-if="toc.length > 1" class="hidden xl:sticky xl:top-6 xl:block xl:self-start">
      <p class="eyebrow">{{ $t('On this page') }}</p>
      <ul class="mt-3 space-y-1.5 border-l border-line pl-3 text-sm dark:border-night-line">
        <li v-for="h in toc" :key="h.id" :class="h.lvl===3 && 'pl-3'"><a :href="'#/docs/' + curId" class="text-muted hover:text-ink dark:text-night-muted dark:hover:text-night-ink" @click.prevent="jump(h.id)">{{ h.text }}</a></li>
      </ul>
    </aside>
  </div>
</div>
</script>

<script type="text/x-template" id="tpl-settings">
<div class="mx-auto max-w-6xl px-5 py-8 sm:px-8 lg:py-12">
  <p class="eyebrow">{{ $t('Settings') }}</p>
  <h1 class="mt-1 font-serif text-3xl font-semibold">{{ current.label }}</h1>
  <p class="mt-2 max-w-2xl text-sm text-muted dark:text-night-muted">{{ $t('Nothing here leaves your computer until you press a button, and nothing is installed by itself. You see the result and decide.') }}</p>

  <div class="mt-6 lg:grid lg:grid-cols-[13rem_minmax(0,1fr)] lg:items-start lg:gap-10">
    <!-- Подменю: на телефон е ред с превъртане, на голям екран колона вляво -->
    <nav class="scrollbar-thin -mx-1 flex gap-1 overflow-x-auto px-1 pb-2 lg:sticky lg:top-6 lg:mx-0 lg:flex-col lg:overflow-visible lg:px-0 lg:pb-0" :aria-label="$t('Sections of the settings')">
      <a v-for="s in SETTINGS_SECTIONS" :key="s.id" :href="'#/settings/'+s.id" :aria-current="section===s.id ? 'page' : null"
         :class="['nav-item shrink-0 !w-auto whitespace-nowrap lg:!w-full', section===s.id && 'active']"><ic :name="s.icon" class="size-4"></ic>{{ s.label }}</a>
      <a href="/product/" target="_blank" rel="noopener" class="nav-item shrink-0 !w-auto whitespace-nowrap lg:!w-full lg:mt-3"><ic name="external" class="size-4"></ic>{{ $t('About the product') }}</a>
    </nav>

    <div class="mt-2 min-w-0 max-w-3xl lg:mt-0 lg:[&>:first-child]:!mt-0">
  <!-- Модел: доставчик, ключ, модели, име и надписи -->
  <ai-settings v-if="section==='model' && !ro"></ai-settings>

  <!-- Режим (обикновен или защитен) и име на сайта -->
  <app-settings v-else-if="(section==='mode' || section==='address') && !ro" :part="section" :key="section"></app-settings>

  <p v-else-if="!info" class="mt-8 text-sm text-muted">{{ $t('Loading…') }}</p>
  <template v-else>
    <!-- Архив за четене -->
    <backup-settings v-if="section==='backup' && !ro"></backup-settings>
    <section v-if="section==='archive' && !ro" class="card mt-6 p-5">
      <h2 class="font-serif text-xl font-semibold">{{ $t('Archive for reading') }}</h2>
      <p class="mt-1 text-sm text-muted dark:text-night-muted">{{ $t('A copy of the library in one ZIP file, for reading on another computer. It has the pages with their links and tags, the markdown files, and the extracted text of the books and articles from raw/ (for the reader). The original files (PDF, EPUB, DOCX) are not included, and the copy cannot be changed by {ai}.') }}</p>
      <button class="btn-primary mt-4 !py-1.5 text-sm" :disabled="archive.busy" @click="makeArchive"><ic :name="archive.busy ? 'spinner' : 'upload'" :class="['size-4', archive.busy && 'animate-spin']"></ic>{{ archive.busy ? $t('Making the archive…') : $t('Make the archive') }}</button>
      <p v-if="archive.error" class="mt-3 text-sm text-clay-500">{{ archive.error }}</p>
      <p v-if="archive.result" class="mt-3 text-sm">
        {{ $t('Ready: {0} pages, {1} MB.', [archive.result.pages, (archive.result.bytes / 1048576).toFixed(1)]) }}
        <a :href="'/api/archive/' + archive.result.name" download class="font-medium underline">{{ $t('Download {0}', [archive.result.name]) }}</a>
      </p>
      <p class="mt-2 text-xs text-muted dark:text-night-muted">{{ $t('The reader texts (the extracted text of books, without the original files) are in the reader folder next to index.html.') }}</p>
      <p class="eyebrow mt-5">{{ $t('Earlier archives') }}</p>
      <ul v-if="archive.list.length" class="mt-2 divide-y divide-line dark:divide-night-line">
        <li v-for="a in archive.list" :key="a.name" class="flex flex-wrap items-center gap-3 py-2 text-sm">
          <a :href="'/api/archive/' + a.name" download class="min-w-0 flex-1 truncate font-medium underline">{{ a.name }}</a>
          <span class="text-xs text-muted dark:text-night-muted">{{ a.created.slice(0, 16).replace('T', ' ') }} · {{ (a.bytes / 1048576).toFixed(1) }} MB</span>
          <button class="btn-ghost !p-1.5 text-muted hover:text-clay-500" :title="$t('Delete')" :aria-label="$t('Delete')" @click="removeArchive(a)"><ic name="trash" class="size-4"></ic></button>
        </li>
      </ul>
      <p v-else class="mt-2 text-xs text-muted dark:text-night-muted">{{ $t('No archives yet.') }}</p>
      <p class="mt-2 text-xs text-muted dark:text-night-muted">{{ $t('To open it: unzip the file and open index.html in any browser. It works without internet and without {ai}.') }}</p>
    </section>

    <template v-if="section==='updates'">
    <!-- Версия -->
    <section class="card mt-6 p-5">
      <h2 class="font-serif text-xl font-semibold">{{ $t('Version of the code') }}</h2>
      <p class="mt-1 text-sm text-muted dark:text-night-muted">{{ $t('Installed: {0}', [info.version]) }}<template v-if="info.repo"> · <a :href="info.url" target="_blank" rel="noopener" class="underline">{{ info.repo }}</a></template></p>
      <button class="btn-primary mt-4 !py-1.5 text-sm" :disabled="busy.code" @click="checkCode"><ic :name="busy.code ? 'spinner' : 'globe'" :class="['size-4', busy.code && 'animate-spin']"></ic>{{ $t('Check for a new version') }}</button>
      <p class="mt-1 text-xs text-muted dark:text-night-muted">{{ $t('Sends an ordinary request to GitHub. Your library is not sent.') }}</p>

      <div v-if="code" class="mt-4 text-sm">
        <p v-if="!code.ok" class="text-clay-500">{{ code.error }}</p>
        <template v-else>
          <p v-if="code.status==='same'" class="font-medium text-sage-700 dark:text-sage-200">{{ $t('You have the latest version ({0}).', [code.remote]) }}</p>
          <p v-else-if="code.status==='ahead'" class="font-medium">{{ $t('Your version ({0}) is newer than the one on GitHub ({1}).', [code.version, code.remote]) }}</p>
          <p v-else class="font-medium text-clay-500">{{ $t('A new version is available: {0} (you have {1}).', [code.remote, code.version]) }}</p>
          <p v-if="code.commit" class="mt-1 text-muted dark:text-night-muted">{{ $t('Latest change on GitHub: {0}', [code.commit.message]) }} <span v-if="code.commit.date">({{ code.commit.date.slice(0, 10) }})</span></p>
          <div v-if="code.status==='behind'" class="mt-3 space-y-2">
            <p>{{ $t('If you installed with git, run this in the project folder. Your library, drafts and settings are not touched:') }}</p>
            <div class="flex items-center gap-2 rounded-xl bg-ink/[.05] px-3 py-2 dark:bg-white/5">
              <code class="min-w-0 flex-1 break-all text-xs">{{ updateCmd }}</code>
              <button class="btn-ghost !p-1.5" :title="$t('Copy')" :aria-label="$t('Copy')" @click="$emit('copy', updateCmd)"><ic name="copy" class="size-4"></ic></button>
            </div>
            <p>{{ $t('If you downloaded a ZIP, download the new one and copy your folders raw, wiki, drafts and outputs and the file library.config.json into it.') }}</p>
          </div>
        </template>
      </div>
    </section>

    <!-- Пакети -->
    <section class="card mt-5 p-5">
      <h2 class="font-serif text-xl font-semibold">{{ $t('Node.js packages') }}</h2>
      <p class="mt-1 text-sm text-muted dark:text-night-muted">{{ $t('The application is built on open-source packages, and they depend on further packages. They get new versions and security fixes on their own schedule, so check them from time to time.') }}</p>
      <button class="btn-primary mt-4 !py-1.5 text-sm" :disabled="busy.packages" @click="checkPackages"><ic :name="busy.packages ? 'spinner' : 'terminal'" :class="['size-4', busy.packages && 'animate-spin']"></ic>{{ $t('Check the packages') }}</button>
      <p class="mt-1 text-xs text-muted dark:text-night-muted">{{ $t('Runs npm outdated and npm audit. npm sends the list of packages to its registry, not your library.') }}</p>

      <!-- Резултат от обновяването: рестарт, готово или грешка -->
      <div v-if="upd.restarting" class="mt-4 flex items-center gap-3 rounded-xl bg-sage-50 px-4 py-3 text-sm text-sage-800 dark:bg-sage-900/40 dark:text-sage-200" role="status">
        <ic name="spinner" class="size-4 shrink-0 animate-spin"></ic>
        <span>{{ $t('Updated: {0}. The library is restarting with the new versions; the page reloads by itself.', [upd.result.changed.map((c) => c.name + ' ' + c.to).join(', ') || $t('nested packages')]) }}</span>
      </div>
      <p v-else-if="upd.error" class="mt-4 rounded-xl bg-clay-100/60 px-4 py-3 text-sm text-clay-500 dark:bg-clay-500/10" role="alert">{{ upd.error }}</p>
      <div v-else-if="upd.result" class="mt-4 rounded-xl bg-sage-50 px-4 py-3 text-sm text-sage-800 dark:bg-sage-900/40 dark:text-sage-200" role="status">
        <p v-if="!upd.result.changed.length && !upd.result.lockChanged">{{ $t('npm found nothing to update within package.json.') }}</p>
        <template v-else>
          <p>{{ $t('Updated: {0}.', [upd.result.changed.map((c) => c.name + ' ' + (c.from || '–') + ' → ' + c.to).join(', ') || $t('nested packages')]) }}</p>
          <p v-if="!upd.result.supervised" class="mt-1 font-medium">{{ $t('Stop the library (Ctrl+C in its window) and start it again so that the new versions load.') }}</p>
        </template>
      </div>

      <div v-if="packages" class="mt-4 space-y-4 text-sm">
        <div>
          <h3 class="font-medium">{{ $t('New versions') }}</h3>
          <p v-if="!packages.outdated.ok" class="mt-1 text-clay-500">{{ packages.outdated.error }}</p>
          <p v-else-if="!packages.outdated.items.length" class="mt-1 text-sage-700 dark:text-sage-200">{{ $t('All packages are up to date.') }}</p>
          <template v-else>
            <div class="mt-2 overflow-x-auto">
              <table class="w-full text-left text-xs">
                <thead class="text-muted dark:text-night-muted"><tr><th class="py-1 pr-3 font-medium">{{ $t('Package') }}</th><th class="py-1 pr-3 font-medium">{{ $t('Installed') }}</th><th class="py-1 pr-3 font-medium">{{ $t('Safe update') }}</th><th class="py-1 pr-3 font-medium">{{ $t('Latest') }}</th><th class="py-1"><span class="sr-only">{{ $t('Update') }}</span></th></tr></thead>
                <tbody>
                  <tr v-for="p in packages.outdated.items" :key="p.name" class="border-t border-line/70 dark:border-night-line">
                    <td class="py-1.5 pr-3 font-mono">{{ p.name }}</td><td class="py-1.5 pr-3">{{ p.current || '–' }}</td><td class="py-1.5 pr-3">{{ p.wanted }}</td>
                    <td class="py-1.5 pr-3">{{ p.latest }} <span v-if="p.major" class="ml-1 text-clay-500">{{ $t('major change, test first') }}</span></td>
                    <td class="py-1.5 text-right">
                      <button v-if="safeUpdates.includes(p)" class="btn-soft !px-3 !py-1 text-xs" :disabled="!!upd.busy || upd.restarting" @click="applyUpdate(p.name)">
                        <ic v-if="upd.busy===p.name" name="spinner" class="size-3.5 animate-spin"></ic>{{ $t('Update to {0}', [p.wanted]) }}
                      </button>
                    </td>
                  </tr>
                </tbody>
              </table>
            </div>
            <div v-if="safeUpdates.length" class="mt-3 flex flex-wrap items-center gap-3">
              <button class="btn-primary !py-1.5 text-sm" :disabled="!!upd.busy || upd.restarting" @click="applyUpdate()">
                <ic :name="upd.busy==='*' ? 'spinner' : 'refresh'" :class="['size-4', upd.busy==='*' && 'animate-spin']"></ic>{{ upd.busy ? $t('Updating…') : $t('Update all safe ones ({0})', [safeUpdates.length]) }}
              </button>
              <span class="text-xs text-muted dark:text-night-muted">{{ info.isolated ? $t('In the isolation the launcher outside it runs npm update; if the library does not start with the new versions, the previous ones come back by themselves.') : $t('Runs npm update without the install scripts of the packages.') }}</span>
            </div>
            <div v-if="majorOnly.length" class="mt-3 rounded-xl bg-amber-50 px-3 py-2 text-xs text-amber-800 dark:bg-amber-500/10 dark:text-amber-200">
              <p>{{ $t('Major versions are not installed from here: they may need another version of Node.js or break the code. If you still want one, run this in the project folder and then the tests:') }}</p>
              <div v-for="p in majorOnly" :key="p.name" class="mt-1.5 flex items-center gap-2 rounded-lg bg-white/60 px-2 py-1 dark:bg-white/5">
                <code class="min-w-0 flex-1 break-all">npm install {{ p.name }}@{{ p.latest }} &amp;&amp; npm test</code>
                <button class="btn-ghost !p-1" :title="$t('Copy')" :aria-label="$t('Copy')" @click="$emit('copy', 'npm install ' + p.name + '@' + p.latest + ' && npm test')"><ic name="copy" class="size-3.5"></ic></button>
              </div>
            </div>
          </template>
        </div>
        <div>
          <h3 class="font-medium">{{ $t('Known vulnerabilities') }}</h3>
          <p v-if="!packages.audit.ok" class="mt-1 text-clay-500">{{ packages.audit.error }}</p>
          <p v-else-if="!packages.audit.total" class="mt-1 text-sage-700 dark:text-sage-200">{{ $t('npm audit reports none.') }}</p>
          <template v-else>
            <p class="mt-1">{{ $t('npm audit reports {0}: {1} critical, {2} high, {3} moderate, {4} low.', [packages.audit.total, packages.audit.critical, packages.audit.high, packages.audit.moderate, packages.audit.low]) }}</p>
            <ul class="mt-2 space-y-0.5 text-xs text-muted dark:text-night-muted">
              <li v-for="v in packages.audit.items" :key="v.name"><span class="font-mono">{{ v.name }}</span> · {{ v.severity }}<template v-if="v.direct"> · {{ $t('used directly') }}</template></li>
            </ul>
          </template>
        </div>
      </div>
    </section>

    </template>

    <!-- Данни: друг доставчик, локален модел или ръчен режим -->
    <template v-if="section==='data'">
    <section v-if="!AI.claude" class="card mt-5 p-5">
      <h2 class="font-serif text-xl font-semibold">{{ $t('Your data and {ai}') }}</h2>
      <div :class="['mt-3 rounded-xl px-4 py-3 text-sm', ['local','commercial'].includes(info.account.terms) ? 'bg-sage-50 text-sage-700 dark:bg-sage-900/40 dark:text-sage-200' : 'bg-amber-50 text-amber-800 dark:bg-amber-500/10 dark:text-amber-300']">
        <p v-if="info.account.terms==='local'">{{ $t('The model runs on this computer: the texts of the sources, the pages and your questions do not leave it.') }}</p>
        <p v-else-if="info.account.terms==='manual'">{{ $t('Nothing is sent by itself: you copy every request into the chat yourself. The terms of your chat account apply, including whether conversations are used to train models. Check its privacy settings.') }}</p>
        <p v-else-if="info.account.terms==='free-tier'">{{ $t('Whatever {ai} processes goes to {0}. On free tiers providers often use the content to improve their models: do not process private material with a free key.', [info.account.vendor || AI.vendor]) }}</p>
        <p v-else>{{ $t('Whatever {ai} processes goes to {0}. With paid API access providers usually do not train on the data by default, but check their terms.', [info.account.vendor || AI.vendor]) }}</p>
      </div>
      <p class="mt-3 text-sm">{{ $t('Reading, searching and the local modes stay on this computer with every model.') }}</p>
    </section>
    <section v-else class="card mt-5 p-5">
      <h2 class="font-serif text-xl font-semibold">{{ $t('Your data and Anthropic') }}</h2>
      <p class="mt-1 text-sm">{{ $t('Whatever Claude processes (the text of a source, the pages and your question) goes to Anthropic through Claude Code. Reading, searching and local modes stay on this computer.') }}</p>
      <div :class="['mt-3 rounded-xl px-4 py-3 text-sm', info.account.terms==='commercial' ? 'bg-sage-50 text-sage-700 dark:bg-sage-900/40 dark:text-sage-200' : 'bg-amber-50 text-amber-800 dark:bg-amber-500/10 dark:text-amber-300']">
        <p v-if="info.account.terms==='consumer'"><b>{{ $t('Your plan: {0} (consumer terms).', [info.account.plan]) }}</b> {{ $t('Your data trains Anthropic models only if the model improvement setting of your account is on. The application cannot read this setting, so check it yourself.') }}</p>
        <p v-else-if="info.account.terms==='commercial'"><b>{{ $t('Your plan: {0} (commercial terms).', [info.account.plan]) }}</b> {{ $t('Anthropic does not train models on this data by default, unless your organization has opted in, for example to the Development Partner Program.') }}</p>
        <p v-else>{{ $t('The plan could not be determined. Check your plan and privacy setting in your Claude account.') }}</p>
      </div>
      <ol class="mt-3 list-decimal space-y-1 pl-5 text-sm">
        <li>{{ $t('Free, Pro, Max or Ultra: open the privacy settings and turn off the use of your data for model improvement.') }} <a href="https://claude.ai/settings/data-privacy-controls" target="_blank" rel="noopener" class="underline">claude.ai/settings/data-privacy-controls</a></li>
        <li>{{ $t('Do not send sessions through /feedback or thumbs up and down: these are kept separately.') }}</li>
        <li>{{ $t('For material that must never leave your computer: do not process it with Claude at all.') }}</li>
      </ol>
      <a href="/product/#data" target="_blank" rel="noopener" class="mt-3 inline-block text-sm underline">{{ $t('Full explanation with sources') }}</a>
    </section>
    </template>

    <!-- Парола -->
    <section v-if="section==='password'" class="card mt-6 p-5">
      <h2 class="font-serif text-xl font-semibold">{{ $t('Password for this interface') }}</h2>
      <p class="mt-1 text-sm text-muted dark:text-night-muted">{{ $t('Off by default. It stops other people and programs on this computer from opening the library through the browser. It does not encrypt the files.') }}</p>
      <p class="mt-3 text-sm font-medium">{{ info.auth ? $t('The password is on.') : $t('The password is off.') }}</p>
      <form class="mt-3 grid max-w-sm gap-2" @submit.prevent="savePassword(false)">
        <input v-if="info.auth" v-model="pw.current" type="password" autocomplete="current-password" :placeholder="$t('Current password')" :aria-label="$t('Current password')" class="rounded-xl border border-line bg-panel px-3 py-2 text-sm dark:border-night-line dark:bg-night-panel">
        <input v-model="pw.next" type="password" autocomplete="new-password" :placeholder="$t('New password (at least 8 characters)')" :aria-label="$t('New password (at least 8 characters)')" class="rounded-xl border border-line bg-panel px-3 py-2 text-sm dark:border-night-line dark:bg-night-panel">
        <div class="flex flex-wrap gap-2">
          <button type="submit" class="btn-primary !py-1.5 text-sm" :disabled="busy.auth || !pw.next">{{ info.auth ? $t('Change the password') : $t('Set a password') }}</button>
          <button v-if="info.auth" type="button" class="btn-ghost !py-1.5 text-sm" :disabled="busy.auth || !pw.current" @click="savePassword(true)">{{ $t('Remove the password') }}</button>
          <button v-if="info.auth" type="button" class="btn-ghost !py-1.5 text-sm" @click="signOut">{{ $t('Sign out') }}</button>
        </div>
      </form>
      <p v-if="pw.message" class="mt-2 text-sm" :class="pw.bad && 'text-clay-500'">{{ pw.message }}</p>
      <p class="mt-2 text-xs text-muted dark:text-night-muted">{{ $t('If you forget it, stop the application and delete the file .library-auth.json in the project folder.') }}</p>
    </section>

    <!-- Тестове -->
    <section v-if="section==='tests'" class="card mt-5 p-5">
      <h2 class="font-serif text-xl font-semibold">{{ $t('What works and what does not') }}</h2>
      <p class="mt-1 text-sm text-muted dark:text-night-muted">{{ $t('The tests run in a temporary copy with a simulated Claude. They do not touch your library and cost nothing.') }}</p>

          <span class="chip bg-amber-50 text-amber-800 dark:bg-amber-500/10 dark:text-amber-300">{{ $t('{0} known limitations', [tests.summary.known]) }}</span>
          <span class="chip bg-ink/5 dark:bg-white/5">{{ $t('{0} not tested', [tests.summary.notCovered + tests.summary.notRun]) }}</span>
        </div>
        <details v-for="g in testGroups" :key="g.key" class="mt-3" :open="g.bad > 0">

            </li>
          </ul>
        </details>
        <details class="mt-3">
          <summary class="cursor-pointer font-medium">{{ $t('Not covered by automatic tests') }} <span class="font-normal text-muted dark:text-night-muted">({{ tests.notCovered.length }})</span></summary>

            <li v-for="t in tests.notCovered" :key="t.en">{{ pick(t) }}<span class="block text-xs text-muted dark:text-night-muted">{{ pick(t.why) }}</span></li>
          </ul>
        </details>
      </div>
    </section>

  </template>
    </div>
  </div>
</div>
</script>

        </div>
        <div>
          <div class="flex flex-wrap items-center gap-2">
            <span class="text-sm font-medium">{{ $t('Creativity') }}</span>

              <button v-for="c in CREATIVITY" :key="c.n" type="button" role="radio" :aria-checked="creativity===c.n" :title="c.hint" @click="setCreativity(c.n)"
                      :class="['rounded-full px-3 py-1 text-xs transition', creativity===c.n ? 'bg-sage-600 text-white shadow-soft' : 'text-muted hover:text-ink dark:hover:text-night-ink']">{{ c.n }} · {{ c.label }}</button>

      <p v-if="langNote" class="mt-4 flex gap-2 rounded-2xl bg-clay-100 px-3 py-2 text-sm text-clay-500 dark:bg-clay-500/15"><ic name="alert" class="mt-0.5 size-4 shrink-0"></ic>{{ langNote }}</p>

        <span v-if="loading && level!=='local'" class="text-sm text-muted dark:text-night-muted">{{ $t('{ai} ({0} model) is reading the library and writing… {1} s', [levelLabel(level).toLowerCase(), waited]) }}</span>

      </div>
      <p v-if="error" class="mt-3 flex gap-2 rounded-2xl bg-clay-100 px-3 py-2 text-sm text-clay-500 dark:bg-clay-500/15"><ic name="alert" class="mt-0.5 size-4 shrink-0"></ic>{{ error }}</p>
      <p class="mt-3 text-xs text-muted dark:text-night-muted">{{ $t('Citations are converted automatically to APA 7, and the bibliography contains only the sources actually cited. “Blank document” opens an empty text with the title from the field above, if there is one. Every text is saved as an .md file in the project’s drafts/ folder.') }}</p>

    <section class="mt-12">
      <div class="flex flex-wrap items-end justify-between gap-3">
        <h2 class="font-sans text-xl font-semibold tracking-tight">{{ $t('My texts') }}</h2>

          <ic name="search" class="pointer-events-none absolute left-3 top-1/2 size-4 -translate-y-1/2 text-muted"></ic>

        </div>

            <span class="mt-0.5 grid size-8 shrink-0 place-items-center rounded-xl bg-sage-50 text-sage-600 dark:bg-sage-900/40 dark:text-sage-200"><ic :name="d.mode==='blank' ? 'pen' : 'file'" class="size-4"></ic></span>

              <span class="block truncate font-medium transition group-hover:text-sage-700 dark:group-hover:text-sage-200">{{ d.title }}</span>
              <span class="block truncate text-xs text-muted dark:text-night-muted">{{ d.excerpt }}</span>
            </span>
            <span class="hidden shrink-0 text-right text-xs text-muted dark:text-night-muted sm:block">
              <span class="block">{{ genreLabel(d.genre) }} · {{ modeLabel(d.mode) }}</span>
              <span class="block tabular-nums">{{ $t('{0} words · {1}', [d.words, relDate(d.updated)]) }}</span>
            </span>
          </a>
          <button class="btn-ghost my-auto mr-2 !p-2 text-muted hover:text-clay-500" :title="$t('Delete “{0}”', [d.title])" :aria-label="$t('Delete {0}', [d.title])" @click="removeDraft(d)"><ic name="trash" class="size-4"></ic></button>
        </li>
      </ul>
      <p v-else class="mt-4 text-sm text-muted dark:text-night-muted">{{ filter ? $t('Nothing matches the search.') : $t('There are no texts yet. Write a topic above and the first draft will appear here.') }}</p>
    </section>
  </template>

  <!-- Редактор на записан текст -->
  <template v-else>
    <a href="#/write" class="inline-flex items-center gap-1.5 text-sm text-muted hover:text-ink dark:text-night-muted dark:hover:text-night-ink"><ic name="arrowLeft" class="size-4"></ic>{{ $t('Write with the wiki') }}</a>
    <p v-if="loadError" class="mt-8 text-muted">{{ $t('This text was not found.') }}</p>
    <template v-else-if="doc">
      <!-- Заглавието: щракване = смяна (сменя реда „# …“ в текста) -->
      <input v-if="titleEdit!==null" ref="titleInput" v-model="titleEdit" :aria-label="$t('Title')" @keydown.enter.prevent="saveTitle" @keydown.esc.prevent="titleEdit=null" @blur="saveTitle"
             class="mt-4 w-full rounded-2xl border border-sage-400 bg-panel px-3 py-1 font-serif text-3xl font-semibold leading-tight tracking-tight outline-none dark:bg-night-panel sm:text-4xl">
      <h1 v-else class="mt-4 cursor-text rounded-xl font-serif text-3xl font-semibold leading-tight tracking-tight outline-none transition hover:bg-ink/[.03] focus-visible:ring-2 focus-visible:ring-sage-400 dark:hover:bg-white/5 sm:text-4xl"
          tabindex="0" :title="$t('Click to change the title')" @click="startTitle" @keydown.enter.prevent="startTitle">{{ docTitle || $t('Untitled text') }}</h1>
      <div class="mt-4 flex flex-wrap items-center gap-2">
        <span class="chip bg-sage-50 text-sage-700 dark:bg-sage-900/40 dark:text-sage-200"><ic :name="doc.mode==='local' ? 'search' : doc.mode==='blank' ? 'pen' : 'sparkle'" class="size-3"></ic>{{ genreLabel(ed.genre) }} · {{ modeLabel(doc.mode) }}</span>
        <span class="chip text-muted dark:text-night-muted tabular-nums">{{ $t('{0} words', [wordsN]) }}</span>
        <span :class="['chip', dirty ? 'bg-amber-50 text-amber-800 dark:bg-amber-500/10 dark:text-amber-300' : 'text-muted dark:text-night-muted']"><ic :name="dirty ? 'pen' : 'check'" class="size-3"></ic>{{ saving ? $t('Saving…') : dirty ? $t('There are unsaved changes') : $t('Saved') + (doc.updated ? ' · ' + relDate(doc.updated) : '') }}</span>
        <button class="chip border border-line text-muted hover:text-ink dark:border-night-line" :title="$t('Copy the path')" @click="$root.copy(doc.path)"><ic name="file" class="size-3"></ic>{{ doc.path }}</button>
      </div>

      <div v-for="(w,i) in warnings" :key="i" class="mt-4 flex gap-2 rounded-2xl bg-amber-50 px-3 py-2 text-sm text-amber-800 dark:bg-amber-500/10 dark:text-amber-300"><ic name="alert" class="mt-0.5 size-4 shrink-0"></ic><span class="flex-1">{{ w }}</span><button class="shrink-0 opacity-70 hover:opacity-100" @click="warnings.splice(i,1)" :aria-label="$t('Hide')"><ic name="x" class="size-4"></ic></button></div>

      <div class="sticky top-0 z-20 -mx-2 mt-6 flex flex-wrap items-center gap-2 rounded-2xl bg-paper/90 px-2 py-2 backdrop-blur dark:bg-night/90">
        <div class="flex rounded-full border border-line p-0.5 dark:border-night-line" role="group" :aria-label="$t('View')">
          <button v-for="m in [{id:'preview',l:$t('Preview')},{id:'edit',l:$t('Editing')}]" :key="m.id" @click="mode=m.id" :aria-pressed="mode===m.id"
                  :class="['rounded-full px-3 py-1 text-sm transition', mode===m.id ? 'bg-sage-600 text-white shadow-soft' : 'text-muted hover:text-ink dark:hover:text-night-ink']">{{ m.l }}</button>
        </div>
        <button class="btn-primary !py-1.5 text-sm" :disabled="!dirty || saving" @click="save()" title="Ctrl+S"><ic name="check" class="size-4"></ic>{{ $t('Save') }}</button>
        <button class="btn-ghost !py-1.5 text-sm" :disabled="!undoStack.length || busyAny" :title="$t('Undo the last change made here')" @click="undo"><ic name="undo" class="size-4"></ic>{{ $t('Undo') }}</button>
        <span class="flex-1"></span>
        <button class="btn-ghost !py-1.5 text-sm" @click="$root.copy(body)"><ic name="copy" class="size-4"></ic>{{ $t('Copy') }}</button>
        <button class="btn-ghost !py-1.5 text-sm" @click="download"><ic name="upload" class="size-4 rotate-180"></ic>{{ $t('Download .md') }}</button>
        <button class="btn-ghost !py-1.5 text-sm text-muted" @click="remove"><ic name="x" class="size-4"></ic>{{ $t('Delete') }}</button>
      </div>

      <!-- Помощ от модела: вид, ниво, креативност, обхват и дописване -->
