        <button type="button" class="flex w-full items-center gap-2 text-left text-sm font-semibold" :aria-expanded="ed.open" @click="toggleHelp"><ic name="sparkle" class="size-4 text-sage-600"></ic>{{ $t('Help from {ai}') }}<span class="font-normal text-muted dark:text-night-muted">· {{ genreLabel(ed.genre) }} · {{ $t('creativity {0} of 5', [ed.creativity]) }}</span><span class="flex-1"></span><ic :name="ed.open ? 'x' : 'chevron'" :class="['size-4 text-muted', !ed.open && 'rotate-90']"></ic></button>
        <div v-if="ed.open" class="mt-4 space-y-4">
          <div>
            <p class="text-xs font-medium text-muted dark:text-night-muted">{{ $t('Kind of text') }}</p>
            <div class="mt-1.5 flex flex-wrap gap-1.5" role="radiogroup" :aria-label="$t('Kind of text')">
              <button v-for="g in GENRE_LIST" :key="g.id" type="button" role="radio" :aria-checked="ed.genre===g.id" :title="g.hint" @click="ed.genre=g.id"
                      :class="['chip border px-3 py-1 text-xs transition', ed.genre===g.id ? 'border-sage-500 bg-sage-50 text-sage-700 dark:bg-sage-900/40 dark:text-sage-200' : 'border-line text-ink/70 hover:border-sage-200 dark:border-night-line dark:text-night-ink/70']">{{ g.label }}</button>
            </div>
          </div>
          <div class="flex flex-wrap items-center gap-2">
            <div class="flex rounded-full border border-line p-0.5 dark:border-night-line" role="radiogroup" :aria-label="$t('{ai} level')">
              <button v-for="l in aiLevels" :key="l.id" type="button" role="radio" :aria-checked="ed.level===l.id" :title="hints[l.id]" @click="setEdLevel(l.id)"
                      :class="['rounded-full px-3 py-1 text-sm transition', ed.level===l.id ? 'bg-sage-600 text-white shadow-soft' : 'text-muted hover:text-ink dark:hover:text-night-ink']">{{ l.label }}</button>
            </div>
            <div class="flex flex-wrap rounded-3xl border border-line p-0.5 dark:border-night-line" role="radiogroup" :aria-label="$t('Creativity')">
              <button v-for="c in CREATIVITY" :key="c.n" type="button" role="radio" :aria-checked="ed.creativity===c.n" :title="c.label + ': ' + c.hint" @click="ed.creativity=c.n"
                      :class="['rounded-full px-2.5 py-1 text-sm transition', ed.creativity===c.n ? 'bg-sage-600 text-white shadow-soft' : 'text-muted hover:text-ink dark:hover:text-night-ink']">{{ c.n }}<span v-if="ed.creativity===c.n"> · {{ c.label }}</span></button>
            </div>
          </div>
          <p class="text-xs text-muted dark:text-night-muted">{{ edCreatInfo.hint }} {{ ed.genre==='story' ? $t('In fiction the level also sets how freely the plot and the characters are invented.') : $t('At every level the facts and the citations come only from the library.') }}</p>

          <div>
            <p class="text-xs font-medium text-muted dark:text-night-muted">{{ $t('What {ai} uses for this text') }}</p>
            <p v-if="!scope.areas.length && !scope.focus.length" class="mt-1 text-xs text-muted dark:text-night-muted">{{ $t('No limits: {ai} looks in the whole library. Choose areas or topics below to narrow it.') }}</p>
            <scope-bar class="mt-1.5 block" :q="scopeQ" :pages="pages"></scope-bar>
            <p v-if="citedPages.length" class="mt-2 flex flex-wrap items-center gap-1.5 text-xs text-muted dark:text-night-muted">
              <span>{{ $t('Cited in the text:') }}</span>
              <a v-for="c in citedPages" :key="c.slug" :href="'#/p/'+encodeURIComponent(c.slug)" :class="['chip border border-line px-2 py-0.5 hover:border-sage-300 dark:border-night-line', c.missing && 'line-through opacity-60']">{{ c.title }}</a>
            </p>
          </div>

          <div class="border-t border-line pt-4 dark:border-night-line">
            <label class="text-sm font-medium" for="cont-ins">{{ $t('Continue the text') }}</label>
            <p class="text-xs text-muted dark:text-night-muted">{{ $t('What should it add? (optional; without guidance {ai} adds the most valuable thing that is missing)') }}</p>
            <textarea id="cont-ins" v-model="cont.instruction" rows="2" maxlength="1000" :placeholder="$t('E.g. add a section on the role of the alliance system')" class="mt-1.5 w-full resize-y rounded-2xl border border-line bg-paper px-3 py-2 text-sm outline-none transition focus:border-sage-400 dark:border-night-line dark:bg-night"></textarea>
            <div class="mt-2 flex flex-wrap items-center gap-2">
              <div class="flex rounded-full border border-line p-0.5 dark:border-night-line" role="group" :aria-label="$t('Length of the addition')">
                <button v-for="w in [{n:300,l:$t('Brief')},{n:600,l:$t('Moderate')},{n:1200,l:$t('Long')}]" :key="w.n" type="button" @click="cont.words=w.n" :aria-pressed="cont.words===w.n"
                        :class="['rounded-full px-3 py-1 text-sm transition', cont.words===w.n ? 'bg-sage-600 text-white shadow-soft' : 'text-muted hover:text-ink dark:hover:text-night-ink']">{{ w.l }}</button>
              </div>
              <span class="flex-1"></span>
              <button v-if="cont.busy" type="button" class="btn-ghost text-sm" @click="cancelCont">{{ $t('Cancel ({0} s)', [cont.waited]) }}</button>
              <button type="button" class="btn-primary text-sm" :disabled="busyAny" @click="continueDoc"><ic name="sparkle" class="size-4"></ic>{{ cont.busy ? $t('Writing…') : $t('Continue') }}</button>
            </div>
            <p v-if="cont.error" class="mt-3 flex gap-2 rounded-2xl bg-clay-100 px-3 py-2 text-sm text-clay-500 dark:bg-clay-500/15"><ic name="alert" class="mt-0.5 size-4 shrink-0"></ic>{{ cont.error }}</p>
          </div>
          <p class="text-xs text-muted dark:text-night-muted">{{ $t('In “Preview”, point at a paragraph (or tap it) to change it by hand, rewrite it with {ai}, add a paragraph after it or remove it.') }}</p>
        </div>
        <p v-if="cont.note" class="mt-3 flex flex-wrap items-center gap-2 rounded-2xl bg-sage-50 px-3 py-2 text-sm text-sage-700 dark:bg-sage-900/40 dark:text-sage-200"><ic name="check" class="size-4 shrink-0"></ic><span class="flex-1">{{ cont.note }}</span><button v-if="undoStack.length" type="button" class="underline" @click="undo">{{ $t('Undo the addition') }}</button></p>
      </section>

      <textarea v-if="mode==='edit'" ref="raw" v-model="body" spellcheck="true" :aria-label="$t('The text in Markdown')" class="mt-3 min-h-[70vh] w-full resize-y rounded-3xl border border-line bg-panel p-5 font-mono text-[14px] leading-relaxed outline-none transition focus:border-sage-400 dark:border-night-line dark:bg-night-panel"></textarea>
      <p v-if="mode==='edit'" class="mt-2 text-xs text-muted dark:text-night-muted">{{ $t('Markdown. Ctrl+S saves. On every save the previous version is kept in drafts/.history/. The file can also be edited outside the library.') }}</p>

      <!-- Преглед по абзаци: всеки абзац се сменя на ръка или с модела, след всеки може да се вмъкне нов -->
      <div v-else class="reading mt-6 max-w-3xl">
        <div v-for="s in [{ head: true, i: -1 }, ...shownBlocks]" :key="s.head ? 'head' : s.start + ':' + s.i"
             :class="['group relative rounded-2xl transition', !s.head && '-mx-3 px-3 py-1', s.heading && '!mt-10', s.fresh && 'bg-sage-50 ring-1 ring-sage-200 dark:bg-sage-900/30 dark:ring-sage-800']"
             @click="!s.head && (active = s.i)">
          <!-- начало: нов абзац след заглавието -->
          <template v-if="s.head">
            <button v-if="shownBlocks.length && !isOpen('ins', s)" type="button" class="inline-flex items-center gap-1.5 rounded-full px-2 py-0.5 font-sans text-xs text-muted transition hover:bg-ink/5 hover:text-ink disabled:opacity-50 dark:text-night-muted dark:hover:bg-white/10 dark:hover:text-night-ink" :disabled="busyAny" @click="openBlock('ins', s)"><ic name="plus" class="size-3.5"></ic>{{ $t('Add a paragraph at the beginning') }}</button>
            <p v-if="!shownBlocks.length && !isOpen('ins', s)" class="font-sans text-sm text-muted dark:text-night-muted">{{ $t('The text is empty.') }} <button type="button" class="underline" @click="openBlock('ins', s)">{{ $t('Write the first paragraph') }}</button> {{ $t('or switch to “Editing”.') }}</p>
          </template>

          <!-- абзацът: ръчна смяна -->
          <div v-else-if="isOpen('edit', s)" class="font-sans text-sm" @click.stop>
            <textarea data-blk-focus v-model="blk.text" :rows="Math.min(18, Math.max(3, Math.ceil(blk.text.length / 75) + blk.text.split('\n').length))" :aria-label="$t('The paragraph in Markdown')" @keydown.ctrl.enter.prevent="applyEdit(s)" @keydown.esc.prevent="closeBlock"
                      class="w-full resize-y rounded-2xl border border-sage-400 bg-panel p-3 font-mono text-[14px] leading-relaxed outline-none dark:bg-night-panel"></textarea>
            <div class="mt-2 flex flex-wrap items-center gap-2">
              <span class="text-xs text-muted dark:text-night-muted">{{ $t('Markdown. Ctrl+Enter applies, Esc cancels. An empty paragraph is removed.') }}</span>
              <span class="flex-1"></span>
              <button type="button" class="btn-ghost text-sm" @click="closeBlock">{{ $t('Cancel') }}</button>
              <button type="button" class="btn-primary text-sm" @click="applyEdit(s)"><ic name="check" class="size-4"></ic>{{ $t('Apply') }}</button>
            </div>
          </div>
          <template v-else>
            <div class="blk" v-html="s.html"></div>
            <div v-if="!busyAny" :class="['absolute -top-3 right-1 z-10 flex gap-0.5 rounded-full border border-line bg-panel p-0.5 font-sans shadow-soft transition dark:border-night-line dark:bg-night-panel', active===s.i ? 'opacity-100' : 'opacity-0 focus-within:opacity-100 group-hover:opacity-100']">
              <button type="button" class="grid size-7 place-items-center rounded-full text-muted hover:bg-ink/5 hover:text-ink dark:hover:bg-white/10 dark:hover:text-night-ink" :title="$t('Change by hand')" :aria-label="$t('Change by hand')" @click.stop="openBlock('edit', s)"><ic name="pen" class="size-3.5"></ic></button>
              <button v-if="!s.heading && !s.bib" type="button" class="grid size-7 place-items-center rounded-full text-sage-600 hover:bg-sage-50 dark:text-sage-200 dark:hover:bg-sage-900/40" :title="$t('Rewrite with {ai}')" :aria-label="$t('Rewrite with {ai}')" @click.stop="openBlock('ai', s)"><ic name="sparkle" class="size-3.5"></ic></button>
              <button v-if="!s.bib" type="button" class="grid size-7 place-items-center rounded-full text-muted hover:bg-ink/5 hover:text-ink dark:hover:bg-white/10 dark:hover:text-night-ink" :title="$t('Add a paragraph after it')" :aria-label="$t('Add a paragraph after it')" @click.stop="openBlock('ins', s)"><ic name="plus" class="size-3.5"></ic></button>
              <button type="button" class="grid size-7 place-items-center rounded-full text-muted hover:bg-clay-100 hover:text-clay-500 dark:hover:bg-clay-500/15" :title="$t('Remove')" :aria-label="$t('Remove')" @click.stop="removeBlock(s)"><ic name="trash" class="size-3.5"></ic></button>
            </div>
          </template>

          <!-- пренаписване с модела -->
          <div v-if="isOpen('ai', s)" class="mt-3 rounded-2xl border border-line bg-panel p-3 font-sans text-sm dark:border-night-line dark:bg-night-panel" @click.stop>
            <label class="text-xs text-muted dark:text-night-muted" :for="'blk-ai-' + s.i">{{ $t('How should {ai} change it? (optional; without guidance it makes the paragraph clearer and better connected)') }}</label>
            <textarea :id="'blk-ai-' + s.i" data-blk-focus v-model="blk.instruction" rows="2" maxlength="1000" :placeholder="$t('E.g. shorter, with an example, more vivid, closer to the sources')" @keydown.ctrl.enter.prevent="aiBlock('rewrite', s)"
                      class="mt-1 w-full resize-y rounded-2xl border border-line bg-paper px-3 py-2 text-sm outline-none transition focus:border-sage-400 dark:border-night-line dark:bg-night"></textarea>
            <div class="mt-2 flex flex-wrap items-center gap-2">
              <span class="text-xs text-muted dark:text-night-muted">{{ genreLabel(ed.genre) }} · {{ $t('creativity {0} of 5', [ed.creativity]) }} · {{ levelLabel(ed.level) }}</span>
              <span class="flex-1"></span>
              <button v-if="blk.busy" type="button" class="btn-ghost text-sm" @click="cancelBlock">{{ $t('Cancel ({0} s)', [blk.waited]) }}</button>
              <button v-else type="button" class="btn-ghost text-sm" @click="closeBlock">{{ $t('Cancel') }}</button>
              <button type="button" class="btn-primary text-sm" :disabled="blk.busy" @click="aiBlock('rewrite', s)"><ic :name="blk.busy ? 'spinner' : 'sparkle'" :class="['size-4', blk.busy && 'animate-spin']"></ic>{{ blk.busy ? $t('Writing…') : $t('Rewrite') }}</button>
            </div>
            <p v-if="blk.error" class="mt-2 flex gap-2 rounded-2xl bg-clay-100 px-3 py-2 text-sm text-clay-500 dark:bg-clay-500/15"><ic name="alert" class="mt-0.5 size-4 shrink-0"></ic>{{ blk.error }}</p>
          </div>

          <!-- нов абзац след този (или в началото): свой текст или от модела -->
          <div v-if="isOpen('ins', s)" class="mt-3 rounded-2xl border border-line bg-panel p-3 font-sans text-sm dark:border-night-line dark:bg-night-panel" @click.stop>
            <div class="flex w-max rounded-full border border-line p-0.5 dark:border-night-line" role="group" :aria-label="$t('Who writes the paragraph')">
              <button type="button" :aria-pressed="blk.own" @click="blk.own=true" :class="['rounded-full px-3 py-1 text-sm transition', blk.own ? 'bg-sage-600 text-white shadow-soft' : 'text-muted hover:text-ink dark:hover:text-night-ink']">{{ $t('I write it') }}</button>
              <button type="button" :aria-pressed="!blk.own" @click="blk.own=false" :class="['rounded-full px-3 py-1 text-sm transition', !blk.own ? 'bg-sage-600 text-white shadow-soft' : 'text-muted hover:text-ink dark:hover:text-night-ink']">{{ $t('{ai} writes it') }}</button>
            </div>
            <template v-if="blk.own">
              <textarea data-blk-focus v-model="blk.text" rows="4" :aria-label="$t('The new paragraph')" :placeholder="$t('The new paragraph. Markdown works: ## for a heading, - for a list.')" @keydown.ctrl.enter.prevent="insertOwn(s.head ? null : s)" @keydown.esc.prevent="closeBlock"
                        class="mt-2 w-full resize-y rounded-2xl border border-line bg-paper px-3 py-2 font-serif text-[16px] leading-relaxed outline-none transition focus:border-sage-400 dark:border-night-line dark:bg-night"></textarea>
              <div class="mt-2 flex flex-wrap items-center gap-2">
                <span class="text-xs text-muted dark:text-night-muted">{{ $t('Ctrl+Enter adds it.') }}</span>
                <span class="flex-1"></span>
                <button type="button" class="btn-ghost text-sm" @click="closeBlock">{{ $t('Cancel') }}</button>
                <button type="button" class="btn-primary text-sm" :disabled="!blk.text.trim()" @click="insertOwn(s.head ? null : s)"><ic name="plus" class="size-4"></ic>{{ $t('Add') }}</button>
              </div>
            </template>
            <template v-else>
              <textarea data-blk-focus v-model="blk.instruction" rows="2" maxlength="1000" :aria-label="$t('What should the new paragraph say?')" :placeholder="$t('What should the new paragraph say? (optional; without guidance {ai} adds what is most needed here)')" @keydown.ctrl.enter.prevent="aiBlock('insert', s.head ? null : s)"
                        class="mt-2 w-full resize-y rounded-2xl border border-line bg-paper px-3 py-2 text-sm outline-none transition focus:border-sage-400 dark:border-night-line dark:bg-night"></textarea>
              <div class="mt-2 flex flex-wrap items-center gap-2">
                <div class="flex rounded-full border border-line p-0.5 dark:border-night-line" role="group" :aria-label="$t('Length of the addition')">
                  <button v-for="w in [{n:80,l:$t('Brief')},{n:150,l:$t('Moderate')},{n:300,l:$t('Long')}]" :key="w.n" type="button" @click="blk.words=w.n" :aria-pressed="blk.words===w.n"
                          :class="['rounded-full px-3 py-1 text-sm transition', blk.words===w.n ? 'bg-sage-600 text-white shadow-soft' : 'text-muted hover:text-ink dark:hover:text-night-ink']">{{ w.l }}</button>
                </div>
                <span class="text-xs text-muted dark:text-night-muted">{{ genreLabel(ed.genre) }} · {{ $t('creativity {0} of 5', [ed.creativity]) }} · {{ levelLabel(ed.level) }}</span>
                <span class="flex-1"></span>
                <button v-if="blk.busy" type="button" class="btn-ghost text-sm" @click="cancelBlock">{{ $t('Cancel ({0} s)', [blk.waited]) }}</button>
                <button v-else type="button" class="btn-ghost text-sm" @click="closeBlock">{{ $t('Cancel') }}</button>
                <button type="button" class="btn-primary text-sm" :disabled="blk.busy" @click="aiBlock('insert', s.head ? null : s)"><ic :name="blk.busy ? 'spinner' : 'sparkle'" :class="['size-4', blk.busy && 'animate-spin']"></ic>{{ blk.busy ? $t('Writing…') : $t('Write') }}</button>
              </div>
            </template>
            <p v-if="blk.error" class="mt-2 flex gap-2 rounded-2xl bg-clay-100 px-3 py-2 text-sm text-clay-500 dark:bg-clay-500/15"><ic name="alert" class="mt-0.5 size-4 shrink-0"></ic>{{ blk.error }}</p>
          </div>
        </div>
      </div>
    </template>
  </template>
</div>
</script>

<!-- ============================ КАРТА НА ВРЪЗКИТЕ ============================ -->
<script type="text/x-template" id="tpl-graph">
<div class="relative h-[calc(100dvh-57px)] lg:h-dvh">
  <canvas ref="canvas" class="absolute inset-0 size-full cursor-grab active:cursor-grabbing"></canvas>
  <div class="pointer-events-none absolute left-5 top-5 sm:left-8 sm:top-8">
    <p class="eyebrow">{{ $t('Link map') }}</p>
    <h1 class="mt-1 font-serif text-3xl font-semibold tracking-tight">{{ $t('{0} pages, {1} links', [nodes.length, edges.length]) }}</h1>
    <p class="mt-1 text-sm text-muted dark:text-night-muted">{{ $t('Drag to move · scroll wheel to zoom · click opens the page') }}</p>
  </div>
  <div class="card absolute bottom-5 left-5 flex flex-wrap gap-x-4 gap-y-1.5 px-4 py-3 text-xs sm:left-8">
    <span v-for="t in typeOrder" :key="t" class="flex items-center gap-1.5"><span class="size-2.5 rounded-full" :style="{background: TYPES[t].hex}"></span>{{ TYPES[t].plural }}</span>
  </div>
  <div v-if="hover" class="card pointer-events-none absolute px-3 py-2 text-sm font-medium" :style="{left: hover.x+14+'px', top: hover.y+14+'px'}">{{ hover.title }}</div>
  <div v-if="loaded && !nodes.length" class="absolute inset-0 grid place-items-center p-6">
    <div class="card max-w-sm p-8 text-center">
      <span class="mx-auto grid size-14 place-items-center rounded-3xl bg-sage-50 text-sage-600 dark:bg-sage-900/40 dark:text-sage-200"><ic name="graph" class="size-6"></ic></span>
      <p class="mt-4 font-serif text-xl font-semibold">{{ $t('The map is empty') }}</p>
      <p class="mt-2 text-sm text-muted dark:text-night-muted">{{ $t('Every processed source adds points and threads here. In time you will see which ideas are at the centre of your library.') }}</p>
    </div>
  </div>
</div>
</script>

<!-- ============================ КАРТА НА СТРАНИЦА ============================ -->
<script type="text/x-template" id="tpl-card">
<a :href="'#/p/'+p.slug" :class="['card card-hover group flex flex-col', big ? 'p-5' : 'p-4']">
  <div class="flex items-center gap-2">
    <span :class="['grid size-7 shrink-0 place-items-center rounded-lg', T.soft]"><ic :name="p.type==='source' && FORMAT_ICON[p.format] ? FORMAT_ICON[p.format] : T.icon" class="size-3.5"></ic></span>
    <span class="text-xs text-muted dark:text-night-muted">{{ p.type==='source' && p.format ? (FORMATS[p.format]||T.label) : (p.kind ? (KINDS[p.kind]||T.label) : T.label) }}<template v-if="p.year"> · {{ p.year }}</template></span>
    <span v-if="p.confidence==='low'" class="ml-auto size-1.5 rounded-full bg-clay-400" :title="$t('Low confidence')"></span>
  </div>
  <p :class="['mt-3 font-serif font-semibold leading-snug transition group-hover:text-sage-700 dark:group-hover:text-sage-200', big ? 'text-lg' : 'text-base']">{{ p.title }}</p>
  <p v-if="p.excerpt" :class="['mt-1.5 text-sm text-muted dark:text-night-muted', big ? 'line-clamp-3' : 'line-clamp-2']">{{ p.excerpt }}</p>
  <div class="mt-auto flex items-center gap-3 pt-4 text-xs text-muted dark:text-night-muted">
    <span v-if="p.backlinks" class="flex items-center gap-1"><ic name="link" class="size-3"></ic>{{ p.backlinks }}</span>
    <span v-if="p.updated">{{ relDate(p.updated) }}</span>
  </div>
</a>
</script>

<script src="/locale.js"></script>
<script src="/i18n.js"></script>
<script src="/vendor/vue.js"></script>
<script src="/vendor/marked.js"></script>
<script src="/app.js"></script>
</body>
