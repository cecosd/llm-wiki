          </li>
        </ol>
        <p v-if="manualError" class="mt-2 text-sm text-clay-500">{{ manualError }}</p>
      </div>
      <div class="flex flex-wrap items-center gap-2 border-t border-line px-6 py-4 dark:border-night-line">
        <button class="btn-ghost !py-1.5 text-sm text-clay-500" @click="manualSkip">{{ $t('Stop this request') }}</button>
        <span class="flex-1"></span>
        <button class="btn-ghost" @click="manualHidden = true">{{ $t('Later') }}</button>
        <button class="btn-primary" :disabled="manualBusy || !manualText.trim()" @click="manualSend">{{ $t('Send the answer') }}</button>
      </div>
    </div>
  </div>
  <button v-if="!ro && manual.length && manualHidden" class="btn-primary fixed bottom-4 right-4 z-[55] !shadow-lift" @click="manualHidden = false"><ic name="clock" class="size-4"></ic>{{ $t('A request is waiting for your answer ({0})', [manual.length]) }}</button>

  <!-- Палитра за търсене -->
  <transition enter-from-class="opacity-0" leave-to-class="opacity-0" enter-active-class="transition duration-150" leave-active-class="transition duration-100">
    <div v-if="palette" class="fixed inset-0 z-50 flex items-start justify-center bg-ink/25 p-4 pt-[12vh] backdrop-blur-sm" @mousedown.self="palette=false">
      <div class="card w-full max-w-xl overflow-hidden !shadow-lift animate-rise">
        <div class="flex items-center gap-3 border-b border-line px-5 py-4 dark:border-night-line">
          <ic name="search" class="size-5 text-muted"></ic>
          <input ref="paletteInput" v-model="pq" @input="paletteSearch" @keydown="paletteKeys"
                 :placeholder="$t('Concept, author, source…')" class="flex-1 bg-transparent text-base outline-none placeholder:text-muted">
          <span class="kbd">Esc</span>
        </div>
        <div class="scrollbar-thin max-h-[52vh] overflow-y-auto p-2">
          <p v-if="!paletteItems.length" class="px-4 py-10 text-center text-sm text-muted">
            {{ pq.length < 2 && !pages.length ? $t('The library is still empty.') : $t('Nothing found. Try another word.') }}
          </p>
          <a v-for="(h,i) in paletteItems" :key="h.slug" :href="'#/p/'+h.slug" @click="palette=false" @mousemove="pi=i"
             :class="['flex items-start gap-3 rounded-2xl px-3 py-2.5 transition', pi===i && 'bg-sage-50 dark:bg-sage-900/40']">
            <span :class="['mt-0.5 grid size-8 shrink-0 place-items-center rounded-xl', (TYPES[h.type]||TYPES.other).soft]"><ic :name="(TYPES[h.type]||TYPES.other).icon" class="size-4"></ic></span>
            <span class="min-w-0">
              <span class="block truncate font-medium">{{ h.title }}</span>
              <span class="line-clamp-1 text-xs text-muted dark:text-night-muted">{{ h.snippet || h.excerpt || (TYPES[h.type]||TYPES.other).label }}</span>
            </span>
          </a>
        </div>
      </div>
    </div>
  </transition>

  <!-- Четец: самият текст на страницата от книгата -->
  <transition enter-from-class="translate-x-full" leave-to-class="translate-x-full" enter-active-class="transition duration-300 ease-out" leave-active-class="transition duration-200 ease-in">
    <aside v-if="reader" class="fixed inset-y-0 right-0 z-50 flex w-full max-w-2xl flex-col border-l border-line bg-panel shadow-lift dark:border-night-line dark:bg-night-panel">
      <header class="flex items-start gap-3 border-b border-line px-5 py-4 dark:border-night-line">
        <span class="grid size-9 shrink-0 place-items-center rounded-xl bg-clay-100 text-clay-500 dark:bg-clay-500/15"><ic name="book" class="size-4"></ic></span>
        <div class="min-w-0 flex-1">
          <a v-if="reader.data?.book" :href="'#/p/'+reader.data.book.slug" @click="reader=null" class="block truncate font-serif font-semibold hover:underline">{{ reader.data.book.title }}</a>
          <p class="truncate text-xs text-muted dark:text-night-muted">
            <template v-if="reader.data?.chapter"><a :href="'#/p/'+reader.data.chapter.slug" @click="reader=null" class="hover:underline">{{ reader.data.chapter.title }}</a> · </template>
            <template v-if="reader.data?.unit">{{ $t('{0} {1} of {2}', [reader.data.unit, reader.data.page, reader.data.last]) }}</template>
            <template v-if="reader.data?.printed"> {{ $t('· printed p. {0}', [reader.data.printed]) }}</template>
          </p>
        </div>
        <button class="btn-ghost !p-2" @click="reader=null" :aria-label="$t('Close')"><ic name="x" class="size-5"></ic></button>
      </header>
      <div class="scrollbar-thin flex-1 overflow-y-auto px-6 py-6 sm:px-8" ref="readerBody">
        <p v-if="reader.loading" class="text-sm text-muted">{{ $t('Loading…') }}</p>
        <p v-else-if="reader.error" class="rounded-2xl bg-clay-100 p-4 text-sm text-clay-500 dark:bg-clay-500/15">{{ reader.error }}</p>
        <div v-else class="whitespace-pre-line font-serif text-[16.5px] leading-[1.8] text-ink/90 dark:text-night-ink/90">{{ reader.data?.text || $t('This page is empty (it may be an image or a scan).') }}</div>
      </div>
      <footer v-if="reader.data?.unit" class="flex items-center gap-2 border-t border-line px-4 py-3 dark:border-night-line">
        <button class="btn-ghost !px-3" :disabled="reader.data.page <= reader.data.first" @click="readerGo(-1)"><ic name="arrowLeft" class="size-4"></ic>{{ $t('Previous') }}</button>
        <span class="flex-1 text-center text-xs text-muted"><span class="hidden sm:inline"><span class="kbd">←</span> <span class="kbd">→</span></span></span>
        <a v-if="reader.data.pdfUrl" :href="reader.data.pdfUrl" target="_blank" class="btn-soft !py-1.5"><ic name="external" class="size-4"></ic><span class="hidden sm:inline">{{ $t('PDF of this page') }}</span><span class="sm:hidden">PDF</span></a>
        <button class="btn-ghost !px-3" :disabled="reader.data.page >= reader.data.last" @click="readerGo(1)">{{ $t('Next') }}<ic name="arrowRight" class="size-4"></ic></button>
      </footer>
    </aside>
  </transition>
  <div v-if="reader" class="fixed inset-0 z-40 bg-ink/20 backdrop-blur-[2px]" @click="reader=null"></div>

  <!-- Известия -->
  <div class="pointer-events-none fixed bottom-5 right-5 z-50 flex flex-col items-end gap-2">
    <transition-group enter-from-class="opacity-0 translate-y-2" leave-to-class="opacity-0" enter-active-class="transition duration-200" leave-active-class="transition duration-200">
      <div v-for="t in toasts" :key="t.id" class="pointer-events-auto flex max-w-sm items-center gap-3 rounded-2xl bg-ink px-4 py-3 text-sm text-white shadow-lift dark:bg-night-ink dark:text-night">
        <ic :name="t.icon || 'check'" class="size-4 shrink-0"></ic>{{ t.text }}
      </div>
    </transition-group>
  </div>
</div>
</script>

<!-- ============================ НАЧАЛО ============================ -->
<script type="text/x-template" id="tpl-home">
<div class="mx-auto max-w-6xl px-5 py-8 sm:px-8 lg:py-12">
  <section class="animate-rise">
    <p class="eyebrow">{{ today }}</p>
    <h1 class="mt-2 font-serif text-4xl font-semibold tracking-tight sm:text-5xl">{{ greeting }}</h1>
    <p class="mt-3 max-w-2xl text-lg text-muted dark:text-night-muted">
      <template v-if="!stats.pages">{{ $t('This is where your books, articles and notes will live, organized and linked. Start by dropping your first files.') }}</template>
      <template v-else>{{ $t('{0}, {1} and {2}, linked to each other.', [count(stats.byType?.source, $t('source'), $t('sources')), count(stats.byType?.concept, $t('concept'), $t('concepts')), count(stats.byType?.entity, $t('person'), $t('people'))]) }}</template>
    </p>
  </section>

  <!-- Път на файла -->
  <section class="mt-8 grid grid-cols-2 gap-3 sm:grid-cols-4">
    <div v-for="(s,i) in steps" :key="i"
         :class="['relative rounded-3xl border p-4 transition', i===step ? 'border-sage-500 bg-sage-50 shadow-soft dark:border-sage-500 dark:bg-sage-900/30' : 'border-line/80 bg-panel/60 dark:border-night-line dark:bg-night-panel/60', i<step && 'opacity-70']">
      <div class="flex items-center gap-2">
        <span :class="['grid size-6 place-items-center rounded-full text-xs font-semibold', i<step ? 'bg-sage-500 text-white' : i===step ? 'bg-sage-600 text-white' : 'bg-ink/5 text-muted dark:bg-white/10']">
          <ic v-if="i<step" name="check" class="size-3.5"></ic><template v-else>{{ i+1 }}</template>
        </span>
        <span class="text-sm font-semibold">{{ s.title }}</span>
      </div>
      <p class="mt-2 hidden text-xs leading-relaxed text-muted dark:text-night-muted sm:block">{{ s.text }}</p>
    </div>
  </section>

  <!-- Надграждане на старите източници + синтез -->
  <section v-if="stats.depth?.legacy?.length || canSynthesize" class="card mt-6 overflow-hidden">
    <div class="flex flex-col gap-5 p-6 lg:flex-row lg:items-center">
      <div class="min-w-0 flex-1">
        <p class="eyebrow">{{ stats.depth.legacy.length ? $t('Upgrading the library') : $t('Synthesis across sources') }}</p>
        <template v-if="stats.depth.legacy.length">
          <p class="mt-2 font-serif text-2xl font-semibold">{{ $t('{0} {1} the old way', [stats.depth.legacy.length, plural(stats.depth.legacy.length, $t('source is processed'), $t('sources are processed'))]) }}</p>
          <p class="mt-2 max-w-2xl text-sm text-muted dark:text-night-muted">{{ $t('The upgrade re-reads each one chapter by chapter: emphasis, chapters, exact pages for the reader, missed concepts and contradictions with the other books. It starts with the most connected ones. Your notes are kept.') }}</p>
          <div class="mt-4 flex items-center gap-3">
            <div class="h-2 flex-1 overflow-hidden rounded-full bg-ink/5 dark:bg-white/10"><div class="h-full rounded-full bg-sage-500 transition-all" :style="{width: (stats.depth.current/Math.max(1,stats.depth.total)*100)+'%'}"></div></div>
            <span class="shrink-0 text-xs tabular-nums text-muted">{{ $t('{0} of {1} to the current standard', [stats.depth.current, stats.depth.total]) }}</span>
          </div>
          <p class="mt-3 text-xs text-muted dark:text-night-muted">{{ $t('First in line:') }} <a v-for="(l,i) in stats.depth.legacy.slice(0,3)" :key="l.slug" :href="'#/p/'+l.slug" class="hover:underline">{{ l.title }}<template v-if="i < Math.min(2, stats.depth.legacy.length-1)">, </template></a><template v-if="stats.depth.legacy.length>3"> {{ $t('and {0} more', [stats.depth.legacy.length-3]) }}</template></p>
        </template>
        <template v-else>
          <p class="mt-2 font-serif text-2xl font-semibold">{{ $t('All sources are at the current standard') }}</p>
          <p class="mt-2 max-w-2xl text-sm text-muted dark:text-night-muted">{{ $t('The synthesis compares authors on their shared concepts, creates topic hubs, rewrites the overview and shows the gaps. It reads only the pages, not the books, so it is lighter on your limit.') }}</p>
        </template>
        <div v-if="agent?.needsOcr?.length" class="mt-4 rounded-2xl bg-amber-50 p-3 text-sm text-amber-800 dark:bg-amber-500/10 dark:text-amber-300">
          <p class="font-medium">{{ agent.needsOcr.length }} {{ plural(agent.needsOcr.length, $t('source is scanned and has no text'), $t('sources are scanned and have no text')) }}</p>
          <p class="mt-1 text-xs opacity-90">{{ $t('OCR is built in but could not read the text. Run') }} <code>npm install</code> {{ $t('and press “Upgrade” again. Skipped:') }} <a v-for="(o,i) in agent.needsOcr.slice(0,4)" :key="o.slug" :href="'#/p/'+o.slug" class="underline">{{ o.title }}<template v-if="i < Math.min(3, agent.needsOcr.length-1)">, </template></a></p>
        </div>
      </div>
      <div class="flex shrink-0 flex-col gap-2 sm:flex-row lg:flex-col">
        <button v-if="stats.depth.legacy.length" class="btn-primary" :disabled="!agent?.claude || upgrading" @click="upgradeAll">
          <ic :name="upgrading ? 'spinner' : 'sparkle'" :class="['size-4', upgrading && 'animate-spin']"></ic>{{ upgrading ? $t('Upgrade in progress') : $t('Upgrade all (') + stats.depth.legacy.length + ')' }}
        </button>
        <button :class="stats.depth.legacy.length ? 'btn-ghost' : 'btn-primary'" :disabled="!agent?.claude || synthQueued" @click="synthesize" :title="stats.depth.legacy.length ? $t('You can do it now, but it is fuller after the upgrade') : ''">
          <ic name="graph" class="size-4"></ic>{{ synthQueued ? $t('The synthesis is in the queue') : $t('Synthesis across books') }}
        </button>
      </div>
    </div>
  </section>

  <div class="mt-6 grid grid-cols-1 gap-6 lg:grid-cols-5">
    <!-- Качване -->
    <section class="min-w-0 lg:col-span-3">
      <label @dragover.prevent="drag=true" @dragleave.prevent="drag=false" @drop.prevent="onDrop"
             :class="['card group relative flex cursor-pointer flex-col items-center justify-center overflow-hidden border-2 border-dashed px-6 py-12 text-center transition', drag ? 'border-sage-500 bg-sage-50 dark:bg-sage-900/30' : 'hover:border-sage-200 dark:hover:border-sage-700']">
        <input type="file" multiple class="sr-only" @change="onPick">
        <span :class="['grid size-16 place-items-center rounded-3xl bg-sage-50 text-sage-600 transition duration-300 dark:bg-sage-900/40 dark:text-sage-200', drag ? 'scale-110 rotate-3' : 'group-hover:-translate-y-1']">
          <ic name="upload" class="size-7"></ic>
        </span>
        <span class="mt-5 font-serif text-xl font-semibold">{{ $t('Drop files here') }}</span>
        <span class="mt-1 text-sm text-muted dark:text-night-muted">{{ $t('or click to choose · PDF, EPUB, DOCX, XLSX, CSV, MD, images') }}</span>
        <span class="mt-4 flex flex-wrap justify-center gap-1.5">
          <span v-for="f in [$t('Books'),$t('Articles'),$t('Tables'),$t('Notes')]" :key="f" class="chip bg-ink/5 text-ink/60 dark:bg-white/5 dark:text-night-ink/60">{{ f }}</span>
        </span>
      </label>

      <div v-if="uploads.length || stats.inbox?.length" class="card mt-4 p-5">
        <div class="flex flex-wrap items-center justify-between gap-3">
          <div>
            <p class="font-semibold">{{ $t('Inbox') }}</p>
            <p class="text-xs text-muted dark:text-night-muted">
              {{ $t('{0} {1} sorting', [newInbox.length, plural(newInbox.length, $t('file is waiting'), $t('files are waiting'))]) }}<template v-if="dupes"> · {{ dupes }} {{ plural(dupes, $t('duplicate'), $t('duplicates')) }}</template>
            </p>
          </div>
          <button class="btn-primary w-full sm:w-auto" :disabled="sorting || !newInbox.length || uploading" @click="sortInbox">
            <ic :name="sorting ? 'spinner' : 'sparkle'" :class="['size-4', sorting && 'animate-spin']"></ic>
            {{ sorting ? $t('Sorting…') : $t('Sort and extract text') }}
          </button>
        </div>
        <ul class="mt-4 space-y-2">
          <li v-for="u in uploads" :key="u.id" class="flex items-center gap-3 text-sm">
            <span class="grid size-8 place-items-center rounded-xl bg-ink/5 dark:bg-white/5"><ic :name="fileIcon(u.name)" class="size-4 text-muted"></ic></span>
            <span class="min-w-0 flex-1">
              <span class="block truncate">{{ u.name }}</span>
              <span class="mt-1 block h-1 overflow-hidden rounded-full bg-ink/5 dark:bg-white/10">
                <span :class="['block h-full rounded-full transition-all', u.error ? 'bg-clay-500' : 'bg-sage-500']" :style="{width: u.progress+'%'}"></span>
              </span>
            </span>
            <span class="w-16 text-right text-xs tabular-nums text-muted">{{ u.error ? $t('error') : u.progress===100 ? size(u.size) : u.progress+'%' }}</span>
          </li>
          <li v-for="f in inboxOnly" :key="f.name" :class="['flex items-center gap-3 text-sm', f.duplicateOf && 'opacity-70']">
            <span class="grid size-8 place-items-center rounded-xl bg-ink/5 dark:bg-white/5"><ic :name="f.duplicateOf ? 'copy' : fileIcon(f.name)" class="size-4 text-muted"></ic></span>
            <span class="min-w-0 flex-1">
              <span class="block truncate">{{ f.name }}</span>
              <span v-if="f.duplicateOf" class="block text-xs text-clay-500">{{ $t('It is already in the library as {0}. You can delete it from raw/inbox/.', [f.duplicateOf.replace(/^raw\//,'')]) }}</span>
            </span>
            <span v-if="f.duplicateOf" class="chip bg-clay-100 text-clay-500 dark:bg-clay-500/15">{{ $t('duplicate') }}</span>
            <span v-else class="text-xs tabular-nums text-muted">{{ size(f.bytes) }}</span>
            <button class="btn-ghost !p-1.5 text-muted hover:text-clay-500" :title="$t('Remove ') + f.name" :aria-label="$t('Remove ') + f.name" @click="discard({kind:'inbox', name:f.name}, f.name)"><ic name="trash" class="size-4"></ic></button>
          </li>
        </ul>
        <details v-if="sortLog" class="mt-4 rounded-2xl bg-ink/[.03] p-3 text-xs dark:bg-white/5">
          <summary class="cursor-pointer font-medium text-muted">{{ $t('What happened') }}</summary>
          <pre class="scrollbar-thin mt-2 max-h-48 overflow-auto whitespace-pre-wrap font-mono leading-relaxed">{{ sortLog }}</pre>
        </details>
      </div>
    </section>

    <!-- Обработка с Claude -->
    <section class="min-w-0 lg:col-span-2">
      <div class="card relative flex h-full flex-col overflow-hidden p-6">
        <div class="pointer-events-none absolute -right-10 -top-10 size-40 rounded-full bg-clay-400/15 blur-2xl"></div>

        <!-- А. Работи -->
        <template v-if="agent?.current">
          <div class="flex items-center justify-between gap-3">
            <p class="eyebrow flex items-center gap-2"><span class="relative flex size-2"><span class="absolute inline-flex size-full animate-ping rounded-full bg-sage-400 opacity-70"></span><span class="relative inline-flex size-2 rounded-full bg-sage-500"></span></span>{{ $t('{ai} is working') }}</p>
            <span v-if="agent.current.total > 1" class="text-xs tabular-nums text-muted">{{ $t('{0} of {1}', [agent.current.index, agent.current.total]) }}</span>
          </div>
          <p class="mt-2 font-serif text-xl font-semibold leading-snug">{{ agent.current.kind==='ingest' ? $t('“{0}”', [agent.current.label]) : agent.current.label }}</p>
          <div v-if="agent.current.total > 1" class="mt-3 h-1 overflow-hidden rounded-full bg-ink/5 dark:bg-white/10">
            <div class="h-full rounded-full bg-sage-500 transition-all" :style="{width: ((agent.current.index-1)/agent.current.total*100)+'%'}"></div>
          </div>
          <ol class="scrollbar-thin mt-4 max-h-64 flex-1 space-y-2 overflow-y-auto pr-1">
            <li v-for="(s,i) in agent.current.steps.slice(-10)" :key="s.at+i" :class="['flex items-start gap-2.5 text-sm animate-rise', i===agent.current.steps.slice(-10).length-1 ? 'text-ink dark:text-night-ink' : 'text-muted dark:text-night-muted', s.warn && '!text-clay-500']">
              <span :class="['mt-0.5 grid size-5 shrink-0 place-items-center rounded-md', i===agent.current.steps.slice(-10).length-1 ? 'bg-sage-50 text-sage-600 dark:bg-sage-900/50 dark:text-sage-200' : 'bg-ink/5 dark:bg-white/5']"><ic :name="s.icon || 'sparkle'" class="size-3"></ic></span>
              <a v-if="s.page" :href="'#/p/'+s.page" class="min-w-0 hover:underline">{{ s.text }}</a><span v-else class="min-w-0">{{ s.text }}</span>
            </li>
          </ol>
          <div class="mt-4 flex items-center gap-2 border-t border-line pt-4 dark:border-night-line">
            <span class="flex-1 text-xs text-muted dark:text-night-muted">{{ $t('{0} new · {1} updated', [agent.current.created.length, agent.current.updated.length]) }}</span>
            <button class="btn-ghost !py-1.5 text-clay-500" @click="stop"><ic name="stop" class="size-4"></ic>{{ $t('Stop') }}</button>
          </div>
        </template>

        <!-- Б. Лимит -->
        <template v-else-if="agent?.paused?.reason==='limit'">
          <p class="eyebrow">{{ $t('Pause') }}</p>
          <p class="mt-2 font-serif text-2xl font-semibold">{{ AI.subscription ? $t('The subscription limit has been reached') : $t('{ai} has reached its limit') }}</p>
          <p class="mt-2 text-sm text-muted dark:text-night-muted">{{ $t('{0} {1} in the queue. What was started has been rolled back, so there are no half-written pages.', [agent.queue.length, plural(agent.queue.length, $t('task is waiting'), $t('tasks are waiting'))]) }}</p>
          <p v-if="agent.paused.retryAt" class="mt-3 flex items-center gap-2 rounded-2xl bg-sage-50 px-3 py-2 text-sm text-sage-700 dark:bg-sage-900/40 dark:text-sage-200"><ic name="clock" class="size-4 shrink-0"></ic>{{ $t('Next attempt at {0}. Leave the server running.', [clock(agent.paused.retryAt)]) }}</p>
          <div class="mt-5 flex gap-2"><button class="btn-primary" @click="resume"><ic name="play" class="size-4"></ic>{{ $t('Try now') }}</button><button class="btn-ghost" @click="stop">{{ $t('Clear the queue') }}</button></div>
          <label class="mt-4 flex cursor-pointer items-center gap-3 text-sm text-muted dark:text-night-muted">
            <button role="switch" :aria-checked="!!agent.settings.autoResume" @click.prevent="setSetting('autoResume', !agent.settings.autoResume)" :class="['relative h-5 w-9 shrink-0 rounded-full transition', agent.settings.autoResume ? 'bg-sage-500' : 'bg-ink/15 dark:bg-white/15']"><span :class="['absolute top-0.5 size-4 rounded-full bg-white shadow transition-all', agent.settings.autoResume ? 'left-[18px]' : 'left-0.5']"></span></button>
            {{ $t('Retry every 30 minutes') }}
          </label>
        </template>

        <!-- Б2. Моделът не е настроен (ключ, адрес или модел липсва) -->
        <template v-else-if="agent?.paused?.reason==='no-ai' || (agent && AI.ready && !AI.ready.ok)">
          <p class="eyebrow">{{ $t('Processing') }}</p>
          <p class="mt-2 font-serif text-2xl font-semibold">{{ $t('The model is not set up') }}</p>
          <p class="mt-2 text-sm text-muted dark:text-night-muted">{{ $t('Choose the provider and enter the key or the address of {ai} in Settings → Model. The queue waits and continues by itself after saving.') }}</p>
          <a href="#/settings" class="btn-primary mt-5 self-start"><ic name="gear" class="size-4"></ic>{{ $t('Open Settings → Model') }}</a>
        </template>

        <!-- В. Няма Claude Code -->
        <template v-else-if="agent && !agent.claude">
          <p class="eyebrow">{{ $t('Processing') }}</p>
          <p class="mt-2 font-serif text-2xl font-semibold">{{ $t('Claude Code not found') }}</p>
          <p class="mt-2 text-sm text-muted dark:text-night-muted">{{ $t('The button runs Claude Code in the background. Install it, sign in once with') }} <code class="rounded bg-ink/5 px-1 dark:bg-white/10">claude</code> {{ $t('in a terminal and restart') }} <code class="rounded bg-ink/5 px-1 dark:bg-white/10">npm run serve</code>{{ $t('. Until then you can use the commands:') }}</p>
          <div class="mt-4 space-y-2">
            <button v-for="c in commands" :key="c.cmd" @click="copy(c.cmd)" class="group flex w-full items-center gap-3 rounded-2xl border border-line bg-paper/60 px-4 py-3 text-left transition hover:border-sage-200 dark:border-night-line dark:bg-night/40">
              <code class="font-mono text-sm font-semibold text-sage-700 dark:text-sage-200">{{ c.cmd }}</code><span class="flex-1 truncate text-xs text-muted">{{ c.text }}</span><ic name="copy" class="size-4 text-muted opacity-0 group-hover:opacity-100"></ic>
            </button>
          </div>
        </template>

        <!-- Г. Чака подреждане -->
        <template v-else-if="newInbox.length && !stats.pending?.length">
          <p class="eyebrow">{{ $t('Next step') }}</p>
          <p class="mt-2 font-serif text-2xl font-semibold">{{ $t('Sort the inbox') }}</p>
          <p class="mt-2 text-sm text-muted dark:text-night-muted">{{ $t('Press “Sort and extract text”.') }}<template v-if="agent?.settings?.autoIngest"> {{ $t('After that {ai} starts processing on its own.') }}</template></p>
        </template>

        <!-- Д. Чака обработка -->
        <template v-else-if="stats.pending?.length">
          <p class="eyebrow">{{ $t('Next step') }}</p>
          <p class="mt-2 font-serif text-2xl font-semibold">{{ $t('{0} {1} processing', [stats.pending.length, plural(stats.pending.length, $t('file is waiting'), $t('files are waiting'))]) }}</p>
          <p class="mt-2 text-sm text-muted dark:text-night-muted">{{ $t('{ai} will read them one by one, decide the emphasis of each and write the pages. Books are split into chapters.') }}</p>
          <button class="btn-primary mt-5 self-start" @click="start"><ic name="sparkle" class="size-4"></ic>{{ $t('Process with {ai}') }}</button>
          <ul class="mt-5 space-y-1.5 border-t border-line pt-4 dark:border-night-line">
            <li v-for="f in stats.pending.slice(0,5)" :key="f.path" class="flex items-center gap-2 text-sm">
              <ic :name="fileIcon(f.name)" class="size-4 shrink-0 text-muted"></ic><span class="min-w-0 flex-1 truncate">{{ f.name }}</span>
              <span class="chip bg-ink/5 text-[10px] text-muted dark:bg-white/5">{{ folderLabel(f.folder) }}</span>
              <button class="btn-ghost !p-1.5 text-muted hover:text-clay-500" :title="$t('Remove ') + f.name + $t(' of the processing')" :aria-label="$t('Remove ') + f.name" @click="discard({kind:'pending', path:f.path}, f.name)"><ic name="trash" class="size-4"></ic></button>
            </li>
            <li v-if="stats.pending.length>5" class="text-xs text-muted">{{ $t('and {0} more', [stats.pending.length-5]) }}</li>
          </ul>
        </template>

        <!-- Е. Отчет от последната обработка -->
        <template v-else-if="lastJob && !lastJob.undone && isRecent(lastJob)">
          <p class="eyebrow">{{ {done:$t('Done'),cancelled:$t('Stopped'),'needs-ocr':$t('OCR needed'),limited:$t('Limit')}[lastJob.status] || $t('Processing failed') }} · {{ relDate(lastJob.finishedAt) }}</p>
          <p class="mt-2 font-serif text-xl font-semibold leading-snug">{{ lastJob.kind==='ingest' ? $t('“{0}”', [lastJob.label]) : lastJob.label }}</p>
          <span v-if="lastJob.mode" class="chip mt-2 self-start bg-ink/5 text-[11px] text-muted dark:bg-white/5">{{ $t('mode: {0}', [(MODES.find(m => m.id===lastJob.mode) || {}).label || lastJob.mode]) }}</span>
          <p v-if="lastJob.report" :class="['mt-2 whitespace-pre-line text-sm', lastJob.status==='done' ? 'text-muted dark:text-night-muted' : 'text-clay-500']">{{ lastJob.report }}</p>
          <div v-if="lastJob.created.length" class="mt-4">
            <p class="text-xs font-semibold text-muted">{{ $t('New pages') }}</p>
            <div class="mt-2 flex flex-wrap gap-1.5">
              <a v-for="c in lastJob.created.slice(0,12)" :key="c.slug" :href="'#/p/'+c.slug" class="chip bg-sage-50 text-sage-700 hover:bg-sage-100 dark:bg-sage-900/40 dark:text-sage-200">{{ c.title }}</a>
              <span v-if="lastJob.created.length>12" class="chip text-muted">+{{ lastJob.created.length-12 }}</span>
            </div>
          </div>
          <div v-if="lastJob.updated.length" class="mt-3">
            <p class="text-xs font-semibold text-muted">{{ $t('Updated') }}</p>
            <div class="mt-2 flex flex-wrap gap-1.5">
              <a v-for="c in lastJob.updated.slice(0,8)" :key="c.slug" :href="'#/p/'+c.slug" class="chip bg-ink/5 text-ink/70 hover:bg-ink/10 dark:bg-white/5 dark:text-night-ink/70">{{ c.title }}</a>
            </div>
          </div>
          <div class="mt-auto flex items-center gap-2 pt-5">
            <button v-if="agent?.canUndo" class="btn-ghost !py-1.5" @click="undo(lastJob.id)" :title="$t('Restores the wiki to how it was before this processing')"><ic name="undo" class="size-4"></ic>{{ $t('Undo') }}</button>
            <span class="flex-1"></span>
            <a v-if="lastJob.created[0]" :href="'#/p/'+lastJob.created[0].slug" class="btn-soft !py-1.5">{{ $t('Browse') }}<ic name="arrowRight" class="size-4"></ic></a>
          </div>
        </template>

        <!-- Ж. Всичко е готово -->
        <template v-else>
          <p class="eyebrow">{{ $t('Next step') }}</p>
          <p class="mt-2 font-serif text-2xl font-semibold">{{ stats.pages ? $t('Everything is processed') : $t('Ready for the first file') }}</p>
          <p class="mt-2 text-sm text-muted dark:text-night-muted">{{ stats.pages ? $t('Search with Ctrl K, browse chapters or the link map.') : $t('Drop files on the left.') + (agent?.settings?.autoIngest ? $t(' After sorting, {ai} processes them on its own.') : '') }}</p>
        </template>

        <!-- Режим: кой модел чете -->
        <div v-if="agent?.claude" class="mt-5 border-t border-line pt-4 dark:border-night-line">
          <!-- Кой модел работи: доставчикът и начинът (агент, без инструменти, ръчно) -->
          <a href="#/settings" class="mb-3 flex items-center gap-2 rounded-2xl bg-ink/[.04] px-3 py-2 text-xs hover:bg-ink/[.07] dark:bg-white/5" :title="$t('Change the model in Settings → Model')">
            <ic name="sparkle" class="size-3.5 shrink-0 text-sage-600"></ic>
            <span class="min-w-0 flex-1 truncate"><b>{{ AI.name }}</b> · {{ AI.engine === 'agent' ? $t('agent with tools') : AI.engine === 'manual' ? $t('copy and paste') : $t('without tools') }}<template v-if="AI.local"> · {{ $t('on this computer') }}</template><template v-else-if="AI.free && AI.engine !== 'manual'"> · {{ $t('free tier') }}</template></span>
            <ic name="chevron" class="size-3.5 shrink-0 text-muted"></ic>
          </a>
          <p v-if="AI.engine === 'manual'" class="text-xs text-muted dark:text-night-muted">{{ $t('Copy and paste: every step of the processing is a request that you copy into the chat of {ai} and whose answer you paste back. A window opens by itself when a request is waiting.') }}</p>
          <template v-else>
          <div class="flex items-center justify-between gap-3">
            <span class="text-sm font-medium">{{ $t('Mode') }}</span>
            <div class="flex rounded-full bg-ink/5 p-0.5 text-xs dark:bg-white/5">
              <button v-for="m in MODES" :key="m.id" @click="pickMode(m.id)" :title="m.hint"
                      :class="['rounded-full px-3 py-1 font-medium transition', agent.settings.mode===m.id ? 'bg-panel text-ink shadow-soft dark:bg-night-panel dark:text-night-ink' : 'text-muted hover:text-ink dark:hover:text-night-ink']">{{ m.label }}</button>
            </div>
          </div>
          <p class="mt-2 text-xs text-muted dark:text-night-muted">{{ (MODES.find(m => m.id===agent.settings.mode) || MODES[0]).hint }}</p>
          </template>
          <div v-if="AI.engine !== 'manual'" class="mt-3 grid grid-cols-2 gap-3 text-xs">
            <label class="block"><span class="mb-1 block font-medium">{{ $t('Reads chapters') }}</span>
              <select :value="readerNow" @change="setSetting('reader', $event.target.value)" class="w-full rounded-full border border-line bg-panel px-3 py-1.5 outline-none dark:border-night-line dark:bg-night-panel">
                <option v-for="m in MODEL_OPTS" :key="m.id" :value="m.id">{{ m.label }}</option>
              </select></label>
            <label class="block"><span class="mb-1 block font-medium">{{ $t('Writes the pages') }}</span>
              <select :value="writerNow" @change="setSetting('writer', $event.target.value)" class="w-full rounded-full border border-line bg-panel px-3 py-1.5 outline-none dark:border-night-line dark:bg-night-panel">
                <option v-for="m in MODEL_OPTS" :key="m.id" :value="m.id">{{ m.label }}</option>
              </select></label>
          </div>
          <label class="mt-3 flex cursor-pointer items-center gap-2 text-xs text-muted dark:text-night-muted">
            <input type="checkbox" class="accent-sage-600" :checked="agent.settings.confirmCost !== false" @change="setSetting('confirmCost', $event.target.checked)"> {{ $t('Show tokens and cost and ask before every action with {ai}') }}
          </label>
          <label class="mt-3 block text-xs"><span class="mb-1 block font-medium">{{ $t('Indexing language') }}</span>
            <select :value="agent.settings.lang || 'both'" @change="setSetting('lang', $event.target.value)" class="w-full rounded-full border border-line bg-panel px-3 py-1.5 outline-none dark:border-night-line dark:bg-night-panel">
              <option value="bg">{{ $t('Library language only') }}</option>
              <option value="both">{{ $t('Library language + original terms in the index') }}</option>
              <option value="original">{{ $t('Pages in the language of the source') }}</option>
            </select></label>
          <p class="mt-1 text-[11px] text-muted dark:text-night-muted">{{ $t('Applies to new sources and to upgrading old ones. Sources already processed to the current standard are not touched.') }}</p>
          <p v-if="AI.engine === 'agent'" class="mt-1.5 text-[11px] text-muted dark:text-night-muted">{{ $t('The choice of models applies to new sources and to upgrades. If they differ, chapters are read by a separate subagent; if they are the same, the same model reads them.') }}</p>
          <p v-else-if="AI.engine === 'api'" class="mt-1.5 text-[11px] text-muted dark:text-night-muted">{{ $t('Without tools the server gives the model the text chapter by chapter: the model for reading makes the notes, the model for writing writes the pages from them.') }}</p>
          <label v-if="AI.engine !== 'manual'" class="mt-2 flex cursor-pointer items-center gap-2 text-xs text-muted dark:text-night-muted">
            <input type="checkbox" class="accent-sage-600" :checked="agent.settings.synthesisBest" @change="setSetting('synthesisBest', $event.target.checked)"> {{ $t('Always run the synthesis with the strongest model ({0})', [TN.strong]) }}
          </label>
        </div>

        <!-- Настройка и история -->
        <div v-if="agent?.claude" class="mt-4 flex items-center gap-3 text-sm">
          <button role="switch" :aria-checked="!!agent.settings.autoIngest" @click="setSetting('autoIngest', !agent.settings.autoIngest)"
                  :class="['relative h-5 w-9 shrink-0 rounded-full transition', agent.settings.autoIngest ? 'bg-sage-500' : 'bg-ink/15 dark:bg-white/15']">
            <span :class="['absolute top-0.5 size-4 rounded-full bg-white shadow transition-all', agent.settings.autoIngest ? 'left-[18px]' : 'left-0.5']"></span>
          </button>
          <span class="flex-1 text-muted dark:text-night-muted">{{ $t('Process automatically after sorting') }}</span>
          <button v-if="agent.history.length" class="text-xs font-medium text-sage-700 hover:underline dark:text-sage-200" @click="showHistory=!showHistory">{{ $t('History') }}</button>
        </div>
        <ul v-if="showHistory && agent?.history.length" class="mt-3 space-y-1.5 text-xs">
          <li v-for="h in agent.history.slice(0,8)" :key="h.id" class="flex items-center gap-2">
            <span :class="['size-1.5 shrink-0 rounded-full', {done:'bg-sage-500',error:'bg-clay-500',cancelled:'bg-muted',limited:'bg-amber-400','needs-ocr':'bg-amber-400'}[h.status]]"></span>
            <span :class="['min-w-0 flex-1 truncate', h.undone && 'line-through opacity-60']">{{ h.label }}</span>
            <span v-if="h.mode" class="text-muted">{{ (MODES.find(m => m.id===h.mode) || {}).label }}</span>
            <span class="text-muted">{{ relDate(h.finishedAt) }}</span>
          </li>
        </ul>
      </div>
    </section>
  </div>

  <!-- Числа -->
  <section v-if="stats.pages" class="mt-6 grid grid-cols-2 gap-3 sm:grid-cols-3 lg:grid-cols-6">
    <a v-for="t in typeOrder" :key="t" :href="'#/c/'+t" class="card card-hover p-4">
      <span :class="['grid size-9 place-items-center rounded-xl', TYPES[t].soft]"><ic :name="TYPES[t].icon" class="size-4"></ic></span>
      <p class="mt-3 font-serif text-3xl font-semibold tabular-nums">{{ stats.byType?.[t] || 0 }}</p>
      <p class="text-xs text-muted dark:text-night-muted">{{ TYPES[t].plural }}</p>
    </a>
  </section>

  <div v-if="stats.pages" class="mt-6 grid grid-cols-1 gap-6 lg:grid-cols-3">
    <section class="card min-w-0 p-6 lg:col-span-2">
      <div class="flex items-center justify-between">
        <p class="font-semibold">{{ $t('Recently updated') }}</p>
        <a href="#/p/index" class="text-xs font-medium text-sage-700 hover:underline dark:text-sage-200">{{ $t('The whole index →') }}</a>
      </div>
      <div class="mt-4 grid grid-cols-1 gap-3 sm:grid-cols-2">
        <page-card v-for="p in stats.recent" :key="p.slug" :p="p"></page-card>
      </div>
    </section>

    <div class="space-y-6">
      <section class="card p-6">
        <div class="flex items-center justify-between gap-3">
          <p class="font-semibold">{{ $t('Latest activity') }}</p>
          <a href="#/log" class="text-xs font-medium text-sage-700 hover:underline dark:text-sage-200">{{ $t('The whole log →') }}</a>
        </div>
        <ol class="relative mt-4 space-y-4 border-l border-line pl-5 dark:border-night-line">
          <li v-for="e in stats.log" :key="e.date+e.title" class="relative">
            <span :class="['absolute -left-[25px] top-1 size-2.5 rounded-full ring-4 ring-panel dark:ring-night-panel', logColor(e.kind)]"></span>
            <p class="text-xs text-muted dark:text-night-muted">{{ relDate(e.date) }} · {{ logLabel(e.kind) }}</p>
            <p class="text-sm leading-snug">{{ e.title }}</p>
          </li>
        </ol>
      </section>

      <section v-if="stats.lowConfidence?.length" class="card p-6">
        <p class="font-semibold">{{ $t('Where knowledge is thin') }}</p>
        <p class="mt-1 text-xs text-muted dark:text-night-muted">{{ $t('Pages with low confidence: good candidates for more reading.') }}</p>
        <ul class="mt-3 space-y-1">
          <li v-for="p in stats.lowConfidence" :key="p.slug">
            <a :href="'#/p/'+p.slug" class="flex items-center gap-2 rounded-xl px-2 py-1.5 text-sm transition hover:bg-ink/5 dark:hover:bg-white/5">
              <span class="size-1.5 rounded-full bg-clay-400"></span>{{ p.title }}
            </a>
          </li>
        </ul>
      </section>
    </div>
  </div>
</div>
</script>

<!-- ============================ СТРАНИЦА ============================ -->
<script type="text/x-template" id="tpl-page">
<div v-if="error" class="mx-auto max-w-2xl px-6 py-24 text-center">
  <span class="mx-auto grid size-16 place-items-center rounded-3xl bg-clay-100 text-clay-500 dark:bg-clay-500/15"><ic name="ghost" class="size-7"></ic></span>
  <h1 class="mt-6 font-serif text-3xl font-semibold">{{ $t('This page does not exist yet') }}</h1>
  <p class="mt-3 text-muted dark:text-night-muted">{{ $t('A page links to') }} <code class="rounded bg-ink/5 px-1.5 dark:bg-white/10">[[{{ slug }}]]</code>{{ $t(', but it has not been written yet. {ai} will create it when it processes a source on the topic, or you can ask it explicitly.') }}</p>
  <button class="btn-soft mt-6" @click="$root.copy($t('Create the page [[') + slug + $t(']] from the available sources'))"><ic name="copy" class="size-4"></ic>{{ $t('Copy a request for {ai}') }}</button>
</div>

<div v-else-if="page" :class="['mx-auto flex gap-10 px-5 py-8 sm:px-8 lg:py-12', focus ? 'max-w-3xl' : 'max-w-6xl']">
  <article class="min-w-0 flex-1 animate-rise" :key="page.slug">
    <nav class="flex items-center gap-2 text-sm text-muted dark:text-night-muted">
      <template v-if="page.type==='chapter' && page.nav?.book">
        <a href="#/c/source" class="flex items-center gap-1.5 hover:text-ink dark:hover:text-night-ink">
          <span :class="['grid size-5 place-items-center rounded-md', TYPES.source.soft]"><ic name="book" class="size-3"></ic></span>{{ $t('Sources') }}
        </a>
        <ic name="chevron" class="size-3.5 shrink-0"></ic>
        <a :href="'#/p/'+page.nav.book.slug" class="truncate hover:text-ink dark:hover:text-night-ink">{{ page.nav.book.title }}</a>
      </template>
      <a v-else :href="'#/c/'+page.type" class="flex items-center gap-1.5 hover:text-ink dark:hover:text-night-ink">
        <span :class="['grid size-5 place-items-center rounded-md', T.soft]"><ic :name="T.icon" class="size-3"></ic></span>{{ T.plural }}
      </a>
      <ic name="chevron" class="size-3.5 shrink-0"></ic>
      <span class="truncate">{{ page.type==='chapter' ? $t('Chapter ') + (page.chapter ?? '') : page.title }}</span>
      <button v-if="canFocus" type="button" class="btn-ghost ml-auto shrink-0 !py-1 text-xs" :aria-pressed="focus ? 'true' : 'false'" :title="focus ? $t('Show the sidebars again (Esc)') : $t('Show only the text, without the sidebars')" @click="$emit('focus', !focus)"><ic name="focus" class="size-4"></ic>{{ focus ? $t('Exit focus') : $t('Focus') }}</button>
    </nav>

    <h1 v-if="!rename.on" :class="['mt-5 font-serif text-4xl font-semibold leading-[1.15] tracking-tight sm:text-[2.75rem]', canAsk && 'cursor-text']" :title="canAsk ? $t('Double-click to change the title') : null" @dblclick="startRename">{{ page.title }}</h1>
    <form v-else class="mt-5" @submit.prevent="saveRename">
      <div class="flex flex-wrap items-center gap-2">
        <input ref="renameInput" v-model="rename.value" maxlength="200" :aria-label="$t('Title')" @keydown.esc.prevent="rename.on=false"
               class="min-w-0 flex-1 rounded-2xl border border-sage-400 bg-panel px-4 py-2 font-serif text-2xl font-semibold outline-none dark:bg-night-panel sm:text-3xl">
        <button class="btn-primary" :disabled="rename.busy || !rename.value.trim()"><ic name="check" class="size-4"></ic>{{ $t('Save') }}</button>
        <button type="button" class="btn-ghost" @click="rename.on=false">{{ $t('Cancel editing') }}</button>
      </div>
      <p class="mt-2 text-xs text-muted dark:text-night-muted">{{ $t('Only the title changes. The file name and the links between pages stay the same. Enter saves, Esc cancels.') }}</p>
    </form>
    <p v-if="page.aliases && page.aliases.length" class="mt-2 text-sm text-muted dark:text-night-muted">{{ $t('Also known as: {0}', [page.aliases.join(', ')]) }}</p>

    <div class="mt-5 flex flex-wrap items-center gap-2">
      <span :class="['chip', T.soft]"><ic :name="T.icon" class="size-3"></ic>{{ page.kind ? (KINDS[page.kind] || page.kind) : T.label }}</span>
      <a v-if="page.area" :href="ro ? null : '#/areas'" class="chip bg-ink/5 text-ink/80 hover:bg-ink/10 dark:bg-white/5 dark:text-night-ink/80" :title="{own:$t('The area is set for this page'), book:$t('The area belongs to the book the chapter is part of'), cited:$t('The area with the most citations to sources'), linked:$t('Area by related pages')}[page.areaHow] + $t('. Click to manage areas.')"><ic name="grid" class="size-3"></ic>{{ page.area }}</a>
      <span v-if="page.confidence" :class="['chip cursor-help', CONF[page.confidence]?.cls]" :title="CONF[page.confidence]?.hint">
        <span :class="['size-1.5 rounded-full', CONF[page.confidence]?.dot]"></span>{{ $t('confidence: {0}', [CONF[page.confidence]?.label || page.confidence]) }}
      </span>
      <span v-if="page.updated" class="chip text-muted dark:text-night-muted"><ic name="clock" class="size-3"></ic>{{ relDate(page.updated) }}</span>
      <a v-for="t in page.tags" :key="t" :href="'#/tag/'+encodeURIComponent(t)" class="chip border border-line text-ink/70 hover:border-sage-200 dark:border-night-line dark:text-night-ink/70">#{{ t }}</a>
      <!-- ръчните списъци: страницата влиза или излиза; нов списък започва с нея -->
      <span v-if="canAsk" class="relative">
        <button type="button" :class="['chip border transition', inLists ? 'border-teal-400 bg-teal-50 text-teal-700 dark:bg-teal-500/15 dark:text-teal-300' : 'border-dashed border-line text-muted hover:border-sage-300 hover:text-ink dark:border-night-line dark:text-night-muted']"
                :aria-expanded="listMenu" :title="$t('Add the page to a list of yours')" @click="listMenu=!listMenu">
          <ic name="bookmark" class="size-3"></ic>{{ inLists ? $t('In {0} {1}', [inLists, plural(inLists, $t('list'), $t('lists'))]) : $t('List') }}
        </button>
        <div v-if="listMenu" class="card absolute left-0 top-full z-30 mt-2 w-64 p-2 !shadow-lift" @keydown.esc="listMenu=false">
          <p v-if="!myLists.length" class="px-2 py-1.5 text-xs text-muted dark:text-night-muted">{{ $t('You have no lists yet.') }}</p>
          <label v-for="c in myLists" :key="c.id" class="flex cursor-pointer items-center gap-2 rounded-xl px-2 py-1.5 text-sm hover:bg-ink/5 dark:hover:bg-white/5">
            <input type="checkbox" class="accent-teal-600" :checked="c.has" @change="toggleList(c)"><span class="min-w-0 flex-1 truncate">{{ c.name }}</span>
          </label>
          <button type="button" class="mt-1 flex w-full items-center gap-2 rounded-xl px-2 py-1.5 text-left text-sm text-sage-700 hover:bg-sage-50 dark:text-sage-200 dark:hover:bg-sage-900/40" @click="newListWithPage"><ic name="plus" class="size-4"></ic>{{ $t('New list with this page') }}</button>
        </div>
      </span>
    </div>

    <!-- Глава: навигация в книгата -->
    <div v-if="page.type==='chapter'" class="card mt-8 overflow-hidden">
      <div class="flex flex-wrap items-center gap-3 px-4 py-3">
        <span class="grid size-9 shrink-0 place-items-center rounded-xl bg-clay-100 font-serif font-semibold text-clay-500 dark:bg-clay-500/15 dark:text-clay-400">{{ page.chapter }}</span>
        <span class="flex-1 text-sm text-muted dark:text-night-muted">{{ $t('Chapter {0} of {1}', [page.chapter, page.nav?.count]) }}<template v-if="page.pages"> {{ $t('· p. {0}', [page.pages]) }}</template></span>
        <button v-if="page.readerSrc" class="btn-primary !py-1.5" @click="$root.openReader(page.readerSrc, firstPage)"><ic name="book" class="size-4"></ic>{{ $t('Read the chapter') }}</button>
      </div>
      <div class="grid grid-cols-2 border-t border-line text-sm dark:border-night-line">
        <a v-if="page.nav?.prev" :href="'#/p/'+page.nav.prev.slug" class="flex min-w-0 items-center gap-2 px-4 py-2.5 text-muted transition hover:bg-ink/[.03] hover:text-ink dark:text-night-muted dark:hover:bg-white/5 dark:hover:text-night-ink">

        <p class="eyebrow">{{ $t('Proposed change') }}</p>
        <p v-if="ai.proposal.summary" class="mt-2 text-sm">{{ ai.proposal.summary }}</p>
        <div v-for="(e,i) in ai.proposal.edits" :key="i" class="mt-3 space-y-1.5 text-sm">
          <div class="rounded-xl bg-clay-100/60 p-2.5 dark:bg-clay-500/10"><p class="text-[11px] font-semibold uppercase tracking-wide text-clay-500">{{ $t('Before') }}</p><p class="mt-1 whitespace-pre-wrap break-words font-serif text-[13.5px] line-through decoration-clay-400/60">{{ e.before }}</p></div>
          <div class="rounded-xl bg-sage-50 p-2.5 dark:bg-sage-900/30"><p class="text-[11px] font-semibold uppercase tracking-wide text-sage-700 dark:text-sage-200">{{ $t('After') }}</p><p class="mt-1 whitespace-pre-wrap break-words font-serif text-[13.5px]">{{ e.after }}</p></div>
        </div>
        <div v-if="ai.proposal.append" class="mt-3 rounded-xl bg-sage-50 p-2.5 text-sm dark:bg-sage-900/30"><p class="text-[11px] font-semibold uppercase tracking-wide text-sage-700 dark:text-sage-200">{{ $t('New section: {0}', [ai.proposal.append.heading]) }}</p><p class="mt-1 whitespace-pre-wrap break-words font-serif text-[13.5px]">{{ ai.proposal.append.text }}</p></div>
        <div v-if="ai.proposal.meta.aliases.length || ai.proposal.meta.tags.length || ai.proposal.meta.related.length || ai.proposal.meta.indexLine" class="mt-3 space-y-1 text-xs text-muted dark:text-night-muted">
          <p class="font-semibold text-ink/70 dark:text-night-ink/70">{{ $t('For easier finding') }}</p>
          <p v-if="ai.proposal.meta.aliases.length">{{ $t('Aliases: {0}', [ai.proposal.meta.aliases.join(', ')]) }}</p>
          <p v-if="ai.proposal.meta.tags.length">{{ $t('Tags: {0}', [ai.proposal.meta.tags.map((t) => '#' + t).join(' ')]) }}</p>
          <p v-if="ai.proposal.meta.related.length">{{ $t('Links to: {0}', [ai.proposal.meta.related.join(', ')]) }}</p>
          <p v-if="ai.proposal.meta.indexLine">{{ $t('Description in the index: {0}', [ai.proposal.meta.indexLine]) }}</p>
        </div>
        <p v-if="ai.proposal.lostCount" class="mt-2 rounded-xl bg-amber-50 p-2 text-xs text-amber-800 dark:bg-amber-500/10 dark:text-amber-200">{{ $t('The new text is missing {0} {1} to other pages: {2}{3}. If you need them, cancel and ask {ai} to keep them.', [ai.proposal.lostCount, plural(ai.proposal.lostCount, $t('link'), $t('links')), ai.proposal.lostLinks.join(', '), ai.proposal.lostCount > ai.proposal.lostLinks.length ? '…' : '']) }}</p>
        <p v-if="ai.proposal.skipped || ai.proposal.linkFixes" class="mt-2 text-xs text-amber-700 dark:text-amber-300">
          <template v-if="ai.proposal.skipped">{{ $t('{0} {1} with the text and {2}.', [ai.proposal.skipped, plural(ai.proposal.skipped, $t('suggested fix did not match'), $t('suggested fixes did not match')), plural(ai.proposal.skipped, $t('was skipped'), $t('were skipped'))]) }} </template>
          <template v-if="ai.proposal.linkFixes">{{ $t('{0} {1} into plain text.', [ai.proposal.linkFixes, plural(ai.proposal.linkFixes, $t('link to a non-existent page was turned'), $t('links to non-existent pages were turned'))]) }}</template>
        </p>
        <div class="mt-4 flex flex-wrap gap-2">
          <button class="btn-primary !py-1.5 text-sm" :disabled="ai.busy2" @click="applyAi"><ic name="check" class="size-4"></ic>{{ $t('Apply') }}</button>
          <button class="btn-ghost !py-1.5 text-sm" @click="ai.proposal=null">{{ $t('Reject') }}</button>
        </div>
      </section>

      <section v-if="ai.applied" class="rounded-2xl bg-sage-50 p-3 text-sm dark:bg-sage-900/30">
        <p class="flex items-center gap-2 font-medium text-sage-700 dark:text-sage-200"><ic name="check" class="size-4"></ic>{{ $t('The page has been improved') }}</p>
        <p class="mt-1 text-xs text-muted dark:text-night-muted">{{ ai.applied.bits.join('; ') }}.</p>
        <button v-if="ai.applied.undoId" class="btn-soft mt-3 !py-1 text-sm" @click="undoAi"><ic name="undo" class="size-4"></ic>{{ $t('Undo') }}</button>
      </section>
    </div>
    <footer class="border-t border-line px-4 py-2 text-[11px] leading-snug text-muted dark:border-night-line dark:text-night-muted">{{ $t('{ai} reads the page and the original text of the source ({0}). Nothing changes without your confirmation; “Undo” reverts the last change.', [dataNote()]) }}</footer>
  </aside>

  <!-- Дясна колона -->
  <aside v-if="!focus" class="hidden w-64 shrink-0 xl:block">
    <div class="sticky top-10 space-y-8">
      <div v-if="toc.length > 1">
        <p class="eyebrow">{{ $t('On this page') }}</p>
        <ul class="mt-3 space-y-1 border-l border-line text-sm dark:border-night-line">
          <li v-for="h in toc" :key="h.id">
            <a :href="'#/p/'+page.slug" @click.prevent="scrollTo(h.id)"
               :class="['-ml-px block border-l-2 py-1 transition', h.level===3 ? 'pl-6 text-xs' : 'pl-3.5', activeH===h.id ? 'border-sage-500 font-medium text-ink dark:text-night-ink' : 'border-transparent text-muted hover:text-ink dark:text-night-muted dark:hover:text-night-ink']">{{ h.text }}</a>
          </li>
        </ul>
      </div>
      <div v-if="page.backlinks.length">
        <p class="eyebrow">{{ $t('Linking here · {0}', [page.backlinks.length]) }}</p>
        <div v-for="g in bookGroups" :key="g.book" class="mt-3 rounded-2xl bg-clay-100/40 p-2.5 dark:bg-clay-500/5">
          <a :href="'#/p/'+g.book" class="flex items-center gap-2 px-1 text-sm font-medium hover:underline"><ic name="book" class="size-3.5 shrink-0 text-clay-500"></ic><span class="truncate">{{ g.title }}</span></a>
          <div class="mt-2 flex flex-wrap gap-1.5">
            <a v-for="c in g.items" :key="c.slug" :href="'#/p/'+c.slug" :title="c.title" class="chip bg-panel text-ink/80 shadow-soft hover:text-sage-700 dark:bg-night-panel dark:text-night-ink/80">{{ $t('Ch. {0}', [c.chapter]) }}</a>
          </div>
        </div>
        <ul class="mt-3 space-y-1">
          <li v-for="b in otherBacklinks" :key="b.slug">
            <a :href="'#/p/'+b.slug" class="flex items-center gap-2 rounded-xl px-2 py-1.5 text-sm transition hover:bg-ink/5 dark:hover:bg-white/5">
              <span :class="['grid size-5 shrink-0 place-items-center rounded-md', (TYPES[b.type]||TYPES.other).soft]"><ic :name="(TYPES[b.type]||TYPES.other).icon" class="size-3"></ic></span>
              <span class="truncate">{{ b.title }}</span>
            </a>
          </li>
        </ul>
      </div>
      <div v-if="page.outgoing.length">
        <p class="eyebrow">{{ $t('Linked to · {0}', [page.outgoing.length]) }}</p>
        <div class="mt-3 flex flex-wrap gap-1.5">
          <a v-for="o in page.outgoing" :key="o.slug" :href="'#/p/'+o.slug" :class="['chip transition hover:opacity-80', (TYPES[o.type]||TYPES.other).soft]">{{ o.title }}</a>
        </div>
      </div>
    </div>
  </aside>
</div>

<div v-else class="mx-auto max-w-3xl px-8 py-16">
  <div class="h-4 w-32 animate-pulse rounded-full bg-ink/5 dark:bg-white/10"></div>
  <div class="mt-6 h-10 w-3/4 animate-pulse rounded-2xl bg-ink/5 dark:bg-white/10"></div>
  <div class="mt-10 space-y-3"><div v-for="i in 6" :key="i" class="h-4 animate-pulse rounded-full bg-ink/5 dark:bg-white/10" :style="{width: (90 - i*7)+'%'}"></div></div>
</div>
</script>

<!-- ============================ АРХИВ: НАЧАЛО (само за четене) ============================ -->
<!-- ============================ РЕЗЕРВНИ КОПИЯ И СИНХРОНИЗАЦИЯ ============================ -->
<script type="text/x-template" id="tpl-sync-modal">
<div class="fixed inset-0 z-[58] flex items-center justify-center bg-ink/30 p-4 backdrop-blur-sm" @keydown.esc="close" @mousedown.self="close">
  <div class="card flex max-h-[92vh] w-full max-w-3xl animate-rise flex-col !shadow-lift" role="dialog" aria-modal="true" aria-labelledby="sync-title">
    <div class="scrollbar-thin overflow-y-auto p-6">
      <p class="eyebrow">{{ $t('Copy to another folder') }}</p>
      <h2 id="sync-title" class="mt-1 font-serif text-2xl font-semibold">{{ target ? target.name : $t('Choose a copy') }}</h2>
      <p v-if="target" class="mt-1 break-all text-xs text-muted dark:text-night-muted">{{ target.path }}</p>

      <!-- избор -->
      <template v-if="stage==='pick'">
        <p v-if="!targets.length" class="mt-4 text-sm text-muted dark:text-night-muted">{{ $t('There are no copies yet. Add one in Settings.') }}</p>
        <ul class="mt-4 space-y-2">
          <li v-for="t in targets" :key="t.id">
            <button class="card card-hover flex w-full items-center gap-3 !rounded-2xl px-4 py-3 text-left" :disabled="!t.online" @click="start(t.id)">
              <ic name="refresh" class="size-4 shrink-0 text-sage-600"></ic>
              <span class="min-w-0 flex-1"><span class="block truncate font-medium">{{ t.name }}</span><span class="block truncate text-xs text-muted dark:text-night-muted">{{ t.online ? (t.last ? $t('Last: {0}', [ago(t.last.at)]) : $t('Never copied')) : $t('Not available: {0}', [t.error]) }}</span></span>
              <span class="chip bg-ink/5 dark:bg-white/10">{{ modeLabel(t.mode) }}</span>
            </button>
          </li>
        </ul>
      </template>

      <!-- чака -->
      <div v-else-if="stage==='loading' || stage==='running'" class="py-10 text-center">
        <span class="mx-auto grid size-14 place-items-center rounded-3xl bg-sage-50 text-sage-600 dark:bg-sage-900/40 dark:text-sage-200"><ic name="spinner" class="size-6 animate-spin"></ic></span>
        <p class="mt-4 text-sm">{{ stage==='loading' ? $t('Comparing with the folder…') : $t('Copying…') }}</p>
        <p v-if="progress && progress.total" class="mt-1 text-xs text-muted dark:text-night-muted">{{ progress.done }} / {{ progress.total }}</p>
      </div>

      <!-- резултат от сравнението -->
      <template v-else-if="stage==='plan' && plan">
        <div v-if="plan.needsAnswer" class="mt-4 rounded-2xl border border-amber-300 bg-amber-50 p-4 text-sm dark:border-amber-500/40 dark:bg-amber-500/10">
          <p class="font-medium">{{ $t('There are changes by others in this folder') }}</p>
          <p class="mt-1">{{ $t('New or changed: {0}. In conflict with yours: {1}.', [plan.counts.incoming, plan.counts.conflicts]) }}</p>
        </div>
        <p class="mt-4 text-sm">{{ plan.target.mode==='pull' ? $t('You only take from this folder; nothing is written in it.') : $t('Yours to send: {0} files. Already the same: {1}.', [plan.counts.push, plan.counts.same]) }}</p>
        <div v-if="plan.target.mode!=='pull' && plan.counts.push" class="mt-3">
          <ul class="space-y-1.5">
            <li v-for="g in pushCats()" :key="g.c" class="rounded-xl border border-line px-3 py-2 text-sm dark:border-night-line">
              <div class="flex flex-wrap items-baseline gap-x-2"><span class="font-medium">{{ g.label }}</span><span class="text-xs text-muted dark:text-night-muted">{{ $t('{0} files, {1}', [g.n, size(g.bytes)]) }}<template v-if="g.new"> · {{ $t('new: {0}', [g.new]) }}</template><template v-if="g.changed"> · {{ $t('changed: {0}', [g.changed]) }}</template></span></div>
              <p class="text-xs text-muted dark:text-night-muted">{{ g.hint }}</p>
            </li>
          </ul>
          <button class="mt-2 text-xs underline" @click="showFiles=!showFiles">{{ showFiles ? $t('Hide the files') : $t('Show the files') }}</button>
          <ul v-if="showFiles" class="scrollbar-thin mt-2 max-h-56 overflow-y-auto rounded-xl bg-ink/5 p-2 text-xs dark:bg-white/5">
            <li v-for="f in plan.pushInfo" :key="f.rel" class="flex gap-2 py-0.5"><span class="w-16 shrink-0 text-muted dark:text-night-muted">{{ f.kind==='new' ? $t('new') : $t('changed') }}</span><span class="min-w-0 flex-1 break-all font-mono">{{ f.rel }}</span><span class="shrink-0 text-muted dark:text-night-muted">{{ size(f.size) }}</span></li>
            <li v-if="plan.counts.push > plan.pushInfo.length" class="pt-1 text-muted dark:text-night-muted">{{ $t('… and {0} more', [plan.counts.push - plan.pushInfo.length]) }}</li>
          </ul>
        </div>
        <p v-if="plan.counts.declined" class="mt-1 text-xs text-muted dark:text-night-muted">{{ $t('Changes you declined earlier: {0}.', [plan.counts.declined]) }} <button class="underline" @click="forget">{{ $t('Ask about them again') }}</button></p>
        <p v-if="plan.keptDeleted" class="mt-1 text-xs text-muted dark:text-night-muted">{{ $t('Files you deleted stay in the folder: {0}.', [plan.keptDeleted]) }}</p>
        <div class="mt-5 flex flex-wrap gap-2">
          <button v-if="plan.needsAnswer" class="btn-primary !py-1.5 text-sm" @click="startReview"><ic name="check" class="size-4"></ic>{{ $t('Review the changes one by one') }}</button>
          <button v-if="plan.needsAnswer && plan.target.mode!=='pull'" class="btn-soft !py-1.5 text-sm" @click="run('push')">{{ $t('Send only mine, leave theirs') }}</button>
          <button v-if="plan.needsAnswer && plan.target.mode!=='pull'" class="btn-ghost !py-1.5 text-sm text-clay-500" @click="confirmOverwrite">{{ $t('Overwrite theirs with mine') }}</button>
          <button v-if="!plan.needsAnswer && plan.target.mode!=='pull'" class="btn-primary !py-1.5 text-sm" @click="run('push')"><ic name="upload" class="size-4"></ic>{{ plan.counts.push ? $t('Copy {0} files', [plan.counts.push]) : $t('Nothing to copy; update the record') }}</button>
          <button class="btn-ghost !py-1.5 text-sm" @click="close">{{ $t('Cancel') }}</button>
        </div>
        <p v-if="plan.target.mode==='backup' && plan.mirror.length" class="mt-3 text-xs text-muted dark:text-night-muted">{{ $t('Files deleted here will be moved to _deleted in the copy: {0}.', [plan.mirror.length + plan.mirrorMore]) }}</p>
      </template>

      <!-- преглед промяна по промяна -->
      <template v-else-if="stage==='review'">
        <p class="mt-3 text-sm text-muted dark:text-night-muted">{{ $t('Choose what to take. What you leave stays as it is, and you are not asked about the same version again. Their deletions are ignored.') }}</p>
        <div class="mt-3 flex flex-wrap gap-2">
          <button class="btn-soft !py-1 text-xs" @click="takeAll(false)">{{ $t('Take all new') }}</button>
          <button class="btn-soft !py-1 text-xs" @click="takeAll(true)">{{ $t('Take all') }}</button>
          <button class="btn-ghost !py-1 text-xs" @click="skipAll">{{ $t('Skip all') }}</button>
        </div>
        <ul class="mt-4 space-y-2">
          <li v-for="it in items" :key="it.rel" class="rounded-2xl border border-line p-3 dark:border-night-line">
            <div class="flex flex-wrap items-center gap-2">
              <span :class="['chip', it.conflict ? 'bg-clay-100 text-clay-600 dark:bg-clay-500/20' : 'bg-sage-50 text-sage-700 dark:bg-sage-900/40 dark:text-sage-200']">{{ it.conflict ? $t('Both changed') : it.kind==='new' ? $t('New') : it.kind==='log' ? $t('Log') : $t('Changed') }}</span>
              <span class="min-w-0 flex-1 break-all font-mono text-xs">{{ it.rel }}<template v-if="it.kind==='log'"> · {{ $t('{0} new entries', [it.count]) }}</template></span>
              <div class="flex rounded-full border border-line p-0.5 text-xs dark:border-night-line" role="radiogroup">
                <button v-for="o in options(it)" :key="o.v" role="radio" :aria-checked="dec[it.rel]===o.v" :class="['rounded-full px-2.5 py-1 transition', dec[it.rel]===o.v ? 'bg-sage-600 text-white' : 'text-muted hover:text-ink dark:hover:text-night-ink']" @click="dec[it.rel]=o.v">{{ o.t }}</button>
              </div>
              <button v-if="it.text && it.kind!=='log'" class="btn-ghost !px-2 !py-1 text-xs" @click="toggle(it)">{{ open[it.rel] ? $t('Hide') : $t('Show') }}</button>
            </div>
            <div v-if="open[it.rel] && segs[it.rel]" class="mt-3 space-y-2">
              <template v-for="(g, gi) in segs[it.rel]" :key="gi">
                <p v-if="g.same" class="text-xs text-muted dark:text-night-muted">… {{ $t('{0} paragraphs are the same', [g.same.length]) }}</p>
                <div v-else class="rounded-xl border border-line p-2 dark:border-night-line">
                  <div class="grid gap-2 sm:grid-cols-2">
                    <div :class="['rounded-lg p-2 text-xs', (choices[it.rel][g.k]||'m')!=='t' ? 'bg-sage-50 dark:bg-sage-900/30' : 'opacity-60']"><p class="eyebrow">{{ $t('Mine') }}</p><p v-if="!g.mine.length" class="italic text-muted">{{ $t('nothing') }}</p><p v-for="(x, xi) in g.mine" :key="xi" class="mt-1 whitespace-pre-wrap break-words">{{ x }}</p></div>
                    <div :class="['rounded-lg p-2 text-xs', (choices[it.rel][g.k]||'m')!=='m' ? 'bg-amber-50 dark:bg-amber-500/10' : 'opacity-60']"><p class="eyebrow">{{ $t('Theirs') }}</p><p v-if="!g.theirs.length" class="italic text-muted">{{ $t('nothing') }}</p><p v-for="(x, xi) in g.theirs" :key="xi" class="mt-1 whitespace-pre-wrap break-words">{{ x }}</p></div>
                  </div>
                  <div class="mt-2 flex gap-1 text-xs">
                    <button v-for="o in [['m', $t('Keep mine')], ['t', $t('Take theirs')], ['b', $t('Both')]]" :key="o[0]" :class="['rounded-full border px-2.5 py-0.5', (choices[it.rel][g.k]||'m')===o[0] ? 'border-sage-500 bg-sage-50 text-sage-700 dark:bg-sage-900/40 dark:text-sage-200' : 'border-line dark:border-night-line']" @click="choose(it.rel, g.k, o[0])">{{ o[1] }}</button>
                  </div>
                </div>
              </template>
            </div>
            <p v-else-if="open[it.rel] && previews[it.rel]" class="mt-3 max-h-48 overflow-auto whitespace-pre-wrap rounded-xl bg-ink/5 p-2 text-xs dark:bg-white/5">{{ previews[it.rel] }}</p>
          </li>
        </ul>
        <p class="mt-4 text-xs text-muted dark:text-night-muted">{{ $t('Your versions of replaced files are saved in outputs/merged, and “Undo” in the history brings the pages back.') }}</p>
        <div class="mt-4 flex flex-wrap gap-2">
          <button class="btn-primary !py-1.5 text-sm" @click="run('review')"><ic name="check" class="size-4"></ic>{{ $t('Apply my choices') }}</button>
          <button class="btn-ghost !py-1.5 text-sm" @click="stage='plan'">{{ $t('Back') }}</button>
        </div>
      </template>

      <!-- готово -->
      <template v-else-if="stage==='result' && result">
        <p v-if="result.ok" class="mt-4 text-sm font-medium text-sage-700 dark:text-sage-200">{{ $t('Done.') }}</p>
        <p v-else class="mt-4 text-sm text-clay-500">{{ result.error }}</p>
        <ul v-if="result.ok" class="mt-2 space-y-1 text-sm">
          <li>{{ $t('Sent to the folder: {0} files.', [result.pushed]) }}</li>
          <li v-if="result.pulled || result.merged">{{ $t('Taken from the folder: {0}, merged by paragraph: {1}.', [result.pulled, result.merged]) }}</li>
          <li v-if="result.moved">{{ $t('Older versions kept in _deleted: {0}.', [result.moved]) }}</li>
          <li v-if="result.skipped">{{ $t('Left as they were: {0}.', [result.skipped]) }}</li>
          <li v-for="w in result.warnings" :key="w" class="text-clay-500">{{ w }}</li>
        </ul>
        <div class="mt-5 flex gap-2"><button class="btn-primary !py-1.5 text-sm" @click="close">{{ $t('Close') }}</button></div>
      </template>
      <p v-if="error" class="mt-3 text-sm text-clay-500">{{ error }}</p>
      <div v-if="stage==='pick' || (stage==='plan' && !plan)" class="mt-5"><button class="btn-ghost !py-1.5 text-sm" @click="close">{{ $t('Close') }}</button></div>
    </div>
  </div>
</div>
</script>

<script type="text/x-template" id="tpl-backup-settings">
<div>
  <section class="card mt-6 p-5">
    <h2 class="font-serif text-xl font-semibold">{{ $t('Backups and sync') }}</h2>
    <p class="mt-1 text-sm text-muted dark:text-night-muted">{{ $t('Copy the whole working library to another folder: another disk, a shared server, Google Drive, Dropbox or pCloud. Nothing runs by itself; you press the button. The copy has no node_modules and can bring the library back on a new computer.') }}</p>
    <p v-if="isolated" class="mt-3 rounded-2xl bg-amber-50 p-3 text-sm dark:bg-amber-500/10">{{ $t('Copies to other folders are not available in the isolated mode yet. Start the library with “npm run serve”.') }}</p>
    <ul v-if="targets.length" class="mt-4 divide-y divide-line dark:divide-night-line">
      <li v-for="t in targets" :key="t.id" class="py-3">
        <div class="flex flex-wrap items-center gap-2">
          <span class="min-w-0 flex-1"><span class="block truncate font-medium">{{ t.name }}</span><span class="block break-all text-xs text-muted dark:text-night-muted">{{ t.path }}</span></span>
          <span class="chip bg-ink/5 dark:bg-white/10">{{ modeLabel(t.mode) }}</span>
          <span v-if="!t.online" class="chip bg-clay-100 text-clay-600 dark:bg-clay-500/20">{{ $t('Not available') }}</span>
          <button class="btn-primary !py-1 text-xs" :disabled="!t.online || isolated" @click="$root.openSync(t.id)"><ic name="refresh" class="size-3.5"></ic>{{ $t('Copy now') }}</button>
          <button class="btn-ghost !py-1 text-xs" :disabled="!t.online" @click="verify(t)">{{ $t('Check the copy') }}</button>
          <button class="btn-ghost !p-1.5 text-muted hover:text-clay-500" :title="$t('Delete')" :aria-label="$t('Delete')" @click="remove(t)"><ic name="trash" class="size-4"></ic></button>
        </div>
        <p class="mt-1 text-xs text-muted dark:text-night-muted">{{ t.last ? $t('Last: {0}. Sent {1}, taken {2}.', [ago(t.last.at), t.last.pushed, t.last.pulled]) : $t('Never copied') }}<template v-if="t.free != null"> · {{ $t('Free space: {0}', [size(t.free)]) }}</template></p>
        <p v-if="checks[t.id]" class="mt-1 text-xs" :class="checks[t.id].ok && !checks[t.id].missingCount && !checks[t.id].differentCount ? 'text-sage-700 dark:text-sage-200' : 'text-clay-500'">
          {{ !checks[t.id].ok ? checks[t.id].error : (checks[t.id].missingCount || checks[t.id].differentCount) ? $t('Missing in the copy: {0}, different: {1} (of {2}).', [checks[t.id].missingCount, checks[t.id].differentCount, checks[t.id].files]) : $t('The copy has all {0} files and they are the same.', [checks[t.id].files]) }}
        </p>
      </li>
    </ul>
    <p v-else class="mt-4 text-sm text-muted dark:text-night-muted">{{ $t('There are no copies yet.') }}</p>
  </section>

  <form class="card mt-6 p-5" @submit.prevent="add">
    <h2 class="font-serif text-xl font-semibold">{{ $t('Add a copy') }}</h2>
    <div class="mt-3 grid gap-3 sm:grid-cols-2">
      <label class="text-sm">{{ $t('Name') }}<input v-model="form.name" class="mt-1 w-full rounded-xl border border-line bg-panel px-3 py-2 text-sm outline-none focus:border-sage-400 dark:border-night-line dark:bg-night-panel" :placeholder="$t('E.g. Disk D')"></label>
      <label class="text-sm">{{ $t('Folder') }}<input v-model="form.path" @blur="test" class="mt-1 w-full rounded-xl border border-line bg-panel px-3 py-2 font-mono text-xs outline-none focus:border-sage-400 dark:border-night-line dark:bg-night-panel" placeholder="/mnt/d/llm-wiki-backup  ·  D:\llm-wiki-backup"></label>
    </div>
    <p v-if="probe" class="mt-2 text-xs" :class="probe.ok ? 'text-sage-700 dark:text-sage-200' : 'text-clay-500'">{{ probe.ok ? (probe.exists ? (probe.empty ? $t('The folder is empty and can be written.') : $t('The folder has files; only the library files will be added.')) : $t('The folder will be created.')) : probe.error }}<template v-if="probe.ok && probe.free != null"> · {{ $t('Free space: {0}', [size(probe.free)]) }}</template></p>
    <fieldset class="mt-4 space-y-2" role="radiogroup" :aria-label="$t('Kind of copy')">
      <label v-for="m in ['backup','sync','pull']" :key="m" :class="['flex cursor-pointer items-start gap-2 rounded-2xl border p-3 text-sm', form.mode===m ? 'border-sage-500 bg-sage-50 dark:bg-sage-900/30' : 'border-line dark:border-night-line']">
        <input type="radio" class="mt-1 accent-sage-600" :value="m" v-model="form.mode">
        <span><span class="block font-medium">{{ modeLabel(m) }}</span><span class="block text-xs text-muted dark:text-night-muted">{{ modeHint(m) }}</span></span>
      </label>
    </fieldset>
    <div class="mt-3 space-y-1 text-sm">
      <label v-if="form.mode==='backup'" class="flex items-start gap-2"><input type="checkbox" class="mt-1 accent-sage-600" v-model="form.code"><span>{{ $t('Include the program code (without node_modules), so the folder is a complete project') }}</span></label>
      <label v-if="form.mode==='backup'" class="flex items-start gap-2"><input type="checkbox" class="mt-1 accent-sage-600" v-model="form.secrets"><span>{{ $t('Include the keys and the password (only if the folder is private)') }}</span></label>
      <label v-if="form.mode!=='pull'" class="flex items-center gap-2">{{ $t('Keep older versions and deleted files for') }}<input type="number" min="1" max="3650" v-model.number="form.keepDays" class="w-20 rounded-lg border border-line bg-panel px-2 py-1 text-sm dark:border-night-line dark:bg-night-panel">{{ $t('days') }}</label>
    </div>
    <p v-if="error" class="mt-3 text-sm text-clay-500">{{ error }}</p>
    <button class="btn-primary mt-4 !py-1.5 text-sm" :disabled="!form.name.trim() || !form.path.trim() || busy || isolated"><ic :name="busy ? 'spinner' : 'check'" :class="['size-4', busy && 'animate-spin']"></ic>{{ $t('Add') }}</button>
  </form>

  <section class="card mt-6 p-5 text-sm">
    <h2 class="font-serif text-xl font-semibold">{{ $t('Bringing the library back') }}</h2>
    <p class="mt-1 text-muted dark:text-night-muted">{{ $t('On a new computer: clone the program from GitHub (or take the code from a copy that includes it), run “npm ci”, then restore the library from the copy folder:') }}</p>
    <pre class="mt-2 overflow-x-auto rounded-xl bg-ink/5 p-3 text-xs dark:bg-white/5">npm run restore -- /path/to/copy
npm run restore -- /path/to/copy --apply</pre>
    <p class="mt-2 text-xs text-muted dark:text-night-muted">{{ $t('The first command only shows what would be restored. The second restores it.') }}</p>
  </section>
</div>
</script>

<script type="text/x-template" id="tpl-collection">
<div class="mx-auto max-w-6xl px-5 py-8 sm:px-8 lg:py-12">
  <div class="flex flex-wrap items-end justify-between gap-4 animate-rise">
    <div class="min-w-0">
      <p class="eyebrow">{{ custom ? (isList ? $t('List') : $t('Smart collection')) : tag ? $t('Tag') : $t('Collection') }}</p>
      <h1 class="mt-2 flex items-center gap-3 font-serif text-4xl font-semibold tracking-tight">
        <span v-if="!tag" :class="['grid size-11 shrink-0 place-items-center rounded-2xl', T.soft]"><ic :name="T.icon" class="size-5"></ic></span>
        <span class="min-w-0 break-words">{{ heading }}</span>

      <p v-if="subtitle" class="mt-2 text-muted dark:text-night-muted">{{ subtitle }}</p>
